  const app=document.getElementById('app'),cr=document.getElementById('crumb');
  cr.textContent='› Simulations';
  app.innerHTML=`${v4Topbar()}<section class="v4-section"><h2>Mini-simulations visuelles</h2><div class="hint">Outils pédagogiques destinés à visualiser les relations du cours. Ils ne remplacent pas les données opérationnelles, les abaques ou les tables avion.</div><div class="v4-tools">
    <div class="v4-tool"><h3>⛽ Temps & carburant</h3><p class="sub">Visualise comment la distance, la vitesse sol et le débit influencent le temps de vol et la consommation.</p><label>Distance (NM)</label><input id="t-fuel-dist" type="number" class="v4-input" value="180" oninput="v4CalcFuel()"><label>Ground speed (kt)</label><input id="t-fuel-gs" type="number" class="v4-input" value="120" oninput="v4CalcFuel()"><label>Débit carburant / h</label><input id="t-fuel-flow" type="number" class="v4-input" value="36" oninput="v4CalcFuel()"><div id="t-fuel-out" class="v4-tool-output"></div></div>
    <div class="v4-tool"><h3>🌡 Altitude-densité</h3><p class="sub">Compare l'altitude-pression à l'altitude-densité et vois immédiatement l'effet d'un air plus chaud ou plus froid que l'ISA.</p><label>Pressure altitude (ft)</label><input id="t-da-pa" type="number" class="v4-input" value="5000" oninput="v4CalcDA()"><label>OAT (°C)</label><input id="t-da-oat" type="number" class="v4-input" value="25" oninput="v4CalcDA()"><div id="t-da-out" class="v4-tool-output"></div></div>
    <div class="v4-tool"><h3>⚖ Centre de gravité</h3><p class="sub">Observe comment deux masses placées à des bras différents déplacent le centre de gravité résultant.</p><label>Masse 1 / bras 1</label><div class="v4-dual-input"><input id="t-cg-m1" type="number" class="v4-input" value="600" oninput="v4CalcCG()"><input id="t-cg-a1" type="number" step="0.1" class="v4-input" value="2.1" oninput="v4CalcCG()"></div><label>Masse 2 / bras 2</label><div class="v4-dual-input"><input id="t-cg-m2" type="number" class="v4-input" value="400" oninput="v4CalcCG()"><input id="t-cg-a2" type="number" step="0.1" class="v4-input" value="3.5" oninput="v4CalcCG()"></div><div id="t-cg-out" class="v4-tool-output"></div></div>
    <div class="v4-tool"><h3>✈ Décrochage & facteur de charge</h3><p class="sub">Mets en relation la vitesse de décrochage de base et son augmentation quand le facteur de charge augmente.</p><label>Vs à 1 g (kt)</label><input id="t-st-vs" type="number" class="v4-input" value="50" oninput="v4CalcStall()"><label>Facteur de charge n</label><input id="t-st-n" type="number" step="0.1" class="v4-input" value="2" oninput="v4CalcStall()"><div id="t-st-out" class="v4-tool-output"></div></div>
    <div class="v4-tool"><h3>🧭 Triangle des vitesses</h3><p class="sub">Le schéma vectoriel montre le lien entre TAS, vent, cap corrigé et vitesse sol.</p><label>TAS (kt)</label><input id="t-w-tas" type="number" class="v4-input" value="120" oninput="v4CalcWind()"><label>Route (°)</label><input id="t-w-crs" type="number" class="v4-input" value="90" oninput="v4CalcWind()"><label>Vent FROM (°)</label><input id="t-w-dir" type="number" class="v4-input" value="180" oninput="v4CalcWind()"><label>Vent (kt)</label><input id="t-w-ws" type="number" class="v4-input" value="20" oninput="v4CalcWind()"><div id="t-w-out" class="v4-tool-output"></div></div>
  </div></section>`;
  setTimeout(()=>{v4CalcFuel();v4CalcDA();v4CalcCG();v4CalcStall();v4CalcWind()},0)
}

const V53_EN_TRANSLATOR={instance:null,unavailable:false,busy:false};
function v53CacheKey(text){return 'fren:'+v5Hash(text)}
function v53LikelyFrench(text){text=String(text||'').trim();if(text.length<2)return false;if(/[àâäçéèêëîïôöùûüÿœ]/i.test(text))return true;return /\b(le|la|les|des|du|une|un|dans|avec|pour|sur|est|sont|plus|moins|qui|que|quoi|comme|sans|avant|après|chapitre|cours|révision|examen|question|réponse|notion|vol|aéronef|vitesse|masse|altitude|pression|température|carburant|vent|décollage|atterrissage|pilote|règle|source|champ|conditions|responsable|action|comprendre|mémoriser|piège|formule|résultat|situation)\b/i.test(text)}
async function v53TranslateFREN(text){
  text=String(text||'').trim();if(!text||!v53LikelyFrench(text))return text;
  const s=v4Load(),ck=v53CacheKey(text);if(s.translationCache&&s.translationCache[ck])return s.translationCache[ck];
  let out='';
  try{if(typeof Translator!=='undefined'&&Translator.create){if(!V53_EN_TRANSLATOR.instance)V53_EN_TRANSLATOR.instance=await Translator.create({sourceLanguage:'fr',targetLanguage:'en'});out=await V53_EN_TRANSLATOR.instance.translate(text)}}catch(e){V53_EN_TRANSLATOR.unavailable=true}
  if(!out){try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,480))+'&langpair=fr%7Cen');if(r.ok){const j=await r.json();out=(j&&j.responseData&&j.responseData.translatedText)||''}}catch(e){}}
  if(!out){try{const r=await fetch('https://fr.libretranslate.com/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:text,source:'fr',target:'en',format:'text'})});if(r.ok){const j=await r.json();out=j&&j.translatedText||''}}catch(e){}}
  if(out&&out!==text){const ss=v4Load();ss.translationCache[ck]=out;v4Save(ss)}
  return out||text
}
function v53TranslateEligibleNode(node){
  const p=node.parentElement;if(!p)return false;
  if(p.closest('script,style,code,pre,textarea,input,select,.v4-public-chapter-q,.v5-question-main,.v5-question-side,.v5-lang-toggle,.v5-profile-overlay'))return false;
  const t=(node.nodeValue||'').trim();return t.length>1&&v53LikelyFrench(t)
}
async function v53ApplyEnglishToApp(){
  if(v4CourseLang()!=='en'||V53_EN_TRANSLATOR.busy)return;
  if(['examrun','examresult'].includes(V4View.type))return;
  const root=document.getElementById('app');if(!root)return;
  document.documentElement.lang='en';
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];let n;while(n=walker.nextNode()){if(v53TranslateEligibleNode(n))nodes.push(n)}
  if(!nodes.length)return;
  V53_EN_TRANSLATOR.busy=true;
  let badge=document.getElementById('v5-translate-status');if(!badge){badge=document.createElement('div');badge.id='v5-translate-status';badge.className='v5-translate-status';document.body.appendChild(badge)}badge.textContent=`Translating course… 0/${nodes.length}`;
  let done=0;
  const worker=async()=>{while(nodes.length){const node=nodes.shift();if(!node||!node.parentElement||!root.isConnected)continue;const original=node.nodeValue,trim=original.trim();const tr=await v53TranslateFREN(trim);if(node.parentElement&&root.isConnected&&v4CourseLang()==='en'&&tr&&tr!==trim){const lead=original.match(/^\s*/)?.[0]||'',tail=original.match(/\s*$/)?.[0]||'';node.nodeValue=lead+tr+tail}done++;if(badge)badge.textContent=`Translating course… ${done}/${done+nodes.length}`}}
  await Promise.all(Array.from({length:Math.min(4,nodes.length||1)},worker));
  if(badge){badge.textContent='English course ready ✓';setTimeout(()=>{if(badge&&badge.parentNode)badge.remove()},1200)}
  V53_EN_TRANSLATOR.busy=false
}
function v53AfterRender(){document.documentElement.lang=v4CourseLang();if(v4CourseLang()==='en')setTimeout(v53ApplyEnglishToApp,30)}
const _v4LegacyNav=nav;
nav=function(m,c){if(m!==undefined&&c!==undefined&&c!==null)v4OpenChapter(m,c);V4View={type:'course'};V={m:m??null,c:c??null};render();scrollTo(0,0)};
const _v4PreviousRender=render;
render=function(){const app=document.getElementById('app');if(!app)return;switch(V4View.type){case'home':return renderV4Home();case'learn':return renderV4Learn();case'review':return renderV4Review();case'exam':return renderV4ExamSetup();case'examrun':return renderV4ExamRun();case'examresult':return renderV4ExamResult();case'search':return renderV4Search();case'notes':return renderV4Notes();case'tools':return renderV4Tools();case'quick':return renderV4Quick();case'course':default:if(V.m){const m=MODS.find(x=>x.c===V.m);if(m){if(V.c===null)return renderV4Module(m);if(m.d&&m.d[V.c])return renderV4Lesson(m,m.d[V.c],V.c)}}return renderV4Home()}};
const _v53RenderBase=render;
render=function(){const r=_v53RenderBase();v53AfterRender();return r};
V4View={type:'home'};
render();
</script>


<button id="v6-install-btn" onclick="v6InstallApp()">⬇️ Installer ATPL Campus</button>
<div id="v6-offline">📴 Mode hors connexion</div>
<script id="v6-pwa-runtime">
let V6_INSTALL_PROMPT=null;
function v6Standalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function v6IOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
function v6UpdateInstallUI(){
  const b=document.getElementById('v6-install-btn');
  const s=document.getElementById('v6-profile-install-status');
  if(v6Standalone()){
    if(b)b.style.display='none';
    if(s)s.textContent='ATPL Campus est déjà installé sur cet appareil.';
    return;
  }
  if(b)b.style.display=(V6_INSTALL_PROMPT||v6IOS())?'inline-flex':'none';
  if(s)s.textContent=v6IOS()?'Sur iPhone/iPad : Safari → Partager → Sur l’écran d’accueil.':'Installation disponible lorsque le navigateur la propose.';
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();V6_INSTALL_PROMPT=e;v6UpdateInstallUI()});
window.addEventListener('appinstalled',()=>{V6_INSTALL_PROMPT=null;v6UpdateInstallUI()});
async function v6InstallApp(){
  if(v6Standalone()){alert('ATPL Campus est déjà installé sur cet appareil.');return}
  if(V6_INSTALL_PROMPT){
    V6_INSTALL_PROMPT.prompt();
    try{await V6_INSTALL_PROMPT.userChoice}catch(e){}
    V6_INSTALL_PROMPT=null;v6UpdateInstallUI();return;
  }
  if(v6IOS()){
    alert('Sur iPhone/iPad : ouvre ATPL Campus dans Safari, touche Partager, puis « Sur l’écran d’accueil ».');return;
  }
  alert('Ouvre le menu du navigateur puis choisis « Installer l’application » ou « Ajouter à l’écran d’accueil ».');
}
function v6OfflineUI(){const x=document.getElementById('v6-offline');if(x)x.style.display=navigator.onLine?'none':'block'}
window.addEventListener('online',v6OfflineUI);window.addEventListener('offline',v6OfflineUI);
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){console.info('ATPL Campus update ready')}})});
  }).catch(err=>console.warn('Service worker unavailable',err)));
}
document.addEventListener('DOMContentLoaded',()=>{v6UpdateInstallUI();v6OfflineUI()});
</script>
