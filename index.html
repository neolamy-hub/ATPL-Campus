<style>

.studybar{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 12px}.studybar button{width:100%}.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin:0 0 12px}.panel h3{margin-top:0}.qopt{display:block;width:100%;text-align:left;background:var(--soft);color:var(--text);margin:7px 0}.qopt.ok{outline:2px solid #16a34a}.qopt.bad{outline:2px solid #dc2626}.answer{margin-top:10px;padding:10px;border-radius:10px;background:var(--soft);font-size:.86rem}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--soft);padding:10px;border-radius:10px;text-align:center}.stat b{display:block;font-size:1.15rem}.searchbox{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);margin-bottom:10px}.flash{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--soft);border-radius:12px;padding:18px;font-size:1rem;font-weight:600;cursor:pointer}.calcgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.calcgrid input{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text)}@media(max-width:420px){.calcgrid,.studybar{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr 1fr}}

/* ===== V3 VISUAL / PEDAGOGICAL OVERHAUL ===== */
:root{--bg:#eef2f7;--card:#ffffff;--text:#152033;--muted:#64748b;--accent:#2563eb;--soft:#eef4ff;--border:#dbe3ef;--shadow:0 8px 28px rgba(15,23,42,.07);--radius:18px}

body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 10% -5%,rgba(37,99,235,.10),transparent 32%),var(--bg);line-height:1.62}
.wrap{max-width:980px;padding:20px 16px 80px}

.hero h1{font-size:clamp(1.35rem,4vw,2rem);letter-spacing:-.02em;position:relative;z-index:1}.hero p{max-width:680px;position:relative;z-index:1}
.grid{grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}.mod{min-height:145px;border-radius:20px;padding:17px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}.mod:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,23,42,.13)}.mod .e{font-size:2rem}.mod b{font-size:1rem}.mod small{font-size:.76rem}
.item{border-radius:15px;padding:15px 16px;box-shadow:0 3px 12px rgba(15,23,42,.035);transition:.15s}.item:hover{transform:translateX(2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.art{border-radius:20px;padding:0;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}.art svg{min-height:180px}
.studybar{grid-template-columns:repeat(4,1fr);position:sticky;top:57px;z-index:4;padding:9px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-radius:16px;margin-bottom:14px}.studybar button{border-radius:13px;box-shadow:0 4px 12px rgba(37,99,235,.16)}
.lesson-head{background:linear-gradient(135deg,var(--card),var(--soft));border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}.lesson-kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--accent)}.lesson-title{font-size:clamp(1.35rem,4vw,1.85rem);margin:3px 0 7px;line-height:1.15}.progressline{height:7px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:13px}.progressline span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#22c55e);border-radius:99px}
.objectifs,.concept,.example-card,.formula-card,.warning-card,.memory-card{border:1px solid var(--border);border-radius:17px;padding:16px 17px;margin:13px 0;background:var(--card);box-shadow:0 5px 18px rgba(15,23,42,.045)}
.objectifs{background:linear-gradient(135deg,var(--soft),var(--card))}.objectifs h3,.concept h3,.example-card h3,.formula-card h3,.warning-card h3,.memory-card h3{margin:0 0 8px;font-size:.94rem}.objectifs ul,.memory-card ul,.warning-card ul,.formula-card ul{margin:0;padding-left:20px}.concept{border-left:4px solid var(--accent)}.concept h3{color:var(--text);font-size:1.02rem}.concept p{font-size:.97rem;line-height:1.72;margin:0}.section-index{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:9px;background:var(--accent);color:#fff;font-size:.74rem;margin-right:7px}
.example-card{background:linear-gradient(135deg,#fff7ed,var(--card));border-color:#fed7aa}.formula-card{background:linear-gradient(135deg,var(--soft),var(--card))}.warning-card{background:linear-gradient(135deg,#fff1f2,var(--card));border-color:#fecdd3}.memory-card{background:linear-gradient(135deg,#f0fdf4,var(--card));border-color:#bbf7d0}
.dark .example-card{background:var(--card)}
.course-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.course-nav button{min-height:48px}.course-nav button:disabled{opacity:.35}
.panel{border-radius:18px;box-shadow:var(--shadow);padding:17px}.flash{min-height:190px;border-radius:18px;font-size:1.08rem}.qopt{border-radius:13px}.fiche{border-radius:18px;box-shadow:var(--shadow)}
.searchbox{font-size:1rem;border-radius:13px}
@media(max-width:650px){.wrap{padding:14px 12px 70px}.studybar{grid-template-columns:repeat(2,1fr);top:52px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.mod{min-height:125px;padding:14px}.mod .e{font-size:1.6rem}.hero{padding:22px 18px}.art svg{min-height:155px}.concept p{font-size:.93rem}.course-nav{grid-template-columns:1fr}.lesson-head{padding:17px}}

/* ===== COURS APPROFONDIS V3.1 ===== */
.deep-section{padding:22px 0;border-bottom:1px solid var(--border)}
.deep-section h3{margin-top:0;font-size:1.05rem;display:flex;align-items:center;gap:10px}
.deep-body{background:linear-gradient(180deg,var(--soft),transparent);border-radius:16px;padding:14px 16px}
.deep-p{margin:0 0 12px;line-height:1.72;font-size:.98rem}

.deep-dot{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-size:.75rem;font-weight:800;margin-right:9px;vertical-align:middle}
.why-card{margin-top:14px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--card);border-radius:12px;box-shadow:0 5px 18px rgba(0,0,0,.05)}

.deep-atpl{display:block}

.deep-atpl .long-explain p:last-child{margin-bottom:0}

@media(max-width:650px){.deep-atpl .terms-grid,.deep-atpl .linkbox{grid-template-columns:1fr}.deep-atpl .long-explain p{font-size:.92rem}}

body{letter-spacing:-.006em;background:radial-gradient(circle at 18% -8%,rgba(96,165,250,.18),transparent 26%),radial-gradient(circle at 92% 8%,rgba(196,181,253,.14),transparent 25%),var(--bg)}

<style id="v4-style">

.v5-qbank-hero{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;align-items:stretch}.v5-qbank-card{border:1px solid var(--border);border-radius:22px;padding:18px;background:linear-gradient(145deg,var(--card),var(--soft));box-shadow:0 12px 34px rgba(15,23,42,.06)}.v5-qbank-card h2,.v5-qbank-card h3{margin-top:0}.v5-mode-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.v5-mode-tab{padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer}.v5-mode-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.v5-filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.v5-filter-card{padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--soft)}.v5-filter-card label{font-size:.75rem;color:var(--muted);display:block;margin-bottom:5px}.v5-qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:12px 0}.v5-qnav button{height:36px;border-radius:9px;border:1px solid var(--border);background:var(--card);font-weight:700;cursor:pointer}.v5-qnav button.answered{background:#dbeafe;border-color:#60a5fa}.v5-qnav button.current{outline:2px solid var(--accent);outline-offset:1px}.v5-qnav button.flag-red{box-shadow:inset 0 -4px 0 #ef4444}.v5-qnav button.flag-yellow{box-shadow:inset 0 -4px 0 #f59e0b}.v5-qnav button.flag-green{box-shadow:inset 0 -4px 0 #22c55e}.v5-question-shell{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}.v5-question-main,.v5-question-side{border:1px solid var(--border);border-radius:20px;background:var(--card);padding:16px}.v5-question-side{align-self:start;position:sticky;top:12px}.v5-qmeta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-bottom:10px}.v5-flag-row{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.v5-flag-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer}.v5-flag-btn.active{outline:2px solid currentColor}.v5-flag-btn.green{color:#16a34a}.v5-flag-btn.yellow{color:#d97706}.v5-flag-btn.red{color:#dc2626}.v5-q-note{width:100%;min-height:90px;box-sizing:border-box;border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--soft);color:var(--text);resize:vertical}.v5-study-feedback{margin-top:14px;padding:14px;border-radius:16px;background:var(--soft);border:1px solid var(--border)}.v5-study-feedback.good{border-left:5px solid #16a34a}.v5-study-feedback.bad{border-left:5px solid #dc2626}.v5-lang-toggle{display:inline-flex;gap:6px;padding:4px;border-radius:12px;background:var(--soft);border:1px solid var(--border)}.v5-lang-toggle button{border:0;background:transparent;padding:6px 9px;border-radius:8px;cursor:pointer}.v5-lang-toggle button.active{background:var(--card);box-shadow:0 2px 8px rgba(15,23,42,.08)}.v5-qbank-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.v5-qbank-stats .v4-stat{min-width:0}.v5-session-progress{height:8px;border-radius:999px;background:var(--border);overflow:hidden;margin-top:8px}.v5-session-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#22c55e)}.v5-pass{color:#16a34a}.v5-fail{color:#dc2626}@media(max-width:900px){.v5-qbank-hero,.v5-question-shell{grid-template-columns:1fr}.v5-question-side{position:static}.v5-qbank-stats{grid-template-columns:repeat(2,1fr)}}
.v5-profile-overlay{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.52);backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px}.v5-profile-modal{width:min(520px,100%);background:var(--card);border:1px solid var(--border);border-radius:24px;padding:22px;box-shadow:0 28px 80px rgba(15,23,42,.28)}.v5-profile-modal h2{margin:0 0 6px}.v5-profile-modal .sub{color:var(--muted);font-size:.84rem;line-height:1.5;margin-bottom:16px}.v5-profile-field{margin:14px 0}.v5-profile-field label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:6px}.v5-lang-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.v5-lang-card{border:1px solid var(--border);border-radius:16px;padding:14px;background:var(--soft);cursor:pointer;text-align:left}.v5-lang-card.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent);background:var(--card)}.v5-lang-card b{display:block;margin-bottom:4px}.v5-lang-card small{color:var(--muted);line-height:1.35}.v5-profile-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.v5-language-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.14);font-size:.7rem}.v5-translate-status{position:fixed;right:18px;bottom:18px;z-index:9998;padding:9px 12px;border-radius:999px;background:rgba(15,23,42,.9);color:white;font-size:.76rem;box-shadow:0 10px 30px rgba(15,23,42,.22)}

<script>
const CH=[{"id":"081 01","t":"Aérodynamique subsonique","syllabus":"081 01 00 00","cours":[["Pression et écoulement","Dans un écoulement subsonique incompressible idéal, Bernoulli relie pression statique et vitesse le long d’une ligne de courant. La portance réelle résulte de distribution de pression autour du profil et déviation du flux ; “air doit se rejoindre au bord de fuite” est une fausse explication."],["Profil, incidence et CL","Angle of attack est angle corde–vent relatif. Pour plage linéaire, CL augmente presque linéairement avec α jusqu’aux non-linéarités/stall. Camber et high-lift devices déplacent courbe CL et augmentent CLmax, généralement avec drag/pitch changes."],["Portance","L = ½ρV²SCL. En vol horizontal, L≈W ; si vitesse diminue, CL doit augmenter via α/configuration. Une masse plus élevée exige CL ou V plus élevés. Load factor n=L/W."],["Traînée","Parasite drag ~V² ; induced drag ~1/V² à portance requise donnée. Total drag est somme, minimum près intersection. L/D max correspond meilleur glide angle en air calme et vitesse liée masse via √W."],["Aile finie","Tip vortices créent downwash, réduisent effective AoA et induisent drag. Aspect ratio élevé réduit induced drag. Winglets modifient champ vortex et efficacité mais ne “suppriment” pas vortices."],["Effet de sol","Près sol, downwash/vortices diminuent : induced drag baisse et lift curve change. Avion peut flotter à l’atterrissage ou quitter le sol sans pouvoir monter hors ground effect si performance insuffisante."],["High-lift devices","Slats retardent séparation/augmentent αcrit et CLmax ; flaps augmentent camber et souvent surface, augmentant CLmax mais aussi drag. Configuration optimale décollage cherche compromis lift/drag."],["Couche limite, traînée et hypersustentation","La couche limite, laminaire ou turbulente, conditionne séparation, traînée et portance disponible. Il faut distinguer traînée parasite, traînée induite et effets des dispositifs hypersustentateurs. Les ailes ne “portent” pas par une seule explication simpliste : c’est l’ensemble pression/circulation/déflexion de la masse d’air qui compte."]],"pts":["L = ½ρV²SCL.","Parasite drag ↑ avec V² ; induced drag ↓ avec V².","L/Dmax = minimum drag / meilleur glide angle.","Aspect ratio élevé réduit induced drag.","Ground effect réduit induced drag.","Traînée induite et traînée parasite évoluent en sens inverse avec la vitesse."],"f":[["Portance","L = ½ρV²SCL"],["Facteur de charge","n = L/W"]],"pieges":["Bernoulli seul n’explique pas toute la portance.","Best glide angle et minimum sink speed ne sont pas identiques."],"ex":"Si vitesse passe 100→80 kt à même W/ρ/S, CL requis est multiplié par (100/80)²=1,56.","mod":"081 Principles of Flight","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 081","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"081 02","t":"Aérodynamique grande vitesse","syllabus":"081 02 00 00","cours":[["Mach et compressibilité","M=TAS/a. Quand M augmente, densité n’est plus approximativement constante dans perturbations ; vitesse locale sur extrados peut atteindre M=1 alors que Mach avion <1. Mcrit est Mach avion au premier point sonic."],["Shock waves","Une onde de choc normale provoque hausse brusque pression/température/densité et baisse Mach, avec perte de total pressure/énergie. Elle peut induire séparation couche limite et buffet. Oblique shocks apparaissent sur géométries/écoulements supersoniques."],["Drag rise","Au-delà Mcrit, shocks et séparation augmentent wave drag ; drag divergence Mach marque croissance rapide. Sweepback réduit composante normale au bord d’attaque, retardant effets compressibilité."],["Mach tuck","Déplacement du centre de pression et changements empennage peuvent créer tendance nose-down. Mach trim/stabilizer compensent. À haute altitude, marge entre low-speed buffet et high-speed buffet peut se réduire : coffin corner."],["Supercritical aerofoil","Extrados plus plat et aft camber contrôlent accélération, retardent/affaiblissent shock et réduisent wave drag. Vortex generators énergisent couche limite pour retarder séparation post-shock."],["Température et vitesse du son","a≈√(γRT), donc baisse avec température. À Mach constant, TAS est plus faible dans air froid. Impact temperature/TAT augmente par ram rise et permet dériver SAT."],["Mach critique et ondes de choc","Quand le nombre de Mach augmente, certaines zones de l’écoulement peuvent atteindre Mach 1 avant l’avion entier. Cela conduit à l’apparition d’ondes de choc, à la hausse de traînée et parfois à une séparation de couche limite. Le Mach critique et le buffet transsonique sont donc des notions centrales."]],"pts":["Mcrit = premier sonic local, pas Mach 1 avion.","Shock normal : pression/température ↑, Mach ↓, total pressure ↓.","Sweep retarde effets compressibilité.","Coffin corner = convergence buffet basse/haute vitesse.","a dépend surtout température absolue.","Mach critique = apparition locale de Mach 1, pas vol globalement supersonique."],"f":[["Mach","M = TAS / a"],["Vitesse du son","a = √(γRT)"]],"pieges":["Mach et TAS ne varient pas toujours dans même sens avec altitude/température.","Shock n’est pas une “simple zone de turbulence”."],"ex":"À même Mach 0,78, TAS est plus faible dans air à −60 °C que −40 °C car vitesse du son est plus faible.","mod":"081 Principles of Flight","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 081","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"081 03","t":"Décrochage, Mach tuck et récupération d’upset","syllabus":"081 03 00 00","cours":[["Boundary layer et séparation","Laminar layer a faible skin friction mais moins d’énergie près paroi et sépare plus facilement sous adverse pressure gradient ; turbulent layer a plus friction mais résiste mieux séparation. Transition et séparation se déplacent avec α, roughness et Reynolds."],["Stall","Stall survient quand α dépasse valeur critique et séparation devient suffisante pour diminuer CL. Il peut survenir à toute vitesse/attitude. Stall speed est conséquence des conditions nécessaires pour atteindre CLmax, pas cause fondamentale du stall."],["Influences sur Vs","Vs ∝√(W/(ρSCLmax)) en TAS ; facteur de charge augmente Vs par √n. Ice réduit CLmax → Vs augmente ; flaps augmentent CLmax → Vs diminue. En virage horizontal n=1/cosφ."],["Aile en flèche et pitch-up","Sweep favorise spanwise flow et tip stall ; perte de lift arrière/tip peut produire pitch-up. Washout, fences, vortilons et slats améliorent comportement. T-tail peut subir deep stall si empennage est masqué par wake."],["Upset prevention/recovery","Priorités générales : reconnaître, déconnecter automation si nécessaire, gérer AoA avant altitude, appliquer commandes adaptées, éviter charges excessives. Nose-high et nose-low nécessitent stratégies différentes ; les procédures type avion/UPRT priment."],["Mach tuck","À haute vitesse, shock/CP shift peut créer nose-down ; récupération implique réduire Mach/charge dans limites, en tenant compte altitude et buffet."],["Avertisseurs, vrille et buffets","Le décrochage ne se résume pas à une vitesse : c’est d’abord un angle d’attaque critique. Les dispositifs d’alerte, les buffets et la récupération par réduction d’incidence doivent être compris clairement. Selon l’avion, la vrille peut être interdite, difficile à récupérer ou non certifiée."]],"pts":["Stall = α critique, pas vitesse particulière.","Vs(n)=Vs1g√n.","Laminar sépare plus facilement sous adverse gradient que turbulent.","Ice ↓CLmax → Vs↑.","Recovery upset privilégie AoA/énergie dans limites.","Sortir d’un décrochage commence par diminuer l’incidence avant toute autre considération."],"f":[["Stall load factor","Vs(n)=Vs1g × √n"],["Virage coordonné","n = 1/cosφ"]],"pieges":["Ne pas tirer pour “remonter” avant d’avoir réduit AoA lors d’un stall.","Stall warning peut changer avec g/configuration."],"ex":"Vs 50 kt à 1g ; à n=2 → 70,7 kt.","mod":"081 Principles of Flight","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 081","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"081 04","t":"Stabilité","syllabus":"081 04 00 00","cours":[["Statique et dynamique","Static stability décrit tendance initiale après perturbation ; dynamic stability décrit évolution temporelle. Un avion peut être statiquement stable mais dynamiquement divergent si oscillations augmentent."],["Longitudinale","CG devant neutral point donne positive static margin. Déplacer CG arrière réduit marge, efforts et stabilité ; au-delà neutral point, instabilité statique. Tailplane fournit généralement force nécessaire à équilibre et moment de rappel."],["Phugoid et short period","Short period : oscillation rapide AoA/pitch, vitesse peu changée ; phugoid : lente échange énergie cinétique/potentielle, AoA quasi constante. Damping dépend aérodynamique et systèmes."],["Directionnelle","Vertical tail produit weathercock stability : sideslip crée moment yaw de rappel. Dutch roll couple yaw/roll, particulièrement aile en flèche ; yaw damper augmente amortissement."],["Latérale","Dihedral effect, sweep, keel effect et wing position influencent roll response à sideslip. Spiral stability est mode lent combinant roll/yaw et peut être légèrement divergent sur certains avions."],["CG et manoeuvrabilité","Stabilité accrue implique généralement plus d’effort/trim et moins de manoeuvrabilité. Les limites CG avant/arrière équilibrent contrôle, stabilité et performance."],["Modes dynamiques","Phugoïde, short period, Dutch roll, spiral et roll subsidence sont des modes dynamiques classiques. Ils décrivent comment l’avion réagit dans le temps après une perturbation. Il faut distinguer stabilité statique et dynamique, ainsi que les axes concernés."]],"pts":["Static stability ≠ dynamic stability.","CG arrière réduit static margin.","Phugoid lent ; short period rapide.","Dutch roll = yaw+roll ; yaw damper l’amortit.","Spiral mode est distinct du Dutch roll.","Stabilité statique et dynamique sont liées, mais différentes."],"f":[],"pieges":["Stable statiquement ne veut pas dire oscillations toujours amorties.","Dihedral angle géométrique n’est pas seul contributeur à dihedral effect."],"ex":"Déplacer CG arrière peut réduire trim drag mais aussi réduire force de rappel en tangage et récupération stall.","mod":"081 Principles of Flight","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 081","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"081 05","t":"Contrôle et équilibrage","syllabus":"081 05 00 00","cours":[["Primary controls","Aileron→roll, elevator/stabilator→pitch, rudder→yaw. Effectiveness varie avec dynamic pressure ; à basse vitesse de grands débattements peuvent être nécessaires, à haute vitesse petites commandes créent fortes charges."],["Adverse yaw","Aileron down augmente lift/drag d’un côté, pouvant yaw opposé au roll. Differential ailerons, Frise ailerons et coordination rudder/spoilers réduisent."],["Tabs et trim","Trim tab crée hinge moment pour réduire force ; balance tab aide mouvement ; anti-balance augmente effort/stabilité ; servo tab peut déplacer surface principale. Trimmable stabilizer change incidence de tout empennage."],["Mass/aerodynamic balance","Aerodynamic balance réduit hinge moment par surface devant hinge ; mass balance place masse pour déplacer CG surface vers hinge et prévenir flutter. Ce sont objectifs différents."],["Powered controls","Hydraulic irreversible controls nécessitent artificial feel pour donner force proportionnelle à vitesse/charge. Q-feel ou spring feel recrée relation ; jam/reversion modes changent handling."],["Spoilers","Flight spoilers aident roll et speed brake ; ground spoilers détruisent lift et transfèrent poids sur roues pour freinage. Deployment asymétrique non commandé peut être sévère."],["Trim et commandes secondaires","Le trim réduit les efforts continus sur les commandes et participe à l’équilibre de l’avion. Sur certains avions, spoilers, tabs ou stabilisateur réglable jouent un rôle majeur dans le contrôle ou l’allègement de charge. Une panne de trim peut rapidement devenir un problème de pilotage sérieux."]],"pts":["Dynamic pressure détermine efficacité/efforts commande.","Adverse yaw s’oppose au roll initial.","Mass balance protège flutter ; aerodynamic balance réduit hinge moment.","Ground spoilers améliorent freinage en dumpant lift.","Piloter et trimmer sont deux actions liées mais distinctes."],"f":[],"pieges":["Trim tab, balance tab et servo tab ont fonctions différentes.","Mass balance n’a pas pour but principal de réduire effort pilote."],"ex":"Après touchdown, ground spoilers augmentent normal force roues : anti-skid/freins deviennent plus efficaces.","mod":"081 Principles of Flight","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 081","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"081 06","t":"Limitations et enveloppe V-n","syllabus":"081 06 00 00","cours":[["Facteur de charge","n=L/W. En virage horizontal coordonné n=1/cosφ. Charges structurales augmentent avec n ; occupant ressent apparent weight. Negative g impose charges opposées."],["V-n diagram","Axes vitesse et n. Stall boundaries augmentent comme V² jusqu’à atteindre limit load ; au-delà, structure/commandes limitent. VA est intersection stall line et positive limit load dans configuration/masse donnée."],["VA et masse","Comme Vs∝√W, VA diminue avec masse. Sous VA, une pleine commande brutale peut stall avant dépasser limit load dans conditions de définition, mais VA ne protège pas de toutes combinaisons/rafales ou inputs multi-axes."],["Gust envelope","Rafale change AoA et lift ; impact augmente avec TAS, lift-curve slope et air density. VB/VC/VD et design gust velocities définissent protection certification."],["Limit versus ultimate","Limit load = charge maximale prévue sans déformation permanente dommageable ; ultimate load = limit×safety factor, typiquement 1,5 pour structures conventionnelles certifiées. Dépasser limit load impose inspection même sans rupture."],["Vitesses limites","VNO, VNE, VMO/MMO, VFE, VLE/VLO et autres protègent structure/configuration. Certaines sont IAS, Mach ou fonction altitude ; respecter la nature de la limite."],["Facteur de charge et virages","En virage, l’augmentation du facteur de charge élève la vitesse de décrochage. Les rafales et manœuvres rapprochent aussi des limites de l’enveloppe V-n. Comprendre ce lien évite de considérer la vitesse de décrochage comme une valeur fixe et universelle."]],"pts":["n=L/W ; virage n=1/cosφ.","VA diminue avec masse.","Ultimate load est supérieur au limit load par safety factor.","VA ne protège pas de toute rafale/commande combinée.","VMO/MMO protège enveloppe haute vitesse.","Plus le facteur de charge augmente, plus la vitesse de décrochage augmente."],"f":[["Virage","n=1/cosφ"],["Manoeuvring speed approx","VA ∝ √W"]],"pieges":["VA n’est pas une vitesse “toujours sûre en turbulence sévère”.","Limit load dépassée n’implique pas rupture immédiate mais peut exiger inspection."],"ex":"À 60° de bank, n=2 et stall speed augmente de √2.","mod":"081 Principles of Flight","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 081","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"081 07","t":"Hélices","syllabus":"081 07 00 00","cours":[["Blade element","Une pale est une aile en rotation : vitesse locale augmente avec rayon, donc twist géométrique réduit angle de pale vers tip pour maintenir angle d’attaque efficace. Relative airflow combine rotation et forward speed."],["Angle de pale et pitch","Blade angle géométrique ≠ angle of attack. Geometric pitch est distance théorique sans slip ; effective pitch réelle est moindre. Fine pitch favorise RPM/accélération, coarse pitch croisière."],["Constant speed","Governor compare RPM sélectionné et réel puis modifie pitch via huile/contrepoids/ressort selon design. Overspeed tend à augmenter pitch sur systèmes conventionnels afin d’absorber plus couple ; logique fail-safe dépend type."],["Feather et reverse","Feather aligne pales presque avec flux afin de minimiser drag moteur inopérant. Reverse crée composante de poussée arrière après touchdown sur systèmes autorisés. Beta range permet contrôle direct blade angle au sol sur turboprop."],["Asymmetric effects","Torque roll, slipstream, gyroscopic precession et P-factor créent yaw/roll, surtout forte puissance/basse vitesse/fort α. Critical engine dépend sens rotation sur multi conventionnel."],["Efficiency","Prop efficiency dépend advance ratio, blade angle, Mach tip et état surface. Tip Mach élevé produit compressibility/noise ; diamètre/RPM sont donc limités."],["Hélice à pas variable et rendement","Une hélice à pas variable ou à vitesse constante cherche à maintenir un régime adapté aux conditions de vol. Le rendement hélice dépend de l’angle de pale, du régime, de la vitesse et de la densité de l’air. Le couple, le souffle hélicoïdal et les effets asymétriques doivent être replacés dans cette logique."]],"pts":["Blade angle ≠ blade AoA.","Constant-speed governor change pitch pour tenir RPM.","Feather minimise drag OEI.","P-factor augmente forte puissance/fort α.","Tip Mach limite diamètre/RPM.","Pas hélice, régime et rendement sont intimement liés."],"f":[["Vitesse de bout","Vtip = ω r"]],"pieges":["Fine pitch ne signifie pas forcément faible thrust dans toutes phases.","Feather n’est pas simplement “coarse pitch normal”."],"ex":"Rotor hélice 2 m de rayon à 1 200 RPM : ω≈125,7 rad/s, composante rotation tip≈251 m/s avant ajout forward speed.","mod":"081 Principles of Flight","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 081","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"081 08","t":"Mécanique du vol","syllabus":"081 08 00 00","cours":[["Équilibre","Steady level: L=W, T=D. Climb: composante poids s’oppose trajectoire ; descent inverse. Flight path angle dépend excès poussée ; rate dépend excès puissance."],["Virage","En virage coordonné horizontal, lift incline : vertical component=W, horizontal fournit centripetal force. Plus bank augmente, n et stall speed augmentent ; turn radius diminue avec bank et augmente avec V²."],["Montée","Best angle Vx maximise altitude/distance, best rate Vy altitude/temps. Pour jet, relations excès thrust/power diffèrent ; Vx/Vy évoluent avec altitude. Service ceiling défini par faible rate résiduel, absolute ceiling par rate zéro."],["Descente et plané","Best glide L/Dmax maximise distance en air calme ; minimum sink maximise durée. Vent change distance sol mais pas L/D aérodynamique ; headwind impose souvent vitesse plus élevée pour max ground range."],["Range/endurance","Jet max range lié fort L/D et vitesse appropriée/SFC ; prop max range proche min drag, max endurance proche min power dans modèle simple. Masse/altitude changent vitesses optimales."],["Énergie","Total energy combine altitude potentielle et vitesse cinétique. Un changement de trajectoire peut échanger l’une contre l’autre ; poussée modifie énergie totale. Energy management est fil commun approche, climb, upset recovery."],["Climb, glide, endurance et range","La mécanique du vol permet de relier puissances requise/disponible aux performances pratiques : meilleure pente, meilleur taux de montée, finesse maximale, endurance maximale et distance franchissable. Il faut distinguer vitesse donnant le meilleur angle et celle donnant le meilleur taux."]],"pts":["Virage : n=1/cosφ ; radius ∝V²/tanφ.","Vx = meilleur angle ; Vy = meilleur taux.","Best glide = L/Dmax ; minimum sink = min power condition.","Énergie totale = potentielle + cinétique.","Vx et Vy n’optimisent pas la même chose."],"f":[["Rayon virage","R = V²/(g tanφ)"],["Taux virage","ω = g tanφ / V"]],"pieges":["Vx/Vy ne sont pas fixes avec altitude pour tous types.","Best glide air distance et best ground range diffèrent avec vent."],"ex":"À vitesse doublée et même bank, rayon de virage quadruple.","mod":"081 Principles of Flight","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 081","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true}];

const clean=s=>String(s).replace(/≥/g,">=").replace(/≤/g,"<=").replace(/→/g,"->").replace(/⇒/g,"=>").replace(/≈/g,"~").replace(/∝/g,"prop.").replace(/[↑]/g,"(hausse)").replace(/[↓]/g,"(baisse)").replace(/[−–]/g,"-").replace(/½/g,"1/2").replace(/α/g,"alpha").replace(/ρ/g,"rho").replace(/π/g,"pi").replace(/σ/g,"sigma").replace(/√/g,"sqrt ").replace(/≠/g,"!=");
function draw(doc,c){
  const W=210;let y;
  doc.setFillColor(29,78,216);doc.rect(0,0,W,30,"F");
  doc.setTextColor(255);doc.setFont("helvetica","bold").setFontSize(16);doc.text(clean(c.id+" - "+c.t),15,14);
  doc.setFont("helvetica","normal").setFontSize(10);doc.text("Fiche de revision ATPL - "+c.mod,15,22);
  y=40;
  const need=n=>{if(y+n>282){doc.addPage();y=20}};
  const head=(t)=>{need(14);doc.setTextColor(29,78,216);doc.setFont("helvetica","bold").setFontSize(12);doc.text(t,15,y);y+=2;doc.setDrawColor(29,78,216);doc.line(15,y,195,y);y+=6;doc.setTextColor(30)};
  head("A retenir");
  doc.setFont("helvetica","normal").setFontSize(10.5);
  c.pts.forEach(p=>{const l=doc.splitTextToSize(clean(p),168);need(l.length*5.2+2);doc.text("-",17,y);doc.text(l,23,y);y+=l.length*5.2+2});
  y+=4;head("Formules cles");
  c.f.forEach(([n,f])=>{need(11);doc.setFillColor(234,240,255);doc.roundedRect(15,y-5,180,9,1.5,1.5,"F");doc.setFont("helvetica","bold").setFontSize(10);doc.setTextColor(29,78,216);doc.text(clean(n),18,y+1);doc.setFont("courier","bold").setTextColor(30);doc.text(clean(f),80,y+1);y+=12});
  if(c.ex){y+=2;head("Exemple");doc.setFont("helvetica","normal").setFontSize(10.5);doc.setTextColor(30);const l=doc.splitTextToSize(clean(c.ex),178);need(l.length*5.2+2);doc.text(l,15,y);y+=l.length*5.2+2}y+=2;head("Pieges d'examen");
  doc.setFont("helvetica","normal").setFontSize(10.5);doc.setTextColor(150,30,30);
  c.pieges.forEach(p=>{const l=doc.splitTextToSize(clean(p),168);need(l.length*5.2+2);doc.text("!",17,y);doc.text(l,23,y);y+=l.length*5.2+2});
}

    const s=document.createElement('script');s.id='atpl-jspdf-loader';s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.async=true;s.onload=()=>resolve(!!(window.jspdf&&window.jspdf.jsPDF));s.onerror=()=>resolve(false);document.head.appendChild(s);setTimeout(()=>resolve(!!(window.jspdf&&window.jspdf.jsPDF)),5000)
  })
}

}

const MET=[{"id":"050 01","t":"Atmosphère","syllabus":"050 01 00 00","cours":[["Composition et structure","L’atmosphère sèche est principalement azote et oxygène ; vapeur d’eau est très variable et essentielle à la météo. La troposphère contient l’essentiel de la météo et présente en moyenne une baisse de température avec altitude ; la tropopause sépare la troposphère de la stratosphère, où la tendance thermique change."],["ISA","L’Atmosphère Standard ICAO fournit un modèle de référence : 15 °C et 1013,25 hPa au niveau moyen de la mer, densité ≈ 1,225 kg/m³, gradient thermique standard −6,5 °C/km jusqu’à 11 km environ, puis température standard proche de −56,5 °C dans la basse stratosphère. Ce sont des références, pas une météo réelle."],["Pression et densité","La pression diminue avec altitude car la masse d’air au-dessus diminue. La densité dépend de pression et température : à pression égale, air chaud est moins dense ; à température égale, pression plus faible donne densité plus faible. L’humidité réduit légèrement la densité car H₂O est plus légère que N₂/O₂."],["Altimétrie météorologique","QNH fait indiquer altitude par rapport au MSL dans conditions standardisées de calage ; QFE fait indiquer environ zéro au datum de l’aérodrome ; 1013,25 hPa sert aux flight levels. Pression et température non standard créent différences entre altitude indiquée et vraie."],["Tropopause","Elle est généralement plus haute et plus froide aux tropiques, plus basse aux pôles. Les forts gradients de tropopause et contrastes thermiques sont associés aux jet streams. Elle agit comme limite relative de convection mais les Cb peuvent la pénétrer."],["ISA et gradient thermique","L’atmosphère standard sert de référence pour les performances et l’altimétrie. Le gradient thermique standard n’est qu’un modèle ; l’atmosphère réelle s’en écarte fréquemment. Comprendre ces écarts permet d’interpréter densité, altitude vraie et performances."]],"pts":["ISA MSL : 15 °C, 1013,25 hPa, ρ≈1,225 kg/m³.","Gradient ISA troposphère ≈ −6,5 °C/km ≈ −2 °C/1000 ft.","Air chaud et humide est moins dense à pression égale.","QNH, QFE et 1013,25 hPa répondent à des références verticales différentes.","Tropopause est plus haute aux tropiques.","ISA est une référence, pas une description permanente de l’atmosphère réelle."],"f":[["Équation des gaz","ρ = p / (R T)"]],"pieges":["ISA est un modèle, pas une prévision.","“From high to low, look out below” concerne pression et température avec nuances.","Humidité élevée ne rend pas l’air plus dense."],"ex":"À même pression, une masse d’air à 35 °C est moins dense qu’à 15 °C : décollage et montée se dégradent.","mod":"050 Meteorology","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 050","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"050 02","t":"Vent","syllabus":"050 02 00 00","cours":[["Gradient de pression","La force de gradient va des hautes vers basses pressions et augmente lorsque les isobares sont serrées. Sans rotation terrestre ni friction, l’air accélérerait vers la basse pression."],["Coriolis","Résulte du référentiel terrestre en rotation : déviation à droite dans l’hémisphère Nord, à gauche dans le Sud ; nulle à l’équateur, croissante avec latitude et vitesse. Elle agit sur le mouvement, pas sur l’air immobile."],["Vent géostrophique et gradient","Au-dessus de la couche de friction, équilibre pression–Coriolis donne vent géostrophique approximativement parallèle aux isobares droites. Autour de courbures, force centrifuge modifie l’équilibre : gradient wind diffère entre cyclones et anticyclones."],["Friction et vent de surface","Friction ralentit le vent, donc Coriolis diminue : le vent coupe les isobares vers les basses pressions. Au-dessus d’un sol rugueux, vitesse plus faible et angle de traversée plus grand que sur mer."],["Circulations locales","Sea breeze : jour, terre chauffe → basse pression relative → vent mer→terre ; land breeze inverse souvent la nuit. Vent de vallée/anha-batique monte les pentes chauffées ; katabatique descend l’air froid dense. Foehn résulte d’un écoulement franchissant relief avec assèchement/réchauffement sous le vent."],["Ondes et jets","Un flux stable traversant une montagne peut produire ondes stationnaires, lenticulaires, rotors et turbulence. Jet stream est un ruban de vent fort proche tropopause associé à fort gradient horizontal de température ; CAT est fréquente près de ses cisaillements."],["Coriolis, friction et jet-stream","Le vent résulte de l’équilibre entre gradient de pression, force de Coriolis et friction. En altitude, les jet streams traduisent de forts gradients horizontaux de température et jouent un rôle majeur en performance et turbulence. Il faut distinguer vent de surface, vent géostrophique et effets locaux."]],"pts":["Coriolis : droite HN, gauche HS.","Surface wind traverse les isobares vers basse pression à cause friction.","Isobares serrées → gradient de pression et vent généralement plus forts.","Jet streams suivent forts contrastes thermiques près tropopause.","Ondes sous le vent nécessitent stabilité et vent traversant relief.","La friction influence surtout le vent près du sol ; en altitude, la structure change."],"f":[],"pieges":["Coriolis ne “crée” pas le vent initial.","Vent géostrophique n’est pas valable près du sol.","Sea breeze dépend contraste thermique et peut être modifiée par vent synoptique."],"ex":"Un vent géostrophique de 60 kt peut devenir 35–45 kt près du sol et couper les isobares vers la dépression.","mod":"050 Meteorology","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 050","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"050 03","t":"Thermodynamique et stabilité","syllabus":"050 03 00 00","cours":[["Humidité","Vapour pressure décrit part de pression due à vapeur d’eau. Relative humidity compare vapeur réelle à saturation à même température ; point de rosée est température à laquelle l’air devient saturé par refroidissement à pression approximativement constante."],["Adiabatique sèche","Une parcelle non saturée montant se détend et refroidit sans échange de chaleur externe, environ 3 °C/1000 ft (9,8 °C/km). En descente elle se comprime et se réchauffe au même taux approximatif."],["Adiabatique saturée","Après saturation, condensation libère chaleur latente : refroidissement est plus lent et variable, typiquement autour de 1,5 °C/1000 ft mais dépend température/pression. Une valeur fixe est seulement approximation pédagogique."],["Stabilité","Comparer environmental lapse rate aux adiabatiques. Si une parcelle déplacée devient plus chaude/légère que environnement, elle continue à monter → instabilité. Inversion est très stable et peut piéger brume/polluants. Conditional instability dépend saturation."],["Convection","Instabilité + humidité + mécanisme de soulèvement favorisent cumulus/Cb. Stabilité favorise nuages stratiformes et turbulence plus faible, mais peut aussi favoriser brouillard/stratus et faible visibilité."],["Niveau de condensation","Une estimation de base de cumulus utilise spread T−Td ; environ 400 ft par °C dans une approximation souvent employée. Ce n’est pas une loi universelle et ne remplace pas les observations/sondages."],["Inversions et mécanismes de soulèvement","Une inversion stabilise l’atmosphère et freine les mouvements verticaux. Le soulèvement peut être convectif, frontal, orographique ou dynamique. Identifier le mécanisme aide à prévoir nuages, turbulence et précipitations."]],"pts":["Dry adiabatic ≈ 3 °C/1000 ft.","Saturated adiabatic est plus faible et variable.","Point de rosée = saturation par refroidissement.","Inversion = très stable.","Instabilité favorise convection et turbulence.","Le type de soulèvement conditionne souvent le type de nuages et de temps observé."],"f":[["Base cumulus approximative","≈ 400 × (T − Td) ft AGL"]],"pieges":["Humidité relative augmente si température baisse à vapeur constante.","L’adiabatique saturée n’est pas exactement 1,5 °C/1000 ft partout."],"ex":"T=18 °C, Td=13 °C : spread 5 °C → base convective approximative 2 000 ft AGL.","mod":"050 Meteorology","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 050","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"050 04","t":"Nuages et brouillard","syllabus":"050 04 00 00","cours":[["Classification nuages","Haut : Ci/Cs/Cc ; moyen : Ac/As ; bas : St/Sc ; Ns apporte précipitation continue ; Cu/Cb ont développement vertical. Altitudes exactes des étages varient avec latitude. La forme révèle stabilité et mouvement vertical."],["Formation","Air atteint saturation par refroidissement, mélange ou ajout vapeur. Soulèvement orographique, frontal, convectif ou convergence refroidit adiabatiquement. Noyaux de condensation facilitent formation de gouttelettes."],["Brouillard rayonnement","Sol se refroidit par rayonnement nocturne sous ciel dégagé et vent faible ; air près du sol atteint Td. Léger brassage peut épaissir le brouillard, mais vent fort mélange avec air plus sec et peut l’empêcher. Dissipation souvent après chauffage solaire ou augmentation vent."],["Brouillard advection","Air humide passe sur surface froide ; peut se former avec vent plus fort que brouillard de rayonnement et persister jour/nuit tant que l’advection continue. Fréquent côtes et mers froides."],["Autres brouillards","Upslope : air humide forcé à monter le relief ; steam fog : air froid au-dessus d’eau plus chaude enrichit les basses couches en vapeur ; frontal/precipitation fog : évaporation de pluie dans air froid humide."],["Opérations","Plafond/ceiling dépend de la couche BKN/OVC la plus basse selon reporting, pas de FEW/SCT. Brouillard réduit visibilité et peut entraîner LVP ; nuages bas affectent minima approche et alternates."],["Types de brouillard","Radiation fog, advection fog, upslope fog, steam fog et frontal fog n’ont ni les mêmes causes ni les mêmes signatures opérationnelles. Pour le pilote, l’essentiel est de relier refroidissement, humidité, vent et relief à la formation ou dissipation du phénomène."]],"pts":["Brouillard = visibilité < 1 000 m par convention météo aéronautique.","Radiation fog : ciel clair, vent faible, refroidissement nocturne.","Advection fog : air humide sur surface froide, peut persister.","BKN/OVC déterminent ceiling, pas FEW/SCT.","Tous les brouillards ne se forment pas par le même mécanisme."],"f":[],"pieges":["Ne pas dire que tout vent détruit le brouillard de rayonnement : un léger vent peut le favoriser.","Ns est souvent associé à précipitation continue."],"ex":"Un METAR BKN004 indique plafond 400 ft AGL environ, même si une couche SCT002 existe en dessous.","mod":"050 Meteorology","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 050","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"050 05","t":"Précipitations et givrage météo","syllabus":"050 05 00 00","cours":[["Croissance des gouttes","Dans nuages chauds, collision-coalescence fait croître grosses gouttes en collectant petites. Dans nuages mixtes/froids, Bergeron-Findeisen exploite pression de vapeur saturante plus faible sur glace que sur eau, favorisant croissance cristaux."],["Types","Drizzle = petites gouttes ; rain plus grosses ; snow cristaux/agrégats ; hail croissance convective dans Cb ; ice pellets peuvent résulter d’une refonte puis regel ; freezing rain reste liquide surfondue jusqu’au contact."],["Freezing precipitation","Pluie verglaçante implique couche chaude au-dessus puis mince couche froide près surface : gouttes restent surfondues et gèlent au contact. Elle produit accrétion rapide et peut dépasser protections certifiées ; évitement est prioritaire."],["Givrage en nuage","Supercooled liquid water est nécessaire au givrage structural significatif. Rime : petites gouttes, congélation rapide, rugueux/opaque ; clear/glaze : grosses gouttes, écoulement avant gel, dense/lisse ; mixed combine. Intensité dépend LWC, taille gouttes, température et exposition."],["Effets","Glace réduit CLmax, augmente drag/weight, peut avancer stall et dégrader capteurs/moteurs/hélices. Même faible rugosité sur bord d’attaque peut avoir effet disproportionné."],["Types de givrage","Le givre blanc, le verglas (clear ice) et le mixed ice ne se forment pas dans les mêmes conditions. Les gouttelettes surfondue, la taille des gouttes et la température de la surface déterminent l’accumulation. Le givrage n’est pas seulement une question de masse : il détériore aussi aérodynamique, capteurs et propulsion."]],"pts":["Collision-coalescence domine nuages chauds ; Bergeron nuages froids/mixes.","Freezing rain = risque sévère de givrage.","Rime et clear ice se distinguent surtout par taille gouttes/taux de gel.","Glace diminue CLmax et augmente traînée.","Le clear ice est souvent plus dense et plus difficile à éliminer que le rime ice."],"f":[],"pieges":["Température sous 0 °C ne suffit pas : il faut eau liquide surfondue pour givrage structural classique.","Hail peut être rencontré hors du cœur visible du Cb."],"ex":"Une aile avec CLmax réduit de 30 % voit Vs augmenter par facteur √(1/0,70) ≈ 1,195, soit près de 20 %.","mod":"050 Meteorology","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 050","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"050 06","t":"Masses d’air et fronts","syllabus":"050 06 00 00","cours":[["Masses d’air","Une masse d’air acquiert température/humidité d’une région source. Maritime = plus humide, continental = plus sec ; tropical/polaire/arctique décrivent origine thermique. En se déplaçant sur surface chaude, air froid se déstabilise ; sur surface froide, air chaud se stabilise."],["Front chaud","Air chaud glisse sur air froid avec pente faible : séquence possible Ci→Cs→As→Ns, baisse pression avant passage, précipitation étendue et visibilité réduite. Après passage, température/point de rosée augmentent souvent."],["Front froid","Air froid pousse sous air chaud avec pente plus forte : Cu/Cb, averses, grains, turbulence et changement rapide du vent/température. Après passage, pression remonte typiquement et air devient plus froid/sec."],["Occlusion","Front froid rattrape front chaud et soulève secteur chaud. Cold/warm occlusion dépend température relative des masses froides ; le temps combine caractéristiques frontales et peut être complexe autour du low."],["Stationnaire et polar front","Front stationnaire se déplace peu et peut maintenir nuages/précipitations. Polar front sépare masses polaires et subtropicales et est associé aux dépressions extratropicales/jet."],["Cyclogenèse","Onde sur front polaire peut se creuser, former warm/cold fronts, mature puis s’occlure. La séquence n’est pas identique à chaque système mais fournit un modèle utile pour prévoir évolution."],["Occlusions et évolution frontale","L’occlusion apparaît lorsqu’un front froid rattrape un front chaud. Il faut comprendre la structure verticale et la répartition des nuages/ précipitations selon le type d’occlusion. Les cartes synoptiques restent des résumés qu’il faut relier à la physique des masses d’air."]],"pts":["Front chaud : pente faible, nuages stratiformes étagés.","Front froid : pente plus raide, convection/averses plus probables.","Occlusion = front froid rattrape front chaud.","Air froid sur sol chaud devient plus instable.","Une occlusion combine des caractéristiques des fronts chaud et froid, sans leur être identique."],"f":[],"pieges":["Le vent ne “tourne à droite” de la même façon partout du globe : contexte hémisphère et trajectoire comptent.","Une occlusion n’implique pas automatiquement fin immédiate du mauvais temps."],"ex":"Avant un front chaud, une baisse de pression + Cs/As croissants + pluie continue sont cohérents avec l’approche du système.","mod":"050 Meteorology","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 050","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"050 07","t":"Systèmes de pression","syllabus":"050 07 00 00","cours":[["Dépressions","Dans HN, circulation cyclonique antihoraire ; en HS horaire. Convergence basse couche favorise ascendance, nuages et précipitations. Les fronts sont souvent associés aux lows extratropicaux."],["Anticyclones","Circulation inverse avec subsidence moyenne : ciel souvent plus stable/clair en altitude mais inversion peut piéger stratus, brouillard et pollution en basses couches. “High = beau temps” n’est donc pas absolu."],["Troughs et ridges","Trough est extension de basse pression/cyclonicité, souvent ascendance et averses ; ridge est extension anticyclonique, souvent subsidence/stabilisation. Les cartes surface/altitude montrent structure tridimensionnelle."],["Mouvement","Les systèmes sont pilotés par dynamique en altitude, advection et développement barocline. Une baisse rapide de pression peut signaler cyclogenèse, mais la tendance doit être interprétée avec position du système."],["Buys-Ballot","Dans HN, dos au vent de surface, basse pression se trouve approximativement à gauche et un peu en avant ; relation inverse HS. C’est qualitatif car friction/courbure modifient."],["Thalwegs, dorsales et circulation synoptique","Au-delà des centres d’action, les thalwegs et dorsales structurent le temps sensible. Ils modifient vent, instabilité et probabilité de convection. Une carte isobarique doit être lue comme une dynamique, pas comme une simple image statique."]],"pts":["Dépression HN : circulation antihoraire et convergence près surface.","Anticyclone peut produire brouillard/stratus sous inversion.","Trough favorise ascendance ; ridge subsidence.","Tendance pression aide à situer évolution synoptique.","Un thalweg favorise souvent ascendance et temps plus perturbé qu’une dorsale."],"f":[],"pieges":["Anticyclone n’est pas toujours CAVOK.","Surface wind et gradient wind ne sont pas identiques."],"ex":"En hiver sous anticyclone continental, inversion basse peut maintenir brouillard plusieurs jours malgré forte pression.","mod":"050 Meteorology","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 050","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"050 08","t":"Climatologie et phénomènes régionaux","syllabus":"050 08 00 00","cours":[["Circulation générale","Excès énergétique tropical et déficit polaire entraînent cellules Hadley/Ferrel/Polar et ceintures de vent. ITCZ concentre convergence et convection ; subtropical highs sont associés subsidence ; westerlies dominent moyennes latitudes."],["Moussons","Renversement saisonnier lié contraste thermique continent/océan et déplacement ITCZ. Mousson humide apporte flux maritime/convection ; saison sèche correspond circulation inversée. Relief module fortement les pluies."],["Cyclones tropicaux","Nécessitent mer chaude, humidité, faible cisaillement vertical et suffisamment de Coriolis, donc rarement près équateur. Œil est relativement calme, eyewall contient vents/pluies les plus intenses ; storm surge et convection s’étendent loin."],["Vents locaux","Mistral, bora, föhn, sirocco, harmattan etc. résultent topographie et systèmes synoptiques régionaux. Pour ATPL, comprendre mécanisme et effets (turbulence, visibilité, température), plutôt que mémoriser seulement le nom."],["Saisons et routes","Jet streams, tropopause, ITCZ et fronts migrent avec saison, modifiant temps de vol, turbulence et météo des routes. Climatologie guide la planification mais ne remplace pas prévision du jour."],["Brises, ondes orographiques et phénomènes régionaux","La climatologie utile au pilote inclut moussons, ITCZ, alizés, brises de mer/terre et ondes orographiques. Ces phénomènes influencent vent, nuages, turbulence et sécurité des approches. Le relief peut créer rotor, lenticulaires et fortes descentes sous le vent."]],"pts":["ITCZ = convergence convective proche tropiques.","Tropical cyclone nécessite faible shear et mer chaude, loin de l’équateur.","Mousson = renversement saisonnier large échelle.","Climatologie donne probabilité, pas météo instantanée.","Sous le vent d’un relief, la turbulence et les descendances peuvent être sévères même par ciel apparemment calme."],"f":[],"pieges":["Un cyclone tropical ne se forme généralement pas exactement à l’équateur faute de Coriolis.","Œil calme ne signifie pas système faible."],"ex":"Une route transatlantique en hiver rencontre souvent jets plus forts et plus méridionaux qu’en été : temps/fuel et CAT peuvent changer.","mod":"050 Meteorology","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 050","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"050 09","t":"Dangers météorologiques","syllabus":"050 09 00 00","cours":[["Thunderstorms","Cycle cumulus→mature→dissipating. Mature contient up/downdrafts, grêle, foudre, turbulence sévère, icing et fortes précipitations. Radar aide à éviter réflectivité forte mais atténuation peut masquer cellule derrière une cellule intense."],["Turbulence","Mechanical près relief/sol ; convective dans thermiques/Cb ; CAT dans fort cisaillement près jets/tropopause ; mountain wave/rotor sous le vent. Intensité opérationnelle dépend effet sur avion/occupants, pas uniquement vitesse verticale mesurée."],["Windshear et microburst","Windshear = changement de vent sur courte distance. Microburst : downdraft intense s’étalant au sol, provoque succession headwind↑ puis downdraft puis tailwind — forte perte d’énergie en approche/décollage. Évitement est meilleur que traversée."],["Givrage","Voir 050 05 : SLD/freezing rain, cloud liquid water et températures subzero sont clés. Engine icing et probe icing peuvent précéder forte accrétion aile."],["Mountain wave","Air stable + vent fort perpendiculaire relief : onde peut s’étendre très haut, avec lenticulaires et turbulence sévère rotor. Zones de descente peuvent dépasser capacité montée avion."],["Cendres volcaniques / sable","Ash est abrasif, peut fondre dans turbine et perturber sondes/visibilité ; radar météo détecte mal la cendre. Dust/sand réduisent visibilité et érodent moteurs. Évitement suit informations VAAC/SIGMET et procédures."],["CAT, microbursts et cendres volcaniques","La clear air turbulence est liée notamment aux cisaillements forts sans forcément laisser d’indice nuageux. Les microbursts combinent fort gradient vertical et changement rapide de vent, particulièrement dangereux en approche et au décollage. Les cendres volcaniques menacent moteurs, pare-brise et systèmes de bord ; elles doivent être évitées strictement."]],"pts":["Cb = turbulence, foudre, grêle, icing, windshear/microburst.","Microburst peut transformer headwind en tailwind très rapidement.","CAT est souvent invisible et liée cisaillement.","Weather radar ne garantit pas détection de cendres volcaniques.","Mountain wave peut exister avec ciel visuellement clair.","L’absence de pluie n’exclut pas un danger majeur : CAT et cendres volcaniques en sont des exemples."],"f":[],"pieges":["Ne jamais utiliser radar pour “trouver un passage” dans un écho rouge intense.","Atténuation radar peut créer une zone sombre trompeuse derrière forte pluie."],"ex":"En finale, +20 kt headwind qui devient −20 kt tailwind représente une perte de 40 kt de composante relative si la vitesse avion ne s’adapte pas instantanément.","mod":"050 Meteorology","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 050","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"050 10","t":"Information météorologique aéronautique","syllabus":"050 10 00 00","cours":[["METAR/SPECI","METAR = observation régulière ; SPECI = spéciale. Décoder vent, visibilité, RVR, phénomènes, nuages, température/point de rosée, QNH et tendances. Les unités et conventions dépendent du code OACI publié."],["TAF","Prévision aérodrome sur période. BECMG décrit changement durable graduel ; TEMPO fluctuations temporaires ; PROB30/40 probabilité ; FM introduit changement à heure définie selon format. La validité et amendements doivent être vérifiés."],["SIGMET/AIRMET","SIGMET avertit phénomènes en route significatifs tels que TS sévères, turbulence sévère, icing sévère, cendres volcaniques ou cyclone tropical selon région. AIRMET couvre certains phénomènes à niveaux inférieurs dans régions où service existe."],["Cartes","Significant weather charts montrent fronts, CB, turbulence, icing, jets/tropopause et autres dangers ; wind/temperature charts donnent vents/temp à niveaux. Il faut interpoler espace/temps avec prudence."],["Briefing et observations en vol","Pilot reports/AIREP complètent observations notamment turbulence/icing. Un briefing combine observation + forecast + warnings ; aucun produit isolé ne donne toute la situation."],["Radar/satellite","Radar sol montre hydrométéores, pas directement turbulence ; satellite IR estime températures sommets nuages, visible montre albédo de jour. Images nécessitent heure et animation pour comprendre évolution."],["METAR, TAF, SIGMET et cartes","Le pilote doit croiser observations, prévisions, SIGMET, cartes significatives et parfois images radar/satellite. Chaque produit a son horizon temporel, son niveau de détail et ses limites. Lire un METAR ne dispense pas de comprendre la situation générale."]],"pts":["METAR = observation ; TAF = prévision.","BECMG = transition vers nouvel état ; TEMPO = fluctuations temporaires.","SIGMET = phénomènes significatifs en route.","Radar mesure réflectivité hydrométéores, pas turbulence directement.","Toujours vérifier validité/heure du produit.","Observation ponctuelle et prévision n’ont pas le même statut ; il faut les combiner intelligemment."],"f":[],"pieges":["CAVOK a des critères précis, pas seulement “beau temps”.","Une absence d’écho radar n’exclut pas CAT.","TAF ne décrit pas nécessairement chaque fluctuation minute par minute."],"ex":"Un TAF TEMPO TSRA signifie fluctuations temporaires orageuses pendant fenêtre donnée ; ce n’est pas équivalent à condition dominante permanente.","mod":"050 Meteorology","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 050","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true}];
MET.forEach(c=>c.mod="050 Meteorology");
const MB=[{"id":"031 01","t":"Principes de masse et centrage","syllabus":"031 01 00 00","cours":[["Pourquoi le centrage compte","La masse détermine les performances et charges structurales ; la position du centre de gravité (CG) détermine équilibre, stabilité, efforts de commande et parfois performances. Un avion peut être sous sa masse maximale mais hors enveloppe de centrage : il reste alors non conforme."],["Masses de référence","Les termes basic empty mass, dry operating mass, zero fuel mass, take-off mass et landing mass dépendent du contexte et des données avion. La logique est toujours de partir d’une masse connue et d’ajouter ou retrancher payload, fuel et consommations selon le moment du vol."],["CG avant / arrière","CG avant augmente généralement la stabilité longitudinale et l’effort de profondeur, peut augmenter la vitesse de décrochage pratique et la distance de décollage/atterrissage. CG arrière réduit la stabilité et peut rendre récupération de décrochage plus difficile ; il diminue souvent la force de queue nécessaire et donc la traînée de trim."],["Limites structurelles","MTOM, MLM, MZFM et charges de compartiment protègent structure et performance. MZFM limite surtout le moment fléchissant à l’emplanture lorsque le carburant d’aile ne contribue pas à soulager la flexion. Les limites locales de plancher sont aussi essentielles."],["Méthode ATPL","Toujours : identifier datum → relever masse et bras/station → calculer moments → sommer masses et moments → calculer CG → convertir éventuellement en %MAC → comparer masse et CG à l’enveloppe."],["%MAC, index et références","Le centre de gravité peut être exprimé en distance depuis le datum ou en pourcentage de la corde aérodynamique moyenne (%MAC). Certains constructeurs utilisent aussi des unités d’index pour simplifier les chargements. Il faut savoir passer d’une représentation à l’autre selon la documentation fournie."]],"pts":["Être sous MTOM ne garantit pas un centrage valide.","CG avant : plus stable mais plus d’effort de profondeur ; CG arrière : moins stable.","MZFM protège notamment la structure aile/fuselage.","Méthode : masse + bras → moment → CG → enveloppe.","CG en %MAC et CG en distance sont deux façons d’exprimer la même position."],"f":[],"pieges":["Ne pas confondre masse maximale et masse réelle.","Une masse locale peut être dépassée même si masse totale est correcte."],"ex":"Une charge déplacée de l’avant vers l’arrière déplace le CG dans le même sens ; l’effet dépend de sa masse et de la distance déplacée.","mod":"031 Mass & Balance","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 031","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — masse et chargement","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"031 02","t":"Chargement et masses opérationnelles","syllabus":"031 02 00 00","cours":[["Chaîne de chargement","Le load sheet construit progressivement la masse : masse opérationnelle de base + trafic load → zero fuel mass ; + take-off fuel → ramp/take-off mass selon taxi fuel ; après trip fuel on obtient landing mass. Les définitions exactes du document utilisé priment."],["Passagers et bagages","Des masses réelles ou standard approuvées sont utilisées selon réglementation/opérateur. Une erreur de nombre, de catégorie ou de répartition peut affecter masse et CG. Les bagages en soute doivent être placés dans les compartiments prévus et sécurisés."],["Carburant","Le carburant influence masse et souvent CG. Sa consommation peut déplacer le CG si les réservoirs sont situés avant ou arrière du CG initial ; sur certains avions, transfert carburant est utilisé volontairement pour optimiser centrage."],["Taxi, décollage et atterrissage","Ramp mass précède consommation taxi ; take-off mass est masse au début du décollage ; landing mass = take-off mass − trip fuel consommé jusqu’à l’atterrissage, ajustée des transferts/consommations éventuels."],["Dernière minute","Last minute changes sont acceptables seulement dans limites/procédures : une modification de passagers, bagages ou fuel peut exiger recalcul. Le commandant doit disposer d’un état de chargement conforme avant départ."],["Masses limitatives","Les notions de DOW, ZFM, TOM, LM et masse sans carburant n’ont pas la même signification. Une limitation structurale peut être atteinte avant la masse maximale au décollage si la répartition de charge ou le chargement cabine/fret est défavorable."]],"pts":["ZFM = masse avant ajout du carburant utilisable pour le vol selon définition opérationnelle.","TOM = masse au décollage après taxi fuel.","LM = TOM − carburant consommé en route (modèle simple).","Répartition est aussi importante que masse totale.","Une masse maximale autorisée dépend du type de masse considéré : ZFM, TOM, LM, etc."],"f":[["Moment","M = m × bras"]],"pieges":["Ne pas oublier taxi fuel lorsqu’on passe ramp mass → TOM.","Un changement faible en masse peut avoir gros effet CG s’il est très loin du datum."],"ex":"Un passager de 90 kg déplacé de 2 m vers l’arrière ajoute 180 kg·m au moment total sans changer la masse totale.","mod":"031 Mass & Balance","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 031","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — masse et chargement","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"031 03","t":"Calcul du centre de gravité","syllabus":"031 03 00 00","cours":[["Datum et bras","Le datum est une référence arbitraire fixée par constructeur. Le bras est distance signée entre datum et point d’application de la masse. Un moment est masse × bras ; le signe dépend de convention."],["Somme des moments","CG = somme des moments / masse totale. Le résultat est exprimé dans la même unité de longueur que les bras. Les moments peuvent être divisés par un index constant pour rendre les tableaux plus maniables ; il faut alors appliquer correctement l’échelle."],["Déplacement de charge","Déplacer une masse sans changer masse totale modifie le moment de m×distance déplacée. Le déplacement du CG vaut approximativement ΔCG = m×d / masse totale. Cette relation est très utile aux questions de repositionnement."],["Ajout / retrait","Ajouter une masse déplace le CG vers cette masse ; retirer une masse déplace le CG à l’opposé du point retiré. Le calcul exact passe par nouveaux moments et nouvelle masse totale."],["%MAC","Pour aile à corde aérodynamique moyenne : %MAC = (CG − LEMAC)/MAC ×100. Un CG à 25 % MAC se trouve à un quart de MAC derrière le bord d’attaque de la MAC."],["Effets du centrage sur le vol","Un CG avant augmente la stabilité mais peut dégrader les performances et imposer plus d’effort de compensation. Un CG arrière diminue la stabilité et peut réduire la marge de contrôle en tangage. Le centrage n’est donc pas un simple exercice administratif."]],"pts":["CG = ΣM/Σm.","Déplacement charge : ΔCG = m×d / masse totale (si masse totale inchangée).","%MAC utilise LEMAC et longueur MAC.","Ajouter une masse attire le CG vers son bras.","Le CG influence stabilité, performance et autorité de commande."],"f":[["Centre de gravité","CG = Σ(m×bras) / Σm"],["Déplacement de CG","ΔCG = m×d / M"],["Pourcentage MAC","%MAC = 100 × (CG − LEMAC) / MAC"]],"pieges":["Ne pas mélanger pouces, mètres, kg·m et kg·in.","Le datum n’est pas nécessairement au nez.","Une valeur de bras négative peut être parfaitement correcte selon datum."],"ex":"600 kg à 2,1 m et 400 kg à 3,5 m donnent CG = (600×2,1+400×3,5)/1000 = 2,66 m.","mod":"031 Mass & Balance","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 031","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — masse et chargement","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"031 04","t":"Données masse et centrage avion","syllabus":"031 04 00 00","cours":[["Enveloppe","L’enveloppe relie masse et position CG. Les limites avant/arrière peuvent changer avec masse car contraintes de stabilité, contrôle et structure ne sont pas constantes. Un point doit être à la fois à l’intérieur horizontalement et verticalement."],["Index","Les load sheets utilisent parfois index de moment. Chaque station ou compartiment possède un index par masse ; l’addition graphique/table remplace le calcul brut. Il faut respecter origine et facteur d’échelle."],["Réservoirs","Chaque réservoir a une station effective variable selon géométrie et quantité. Les tableaux constructeur donnent moment/index carburant ; utiliser une densité ou un bras constant inventé peut être faux."],["Configuration cabine/fret","Sièges, galleys, ULDs et compartiments ont des stations et limites. Les limites de plancher s’expriment en masse par surface ou charge linéaire selon zone. Une concentration de fret peut dépasser structure locale."],["Effets en vol","Consommation, largage ou transfert changent masse et parfois CG. Une enveloppe de vol peut différer de celle au décollage/atterrissage ; il faut vérifier les points critiques du profil."],["Lecture d’enveloppe","L’enveloppe masse-centrage doit être lue avec attention : limites avant, arrière, de masse et parfois de phase de vol. Être “dans l’enveloppe” au parking ne garantit pas automatiquement d’y rester après consommation carburant ou transfert de masse."]],"pts":["L’enveloppe combine limite de masse et limite de CG.","Moments carburant doivent suivre données constructeur.","Index est une forme mise à l’échelle du moment.","Limites de compartiment/plancher s’ajoutent aux limites globales.","Toujours vérifier la trajectoire du CG pendant le vol, pas seulement à l’instant du départ."],"f":[],"pieges":["Ne pas interpoler hors domaine d’un tableau.","Une ligne de limite oblique exige comparaison masse-CG simultanée."],"ex":"Un avion peut être dans l’enveloppe au décollage mais sortir d’une limite après consommation d’un réservoir arrière : vérifier évolution du CG.","mod":"031 Mass & Balance","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 031","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — masse et chargement","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"031 05","t":"Détermination du CG et pesée","syllabus":"031 05 00 00","cours":[["Pesée","L’avion est nivelé selon datum constructeur, placé sur balances aux points d’appui, puis les réactions sont corrigées des tare/équipements temporaires. La somme des réactions donne masse mesurée."],["Calcul par réactions","La position CG se déduit de l’équilibre des moments autour d’un point de référence. Sur train tricycle, réactions train principal et avant ainsi que distances géométriques permettent de calculer le bras du CG."],["Basic empty mass","Après pesée, on corrige fluides, équipements et configuration pour établir la masse à vide définie dans le système documentaire. Toute modification permanente doit être incorporée aux données masse et centrage."],["Erreurs","Sol non horizontal, avion mal nivelé, vent, balances non calibrées, fluides non conformes ou tare oubliée créent une erreur de CG. Le calcul mathématique peut être exact mais basé sur données fausses."],["Interpolation graphique","Graphes et tables de chargement sont des représentations de la même physique des moments. L’ATPL exige de lire échelles, interpoler prudemment et contrôler ordre de grandeur."],["Pesée et corrections","Une pesée demande une configuration standardisée : fluides, équipement, frein de parc, nivellement et lecture des balances. Les corrections de tare, d’huile, de carburant non utilisable ou d’équipement modifié peuvent être nécessaires pour obtenir une masse de référence exploitable."]],"pts":["Pesée = somme des réactions puis équilibre des moments.","Tare doit être retranchée/corrigée.","Configuration de pesée doit être connue.","Modification permanente impose mise à jour des données.","La qualité d’une pesée dépend autant de la procédure que de la balance."],"f":[],"pieges":["Ne pas confondre réaction au train et masse placée à cette station.","Toujours vérifier que l’avion est dans la condition de nivellement prévue."],"ex":"Deux trains principaux supportent 8 000 kg et le train avant 2 000 kg : masse mesurée = 10 000 kg, puis le CG se calcule avec les bras de réaction.","mod":"031 Mass & Balance","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 031","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — masse et chargement","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"031 06","t":"Fret, arrimage et ballast","syllabus":"031 06 00 00","cours":[["Charges locales","Un compartiment a une limite de masse et parfois de charge surfacique. Une palette lourde sur petite surface peut dépasser le plancher même si la masse compartiment reste sous limite. Les spreaders répartissent les charges."],["Arrimage","En accélération, turbulence ou freinage, le fret développe forces proportionnelles à masse et accélération. Les filets, sangles, locks et ULDs doivent résister aux facteurs de charge prescrits. Un déplacement de fret modifie brutalement le CG."],["Marchandises et compatibilité","Certaines marchandises dangereuses exigent emballage, séparation ou interdiction selon réglementation ; le module 070 traite le cadre opérationnel. En masse/centrage, l’enjeu est surtout position, masse, volume et sécurisation."],["Ballast","Ballast fixe corrige durablement une configuration ; ballast amovible est chargé pour atteindre masse/CG requis et doit être correctement enregistré/arrimé. Ajouter du ballast augmente toujours la masse et peut réduire performance."],["ULD et soutes","ULD doit être compatible avec position et locks. Une mauvaise position peut violer CG ou limitation de contour/plancher. Le load instruction/report relie plan de chargement à exécution réelle."],["Documents de chargement et retenue","L’arrimage ne consiste pas seulement à “faire rentrer” le chargement. Il faut tenir compte de la résistance des planchers, des points d’ancrage, des filets, des straps et des accélérations attendues. Le loadsheet doit refléter une situation réelle et contrôlée."]],"pts":["Charge surfacique peut limiter avant la masse totale compartiment.","Fret non arrimé peut déplacer le CG.","Ballast corrige CG mais pénalise masse/performance.","ULD doit être verrouillé à la position prévue.","Un chargement mal arrimé peut déplacer le CG en vol et devenir critique."],"f":[["Force inertielle","F = m × a"]],"pieges":["Ne pas considérer un ballast comme “gratuit” : il réduit payload/performance.","Un compartiment conforme en masse peut être non conforme en charge au sol."],"ex":"Une caisse de 600 kg sur 1,0 m² crée 600 kg/m² ; sur 0,5 m², 1 200 kg/m² : la limite plancher peut devenir déterminante.","mod":"031 Mass & Balance","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 031","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — masse et chargement","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true}];
