r → retour d’information. Une redondance n’est utile que si les chaînes sont suffisamment indépendantes ; une même fuite, un même bus ou un même calculateur peut sinon neutraliser plusieurs voies à la fois."],["Corrosion, fatigue et inspections","La corrosion réduit les marges structurales et peut accélérer la fatigue. Les programmes d’entretien s’appuient sur des inspections visuelles, détaillées et parfois non destructives pour détecter fissures, délaminages, pertes d’épaisseur ou criques autour des zones fortement sollicitées."]],"pts":["Safe-life, fail-safe et damage-tolerant répondent à trois philosophies différentes.","Fatigue = phénomène cyclique ; résistance statique élevée ne signifie pas absence de fatigue.","Traction, compression, cisaillement, flexion et torsion sont les sollicitations de base.","La corrosion réduit la résistance et peut accélérer la fatigue.","Hard-time, on-condition et condition monitoring ne sont pas synonymes.","Safe-life, fail-safe et damage tolerance ne désignent pas la même philosophie de sécurité structurale."],"f":[["Contrainte normale","σ = F / S"],["Déformation","ε = ΔL / L"]],"pieges":["Ne pas confondre charge, contrainte et déformation.","Fail-safe ne signifie pas qu’aucune rupture n’est possible.","Une inspection est efficace seulement si le défaut reste détectable avant taille critique."],"ex":"Après un nombre élevé de cycles de pressurisation, une fissure peut se développer autour d’une ouverture. Le raisonnement attendu est : cycles → fatigue → inspection/détection → maintien de navigabilité.","mod":"021 Airframes & Systems","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 021","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — référence technique","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental-protection"}],"v5":true},{"id":"021 02","t":"Cellule et structures","syllabus":"021 02 00 00","cours":[["Matériaux aéronautiques","Les alliages d’aluminium offrent une bonne masse spécifique et une fabrication simple ; les aciers sont utilisés lorsque résistance et température dominent ; le titane combine résistance, tenue thermique et corrosion au prix d’un coût élevé. Les composites associent fibres et matrice : ils offrent une excellente résistance spécifique mais leurs dommages internes peuvent être moins visibles."],["Assemblages","Rivets, boulons, vis, collage et soudage transmettent les efforts entre pièces. Un assemblage doit supporter les charges prévues sans introduire de concentration de contraintes excessive. Les fixations critiques sont inspectées pour jeu, fissures, corrosion et délaminage autour des inserts dans les composites."],["Fuselage semi-monocoque","Le revêtement travaille avec cadres, couples, lisses et longerons. Les cadres maintiennent la forme et redistribuent les charges ; les lisses reprennent une partie des efforts longitudinaux ; le revêtement porte une part importante du cisaillement. Une structure pressurisée subit en plus des cycles de pression différentielle."],["Aile et empennages","Les longerons reprennent principalement la flexion, les nervures donnent le profil et transmettent les charges locales, le revêtement participe à la torsion et au cisaillement. L’aile transmet portance et efforts moteurs/atterrisseurs au fuselage. Les empennages produisent les moments nécessaires à la stabilité et au contrôle."],["Portes, fenêtres et zones pressurisées","Une ouverture interrompt les chemins de charge : elle est renforcée par des cadres et des éléments périphériques. Les portes pressurisées utilisent des dispositifs empêchant normalement l’ouverture sous pression différentielle. Une perte d’intégrité structurelle dans la coque pressurisée peut conduire à une décompression rapide."]],"pts":["Une structure semi-monocoque partage les efforts entre peau et éléments internes.","Longerons : flexion principale ; nervures : forme et transfert local ; peau : cisaillement/torsion.","Les composites peuvent être endommagés sans forte déformation visible.","Les ouvertures pressurisées exigent des renforts et des verrouillages fiables."],"f":[],"pieges":["Ne pas attribuer tout l’effort à la peau ou tout l’effort aux longerons.","Un composite n’est pas “sans corrosion” au sens large : interfaces et pièces métalliques restent sensibles."],"ex":"Une inspection visuelle après impact léger sur un panneau composite peut être insuffisante : le dommage interne doit être évalué selon les procédures de maintenance.","mod":"021 Airframes & Systems","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 021","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — référence technique","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental-protection"}],"v5":true},{"id":"021 03","t":"Hydraulique","syllabus":"021 03 00 00","cours":[["Principe physique","Un liquide presque incompressible transmet la pression dans tout le circuit. La pression n’est pas une force : l’actionneur transforme pression et surface de piston en force. Le débit détermine principalement la vitesse de déplacement de l’actionneur ; la pression dépend de la charge rencontrée et des réglages du système."],["Composants","Le réservoir fournit le fluide et permet dégazage/compensation ; les pompes créent le débit ; les filtres retiennent les contaminants ; les clapets anti-retour imposent un sens ; les sélecteurs distribuent le fluide ; les soupapes de sécurité limitent la pression ; les actionneurs convertissent l’énergie hydraulique en mouvement."],["Accumulateur et puissance","Un accumulateur, généralement gaz/fluide séparés, emmagasine de l’énergie : il amortit les pulsations, fournit un débit transitoire et peut conserver une réserve de pression. Une pompe à débit variable adapte le débit à la demande, tandis qu’une pompe à débit fixe nécessite une régulation adaptée."],["Redondance","Les avions de transport possèdent plusieurs circuits indépendants ou partiellement interconnectés. Un PTU peut transmettre de la puissance mécanique entre circuits sans mélanger les fluides. Des pompes électriques ou entraînées par une RAT peuvent assurer une fonction de secours selon l’architecture."],["Pannes et indications","Une fuite tend à réduire la quantité ; une perte de pompe provoque une pression faible sans nécessairement vider le réservoir ; une température élevée dégrade le fluide et les joints. Le pilote distingue quantité, pression et température avant d’en déduire la nature probable de la panne."],["Accumulateurs, PTU et contamination","Un accumulateur hydraulique stocke de l’énergie sous forme de fluide comprimant un gaz, ce qui amortit les pulsations et fournit une réserve momentanée. Un PTU peut transférer de la puissance d’un circuit à un autre sans mélanger les fluides. La contamination, l’air dissous ou la surchauffe dégradent rapidement les performances."]],"pts":["F = p × S ; le débit commande surtout la vitesse de l’actionneur.","Accumulateur = stockage d’énergie hydraulique et amortissement.","PTU : transfert de puissance, pas transfert normal de fluide.","Une pression basse et une quantité basse ne désignent pas la même panne.","La redondance doit conserver des fonctions essentielles après une panne simple.","Un PTU transfère de la puissance, pas nécessairement du fluide d’un circuit à l’autre."],"f":[["Force hydraulique","F = p × S"],["Puissance hydraulique","P ≈ p × Q"]],"pieges":["Ne pas dire qu’une pompe “crée la pression” indépendamment de la charge : elle crée d’abord du débit.","Ne pas confondre perte de pompe et fuite.","Toujours convertir bar/Pa et cm²/m² avant calcul."],"ex":"À 210 bar sur un piston de 12 cm², la force théorique vaut 21×10⁶ × 0,0012 ≈ 25,2 kN, avant pertes mécaniques.","mod":"021 Airframes & Systems","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 021","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — référence technique","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental-protection"}],"v5":true},{"id":"021 04","t":"Train, roues, pneus et freins","syllabus":"021 04 00 00","cours":[["Atterrisseur et amortissement","Le train transmet les charges au sol, absorbe l’énergie verticale et permet le roulage. Un amortisseur oléopneumatique utilise le gaz comme ressort et le passage d’huile à travers un orifice comme amortisseur. Une extension normale est généralement hydraulique ; un système de secours peut utiliser gravité, ressorts, pression ou libération mécanique."],["Verrouillages et indications","Downlock et uplock maintiennent les positions extrêmes. Les séquences de portes et train comportent des interverrouillages. L’indication “trois vertes” confirme typiquement train sorti et verrouillé ; une discordance entre commande et position entraîne alerte selon l’architecture."],["Direction et shimmy","La roulette de nez est commandée par tiller et/ou palonniers selon la vitesse et le type. Le shimmy est une oscillation rapide de la roue qui peut être limitée par géométrie, amortisseur et bon état du pneu/roue. Le centrage automatique évite souvent une rentrée de train avec roue braquée."],["Freinage, anti-skid et autobrake","Le frein convertit l’énergie cinétique en chaleur. L’anti-skid compare la vitesse des roues et réduit la pression de freinage lorsqu’une roue tend vers le blocage. L’autobrake vise une décélération programmée ; il ne remplace pas l’anti-skid. Après un freinage énergique, la température et le temps de refroidissement deviennent des limitations."],["Pneus et roues","La pression correcte conditionne déformation, échauffement et charge admissible. Les fusible plugs peuvent libérer la pression d’une roue surchauffée afin de réduire le risque d’explosion. Vitesse sol maximale, usure, coupures et flat spots sont des éléments de prévol."],["Aquaplanage et énergie de freinage","L’aquaplanage dynamique apparaît lorsque la pression de l’eau empêche le contact pneu-piste ; il est favorisé par la vitesse, l’eau stagnante et l’usure des pneus. Les freins doivent aussi absorber une énergie thermique très élevée lors d’un rejet de décollage ou d’un freinage lourd, d’où les limites de température et parfois les fusible plugs des roues."]],"pts":["Un amortisseur oléopneumatique combine gaz ressort + huile amortisseur.","Anti-skid évite le blocage ; autobrake commande une décélération cible.","Énergie à dissiper au freinage varie comme V².","Fusible plugs protègent une roue surchauffée.","Position train et verrouillage sont deux informations distinctes.","Anti-skid et bon état des pneus réduisent le risque d’aquaplanage mais ne le suppriment pas."],"f":[["Énergie cinétique","E = ½ m V²"]],"pieges":["Doubler la vitesse quadruple l’énergie de freinage.","Anti-skid n’est pas synonyme d’autobrake.","Un pneu sous-gonflé chauffe davantage."],"ex":"À masse constante, un rejet de décollage à 120 kt impose quatre fois l’énergie d’un arrêt à 60 kt : les limites de brake energy deviennent déterminantes.","mod":"021 Airframes & Systems","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 021","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — référence technique","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental-protection"}],"v5":true},{"id":"021 05","t":"Commandes de vol","syllabus":"021 05 00 00","cours":[["Commandes primaires","Ailerons/roll spoilers contrôlent le roulis, profondeur ou stabilisateur le tangage, gouverne de direction le lacet. Sur un avion lourd, les efforts aérodynamiques imposent souvent des servocommandes hydrauliques irréversibles : le pilote commande une valve ou un calculateur, pas directement la gouverne."],["Commandes secondaires","Volets et becs augmentent CLmax et modifient traînée/pitching moment ; spoilers peuvent réduire la portance, accroître la traînée et aider au roulis ; speed brakes servent principalement à augmenter la traînée. Le trim réduit l’effort permanent nécessaire pour maintenir une condition de vol."],["Protection et asymétrie","Les systèmes de volets/slats surveillent souvent asymétrie, surcharge et vitesse. Une asymétrie peut créer un moment de roulis majeur ; les systèmes arrêtent donc le mouvement avant que l’écart ne devienne dangereux. Des dispositifs de relief ou d’auto-retraction peuvent protéger de charges aérodynamiques excessives."],["Fly-by-wire","La chaîne comprend entrée pilote → capteurs → calculateurs → actionneurs → surfaces, avec retours de position et de dynamique avion. Les lois normales peuvent inclure protections d’enveloppe ; après certaines pannes, une loi dégradée réduit ou supprime ces protections. Les termes normal/alternate/direct dépendent du constructeur mais le concept de dégradation est général."],["Modes dégradés et jam","Une panne hydraulique, électrique, calculateur ou capteur peut réduire l’autorité ou modifier la sensation de commande. Un blocage mécanique se distingue d’une perte d’assistance. Le pilote doit raisonner sur les surfaces encore disponibles et les limitations qui en découlent."],["Dispositifs hypersustentateurs et compensateurs","Les volets, becs et slats augmentent la portance maximale en modifiant cambrure et énergie de couche limite. Les tabs de compensation, servo tabs ou balance tabs réduisent l’effort pilote ou ajustent l’équilibre. En transport moderne, certaines fonctions sont intégrées électroniquement dans les lois de commandes."]],"pts":["Primaires : roulis, tangage, lacet ; secondaires : high-lift, spoilers, trim.","FBW = chaîne électrique avec calculateurs et actionneurs ; les lois peuvent se dégrader.","Trim sert à annuler un effort permanent, pas à “piloter à la place” du pilote.","Asymmetry protection arrête un mouvement dangereux de volets/slats.","Un dispositif hypersustentateur augmente généralement CLmax mais aussi la traînée."],"f":[],"pieges":["Ne pas supposer que tous les spoilers ont la même fonction.","Perte de protection FBW ne signifie pas forcément perte de contrôle.","Un système irréversible ne transmet pas naturellement les efforts aérodynamiques au manche."],"ex":"Une panne de deux circuits hydrauliques peut laisser certaines gouvernes alimentées par un troisième circuit : il faut suivre l’architecture, pas conclure “plus d’hydraulique = plus de commandes”.","mod":"021 Airframes & Systems","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 021","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — référence technique","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental-protection"}],"v5":true},{"id":"021 06","t":"Pneumatique, pressurisation et conditionnement","syllabus":"021 06 00 00","cours":[["Sources pneumatiques","Sur turbine, l’air de prélèvement peut provenir de différents étages compresseur moteur, de l’APU ou d’une source sol. Des valves régulent pression, température et isolation. Une fuite de bleed peut chauffer fortement les structures voisines ; la détection de surchauffe est donc essentielle."],["Air conditioning","Un air-cycle machine refroidit l’air par compression/échange thermique/détente ; la recirculation réduit le débit d’air prélevé et donc la pénalité moteur. Les packs conditionnent le débit et la température avant mélange puis distribution dans la cabine."],["Pressurisation","Le contrôleur agit principalement sur l’outflow valve : l’air entre continuellement, et le débit sortant règle la pression cabine. Des soupapes de sécurité limitent la pression différentielle positive et négative. La cabine suit une altitude cabine planifiée plutôt que la pression extérieure instantanée."],["Altitude cabine et différentiel","Plus l’avion monte, plus la pression extérieure baisse. Pour conserver une altitude cabine acceptable, le différentiel augmente jusqu’à la limite structurale. Une altitude cabine élevée peut résulter d’une fuite, d’un manque d’apport ou d’un défaut de régulation."],["Décompression","Une décompression lente peut être difficile à détecter ; une décompression rapide s’accompagne de bruit, brouillard temporaire et variation brutale de pression. La priorité opérationnelle est l’oxygène équipage puis la descente d’urgence conformément aux procédures."],["Altitude cabine et décompression","La pressurisation maintient une altitude cabine compatible avec la physiologie de l’équipage et des passagers. Une décompression rapide ou explosive impose des actions immédiates : masques, descente d’urgence, surveillance de la structure et gestion des passagers. Le différentiel de pression, et non la seule altitude, détermine les contraintes principales sur le fuselage."]],"pts":["L’outflow valve régule principalement la pression cabine en modulant la sortie d’air.","Pression différentielle = pression cabine − pression extérieure.","Les safety valves protègent contre surpression et pression négative.","Recirculation réduit la demande de bleed air.","Une fuite de bleed est aussi un danger thermique.","Le contrôle cabine vise à limiter altitude cabine et differential pressure dans l’enveloppe certifiée."],"f":[["Différentiel cabine","Δp = pcab − pext"]],"pieges":["Ne pas croire que la pressurisation fonctionne en “pompant” de l’air hors de la cabine.","Altitude cabine et altitude avion sont différentes.","Une outflow valve plus fermée tend à augmenter la pression cabine."],"ex":"En croisière haute altitude, si l’outflow valve s’ouvre excessivement, la pression cabine diminue et l’altitude cabine augmente ; l’alarme peut précéder le déploiement des masques passagers.","mod":"021 Airframes & Systems","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 021","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — référence technique","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental-protection"}],"v5":true},{"id":"021 07","t":"Anti-givrage et dégivrage","syllabus":"021 07 00 00","cours":[["Anti-icing versus de-icing","Anti-icing empêche ou retarde la formation de glace ; de-icing enlève une accumulation. Les ailes peuvent utiliser air chaud ou boots, les sondes et pare-brise souvent chauffage électrique, les hélices chauffage électrique ou fluide selon installation."],["Protection par air chaud","Le bleed air chauffé peut protéger bord d’attaque aile et nacelles. Il consomme de l’énergie moteur et peut donc réduire la performance disponible. Une fuite de duct est dangereuse par température élevée et doit être détectée."],["Boots pneumatiques","Les boots se gonflent cycliquement pour fracturer la glace accumulée. Ils ne doivent pas être confondus avec un système thermique continu. Leur efficacité dépend de l’épaisseur et du type de glace, ainsi que de la procédure de l’avion."],["Sondes, moteurs et pare-brise","Un pitot non chauffé peut donner des indications de vitesse erronées. L’anti-ice moteur protège entrées et éléments exposés ; il modifie souvent les performances. Le chauffage pare-brise assure visibilité mais aussi parfois résistance structurelle et prévention du brouillard."],["Détection et limites","Les détecteurs avertissent d’une accrétion ou de conditions propices selon le système. Aucun système ne rend l’avion invulnérable : severe icing, freezing rain ou SLD peuvent dépasser la certification ; l’évitement reste essentiel."],["Anti-ice, de-ice et opérations sol","Anti-ice empêche la formation de glace ; de-ice enlève une glace déjà formée. Sur avion de transport, les bords d’attaque peuvent être protégés par air chaud ou boots selon la catégorie d’aéronef. Au sol, la contamination des surfaces critiques change totalement les performances et peut rendre le décollage interdit sans traitement adapté."]],"pts":["Anti-ice prévient ; de-ice retire.","Air chaud = efficacité mais prélèvement de puissance/bleed.","Pitot heat protège la mesure de pression totale.","Severe icing peut dépasser les capacités de protection.","Au sol, même une faible contamination des surfaces critiques peut être inacceptable."],"f":[],"pieges":["Ne pas appliquer une procédure boots générique à tous les avions.","Protection active ne signifie pas absence de pénalité de performance.","Givrage sondes peut créer des indications incohérentes sans givrage visible de l’aile."],"ex":"En montée dans un nuage givrant, l’activation engine anti-ice peut réduire le gradient de montée disponible : la performance doit être réévaluée.","mod":"021 Airframes & Systems","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 021","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — référence technique","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental-protection"}],"v5":true},{"id":"021 08","t":"Carburant","syllabus":"021 08 00 00","cours":[["Propriétés","Densité relie masse et volume ; elle varie avec température. Le point de congélation est critique à haute altitude ; volatilité et point éclair influencent comportement et sécurité. La contamination par eau ou particules peut endommager ou interrompre l’alimentation."],["Réservoirs et ventilation","Les réservoirs peuvent être structuraux (wet wing) ou séparés. Le système de ventilation maintient une pression acceptable lors de consommation, montée/descente et transfert. Une ventilation obstruée peut provoquer déformation du réservoir ou interruption d’alimentation."],["Pompes et alimentation","Pompes électriques et entraînées moteur assurent pression et redondance. Une boost pump évite notamment vaporisation et alimente avant démarrage. Les clapets et vannes dirigent le carburant ; le crossfeed permet à un réservoir d’alimenter un moteur différent selon procédures."],["Transfert et équilibrage","Le transfert déplace du carburant entre réservoirs afin d’assurer alimentation, CG ou équilibre latéral. Le crossfeed ne signifie pas nécessairement transfert : il change le chemin d’alimentation. Les procédures évitent d’aggraver une fuite en utilisant incorrectement les vannes."],["Mesure et température","Les systèmes de quantité utilisent souvent des sondes capacitives compensées en densité/diélectrique ; le débit moteur et le fuel used sont distincts de la quantité restante. La température carburant doit rester au-dessus des limites liées au point de congélation."],["Jettison","Sur certains avions, le fuel jettison permet de réduire la masse avant atterrissage tout en préservant une quantité minimale et en évitant les zones dangereuses. Il n’existe pas sur tous les types."],["Mise à l’air, crossfeed et jettison","Les réservoirs doivent être ventilés pour éviter surpression et dépression. Le crossfeed permet d’alimenter un moteur depuis un autre réservoir pour équilibrer la masse ou gérer une panne. Sur certains avions de transport, un système de fuel jettison permet de réduire la masse avant retour atterrissage, sans être universel."]],"pts":["Crossfeed = chemin d’alimentation ; transfer = déplacement de carburant.","Masse = volume × densité.","Ventilation du réservoir est indispensable lors de consommation et variations de pression.","Fuel used et fuel remaining proviennent de logiques de mesure différentes.","Température carburant et point de congélation sont des limites opérationnelles.","Le fuel jettison n’existe pas sur tous les avions et n’est pas un simple circuit de vidange."],"f":[["Masse carburant","m = ρ × V"]],"pieges":["Ne pas confondre quantité indiquée et débit consommé.","Une pompe électrique ON n’exclut pas une fuite.","Une densité plus faible donne moins de masse pour un même volume."],"ex":"À 0,80 kg/L, 5 000 L représentent 4 000 kg. Si la densité devient 0,76 kg/L, le même volume ne représente plus que 3 800 kg.","mod":"021 Airframes & Systems","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 021","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — référence technique","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental-protection"}],"v5":true},{"id":"021 09","t":"Électricité","syllabus":"021 09 00 00","cours":[["Grandeurs de base","Tension est une différence de potentiel, courant un débit de charge, résistance l’opposition au courant. En courant continu, la loi d’Ohm relie U, I et R ; la puissance électrique vaut U×I. Une faible résistance accidentelle peut produire un courant très élevé et un échauffement dangereux."],["DC, AC et conversion","Le DC circule dans un sens ; l’AC change périodiquement de sens. Les avions de transport utilisent souvent AC triphasé pour fortes puissances et DC pour électronique/commandes. TRU convertit AC vers DC ; inverter convertit DC vers AC ; transformateur modifie une tension AC."],["Batteries","Lead-acid, Ni-Cd et lithium ont des caractéristiques de charge et risques différents. Une batterie assure démarrage/backup et stabilisation selon architecture. Ni-Cd et lithium exigent une surveillance thermique : thermal runaway signifie augmentation auto-entretenue de température et courant."],["Génération","Alternateurs/générateurs moteur, APU et external power alimentent le réseau. Un CSD/IDG maintient une fréquence AC convenable malgré variation de régime moteur. Les protections déconnectent une source hors tension/fréquence ou en défaut."],["Distribution","Les bus essentiels/emergency sont maintenus plus longtemps que les charges de confort. Load shedding déleste automatiquement des consommateurs non essentiels après perte de génération. Bus tie et contacteurs reconfigurent le réseau tout en évitant les parallélismes interdits."],["Protection","Fusibles et circuit breakers protègent surtout les câblages. Un breaker ne doit être réarmé que si une procédure l’autorise : un défaut persistant peut provoquer surchauffe ou incendie. Bonding et static dischargers limitent différences de potentiel et interférences."],["Architecture AC/DC et gestion de charge","Un avion peut combiner génération AC et réseau DC via TRU ou convertisseurs ; l’inverter effectue l’opération inverse lorsque nécessaire. En cas de panne générateur, le load shedding déleste automatiquement des charges non essentielles pour préserver l’alimentation des bus prioritaires. APU, GPU ou batteries peuvent être des sources alternatives selon la phase de vol ou de maintenance."]],"pts":["U = R I ; P = U I.","TRU : AC→DC ; inverter : DC→AC ; transformateur : AC→AC.","Load shedding préserve les charges essentielles.","Circuit breaker protège le circuit/câblage, pas directement l’équipement.","Thermal runaway est critique pour certaines batteries.","TRU : AC vers DC ; inverter : DC vers AC."],"f":[["Loi d’Ohm","U = R × I"],["Puissance électrique","P = U × I"],["Énergie","E = P × t"]],"pieges":["Ne pas confondre kW et kWh.","Une perte de générateur et une perte de bus n’ont pas les mêmes conséquences.","Réarmer répétitivement un CB peut être dangereux."],"ex":"Un bus 28 V alimente 35 A : la charge vaut 980 W. Si une source est perdue, l’architecture peut délester les galleys tout en conservant instruments et communications essentiels.","mod":"021 Airframes & Systems","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 021","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — référence technique","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental-protection"}],"v5":true},{"id":"021 10","t":"Moteurs à pistons","syllabus":"021 10 00 00","cours":[["Cycle et puissance","Le moteur quatre temps suit admission, compression, combustion/détente, échappement. Le couple agit sur le vilebrequin ; la puissance dépend du couple et du régime. Le taux de compression influence rendement et tendance à la détonation."],["Admission et mélange","Carburateur ou injection dosent carburant et air. Un carburateur peut givrer par chute de pression et vaporisation, même à température extérieure positive. Le mixture control adapte le rapport air/carburant à la densité et à la phase de vol ; l’EGT aide au réglage."],["Détonation et pré-allumage","La détonation est une combustion anormale explosive après allumage normal ; le pré-allumage commence avant l’étincelle, souvent à cause d’un point chaud. Température, pression, indice d’octane et mixture influencent ces phénomènes. Ils peuvent rapidement endommager pistons et soupapes."],["Allumage","Les magnétos sont autonomes du réseau électrique et alimentent généralement deux bougies par cylindre. La vérification magnétos recherche une chute RPM raisonnable et symétrique. P-lead met la magnéto à la masse pour l’arrêter ; sa rupture peut laisser une magnéto active."],["Lubrification et refroidissement","L’huile réduit friction, évacue chaleur, nettoie et protège. Pression basse + température élevée peut signaler perte d’huile ; une indication isolée peut aussi être instrumentale. Le refroidissement peut être air ou liquide selon moteur."],["Suralimentation et hélice","Supercharger/turbocharger augmentent la masse d’air admise et maintiennent puissance en altitude. Wastegate contrôle l’énergie turbine du turbo. Sur hélice à vitesse constante, governor ajuste le pas afin de tenir le régime sélectionné."],["Détonation, préallumage et givrage carburateur","La détonation correspond à une combustion anormale très rapide après l’allumage ; le préallumage débute avant l’étincelle et peut devenir destructeur. Les moteurs à pistons restent sensibles au givrage carburateur dans certaines plages de température et d’humidité, même par météo apparemment clémente."]],"pts":["Puissance mécanique = couple × vitesse angulaire.","Carb icing peut apparaître par température extérieure positive.","Détonation ≠ pré-allumage.","Magnétos sont normalement indépendantes du réseau électrique.","Wastegate régule le turbo ; governor régule le régime hélice.","Détonation et préallumage ne sont pas synonymes."],"f":[["Puissance","P = C × ω"]],"pieges":["Une mixture trop riche ou trop pauvre modifie EGT/CHT différemment selon régime.","Ne pas supposer qu’une panne alternateur arrête un moteur à magnétos.","MAP et RPM jouent des rôles différents sur moteur à hélice constante."],"ex":"À 2 400 RPM et 250 N·m, ω ≈ 251 rad/s et P ≈ 62,8 kW.","mod":"021 Airframes & Systems","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 021","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — référence technique","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental-protection"}],"v5":true},{"id":"021 11","t":"Moteurs à turbine","syllabus":"021 11 00 00","cours":[["Cycle thermodynamique","Entrée/diffuseur ralentit et redresse l’air, compresseur augmente pression, chambre de combustion ajoute de l’énergie, turbine prélève une partie de cette énergie pour entraîner compresseur/accessoires, tuyère transforme le reste en vitesse de jet. Dans un turboprop, davantage d’énergie est extraite pour l’hélice."],["Compresseurs","Axial : grand débit, petit diamètre ; centrifuge : robuste, fort rapport par étage mais grand diamètre. Plusieurs spools permettent à des ensembles compresseur/turbine de tourner à des vitesses optimales différentes. Stator variable et bleed valves améliorent la marge au stall compresseur."],["Stall et surge","Stall compresseur = séparation locale sur les aubages ; surge = instabilité globale avec oscillation de débit/pression, parfois inversion de flux. Indices possibles : bang, vibrations, EGT élevée, fluctuations RPM. Causes : perturbation d’entrée, accélération rapide, givrage, dommages ou conditions hors enveloppe."],["Combustion et turbine","La combustion est continue. Turbine haute pression entraîne généralement compresseur HP ; turbine basse pression entraîne fan ou compresseur LP. Les températures turbines limitent fortement le moteur, d’où mesure EGT/ITT/TGT selon architecture."],["Poussée et rendement","La poussée provient du changement de quantité de mouvement. Un turbofan à fort bypass accélère une grande masse d’air d’une quantité modérée, ce qui améliore le rendement propulsif subsonique. La poussée disponible diminue généralement avec altitude/température élevée."],["Démarrage, FADEC et limites","Le démarreur entraîne le compresseur avant introduction carburant/allumage. Hot start = température excessive ; hung start = accélération insuffisante ; wet start = carburant sans allumage. FADEC dose carburant et protège certaines limites mais ne supprime pas toutes les responsabilités de surveillance."],["Turbofan, FADEC et inverseurs","Un turbofan produit une poussée combinée du flux primaire et du flux secondaire ; le bypass ratio influence rendement et bruit. Le FADEC optimise automatiquement de nombreux paramètres moteur tout en restant limité par les capteurs et l’alimentation électrique. Les inverseurs de poussée aident au ralentissement mais ne remplacent ni les freins ni les spoilers."]],"pts":["Compresseur augmente pression ; turbine fournit le travail mécanique au compresseur.","Surge est plus global et sévère qu’un stall local.","Turbofan haut bypass améliore l’efficacité propulsive en subsonique.","Hot, hung et wet start sont trois anomalies distinctes.","FADEC gère le moteur mais ne rend pas toutes les limites impossibles à dépasser.","Le FADEC améliore gestion et protection moteur, sans supprimer la surveillance équipage."],"f":[["Poussée simplifiée","F ≈ ṁ (Vjet − V0)"]],"pieges":["Ne pas dire que toute l’énergie turbine produit la poussée : une partie entraîne le compresseur.","EGT/ITT/TGT ne sont pas interchangeables sans connaître le moteur.","Plus de bypass n’implique pas automatiquement plus de poussée dans toutes les conditions."],"ex":"Une température extérieure élevée réduit la densité et peut rendre le moteur temperature-limited avant d’atteindre la poussée nominale.","mod":"021 Airframes & Systems","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 021","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — référence technique","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental-protection"}],"v5":true},{"id":"021 12","t":"Détection et protection incendie","syllabus":"021 12 00 00","cours":[["Détection","Boucles thermiques, détecteurs de surchauffe, fumée et feu surveillent moteurs, APU, soutes et zones spécifiques. Une boucle continue peut détecter une élévation de température sur sa longueur ; un système double loop réduit les fausses alarmes et augmente la redondance."],["Protection moteur/APU","Une action FIRE peut fermer carburant, hydraulique, bleed et générateur selon type, isolant la zone avant décharge extincteur. L’extincteur ne refroidit pas nécessairement durablement une fuite chaude ; l’isolation de la source est donc fondamentale."],["Soutes","Les compartiments cargo utilisent détection fumée et systèmes d’extinction adaptés à leur classe. Sur certains avions, une première décharge rapide puis un débit de maintien protège pendant le déroutement. La durée de protection influence la planification ETOPS/EDTO."],["Feux électriques et batteries","Une fumée électrique exige réduction/isolement de la source selon checklist. Les feux lithium présentent un risque particulier de thermal runaway ; les moyens de lutte dépendent de l’équipement et des procédures approuvées."],["Alertes","Warning rouge demande action immédiate ; caution ambre/jaune signale une situation nécessitant attention et action adaptée. La philosophie exacte de couleurs/sons est constructeur, mais l’objectif est de hiérarchiser les menaces."],["Boucles de détection et agents extincteurs","La détection incendie utilise souvent des boucles sensibles à la température, redondées pour limiter les fausses alertes. Les agents extincteurs ne servent pas tous au même usage : compartiment moteur, soute cargo ou toilettes répondent à des logiques différentes. Une extinction réussie impose aussi isolement de la source et suppression de l’alimentation en combustible ou en oxygène lorsque c’est prévu."]],"pts":["Détection, isolation et extinction sont trois fonctions distinctes.","Une commande FIRE isole souvent plusieurs énergies en plus du carburant.","Double loop améliore tolérance aux fausses alarmes/pannes.","Cargo fire protection doit durer jusqu’à l’atterrissage prévu selon conception/opération.","Détecter un incendie ne suffit pas : il faut aussi isoler et priver le foyer de ce qui l’entretient."],"f":[],"pieges":["Ne pas supposer qu’un extincteur corrige une fuite combustible.","Une alarme feu peut provenir d’un détecteur défectueux, mais doit être traitée comme réelle jusqu’à preuve/procédure contraire."],"ex":"Après FIRE ENG, l’arrêt moteur seul n’est pas toujours suffisant : la poignée/commande dédiée peut isoler bleed, hydraulique, électrique et agent extincteur.","mod":"021 Airframes & Systems","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 021","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — référence technique","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental-protection"}],"v5":true},{"id":"021 13","t":"Oxygène","syllabus":"021 13 00 00","cours":[["Pourquoi de l’oxygène","La pression partielle d’oxygène diminue avec la pression atmosphérique. À haute altitude, l’organisme peut devenir hypoxique malgré une proportion d’O₂ atmosphérique presque constante. Le système doit fournir une pression partielle inspirée suffisante."],["Stockage","Oxygène gazeux : bouteilles haute pression, quantité mesurée par pression corrigée de température. Oxygène chimique : générateurs déclenchés, autonomie fixe, production de chaleur. L’oxygène liquide existe surtout dans certaines applications spécialisées."],["Masques équipage","Diluter-demand mélange air cabine et O₂ en proportion croissante ; 100 % O₂ élimine l’air cabine ; pressure-demand fournit une pression positive respiratoire à très haute altitude. Les quick-donning masks doivent être immédiatement accessibles selon type d’opération."],["Passagers","Après dépressurisation, des masques peuvent tomber automatiquement à une altitude cabine définie. Les générateurs chimiques fonctionnent pendant une durée limitée et ne sont pas normalement arrêtables une fois déclenchés."],["Sécurité et autonomie","O₂ accélère la combustion : huiles/graisses sont dangereuses au contact. Une autonomie se calcule par quantité disponible/débit seulement pour un modèle simple ; les systèmes réels varient avec pression, nombre d’utilisateurs et mode de régulation."],["Sources d’oxygène et décompression","L’oxygène peut être stocké sous forme gazeuse, liquide ou produit chimiquement selon le type d’avion et la fonction recherchée. Les masques équipage diffèrent des masques passagers, notamment pour la protection fumées et la rapidité d’utilisation. Une décompression à haute altitude réduit fortement le temps utile de conscience, d’où l’importance des automatismes et de l’entraînement."]],"pts":["Proportion d’O₂ ≈ constante, mais pression partielle diminue avec altitude.","Diluter-demand, 100 % et pressure-demand sont des modes distincts.","Générateur chimique : durée fixe et forte chaleur.","Oxygène favorise la combustion : contamination graisse/huile interdite.","Temps utile de conscience : notion clé en cas de décompression à haute altitude."],"f":[["Autonomie simplifiée","t = quantité disponible / débit"]],"pieges":["Ne pas assimiler pression bouteille directement à durée sans connaître volume/régulation.","Masque passager et masque équipage n’ont pas le même objectif ni la même régulation."],"ex":"Une bouteille de 600 L équivalents à 40 L/min donnerait 15 min dans un modèle à débit constant, mais un système réel demande les données du constructeur.","mod":"021 Airframes & Systems","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 021","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — référence technique","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental-protection"}],"v5":true}];
const Q021=[["Quel est le principe du fail-safe ?",["Une seule voie de charge","Plusieurs chemins de charge permettant de tolérer une défaillance","Une structure sans maintenance","Une structure uniquement composite"],1,"Le fail-safe repose sur la redondance des chemins de charge."],["La contrainte (stress) est...",["une déformation","une force interne par unité de surface","une masse","une vitesse"],1,"Le stress est une force interne rapportée à une surface."],["Quel facteur favorise la fatigue structurale ?",["Le nombre de cycles","La couleur de la peinture","Le QNH uniquement","La température ISA uniquement"],0,"Le nombre de cycles est un facteur de fatigue."],["Quelle maintenance surveille l’état d’un équipement ?",["Hard-time uniquement","On-condition / condition monitoring","Aucune","Maintenance après accident uniquement"],1,"On-condition et condition monitoring utilisent l’état du matériel pour la maintenance."],["Quel est l’avantage principal d’un système hydraulique ?",["Transmettre de fortes forces avec des actionneurs compacts","Produire de l’oxygène","Mesurer le Mach","Remplacer toujours l’électricité"],0,"La transmission hydraulique permet de fortes forces avec des composants relativement compacts."],["Dans un circuit hydraulique, la pression agit sur une surface pour produire...",["une force","une masse","un Mach","une température ISA"],0,"F = P × A."],["Le système anti-skid agit principalement sur...",["la température cabine","le risque de blocage des roues au freinage","la pression cabine","le débit carburant"],1,"L’anti-skid limite le glissement/blocage des roues."],["Quel dispositif commande généralement la direction du train avant d’un avion de transport ?",["Tiller/hand wheel","Magnétos","Outflow valve","Ram-air turbine"],0,"Le tiller/hand wheel est un moyen courant de steering du train avant."],["Quelle est une commande de vol primaire ?",["Volet","Aileron","Speed brake","Trim"],1,"L’aileron est une commande primaire."],["Le trim sert principalement à...",["maintenir une condition de vol sans effort continu du pilote","augmenter le carburant","pressuriser la cabine","refroidir le moteur"],0,"Le trim réduit l’effort nécessaire pour maintenir une attitude/condition."],["Quelle est une source possible de bleed air sur un avion à turbine ?",["APU","Magnétos uniquement","Pneus","Freins"],0,"Le bleed air peut notamment provenir du moteur ou de l’APU."],["La pressurisation contrôle notamment...",["ventilation, température et pression","uniquement la vitesse","uniquement le carburant","uniquement le freinage"],0,"Le syllabus associe ventilation, température et pression."],["Quel système utilise des boots gonflables ?",["Dégivrage de certaines surfaces","Freinage","Pressurisation","Allumage"],0,"Les boots sont un système de de-icing pneumatique."],["Quel composant permet de pomper le carburant vers le moteur ?",["Boost pump","Outflow valve","Static wick","Trim actuator"],0,"La boost pump fournit l’alimentation en carburant sous pression."],["Un bus électrique sert principalement à...",["distribuer l’énergie électrique","mesurer la vitesse","stocker l’oxygène","contrôler le train"],0,"Les bus distribuent l’alimentation aux différents consommateurs."],["Dans un moteur à pistons quatre temps, l’ordre général est...",["admission-compression-combustion/expansion-échappement","échappement-admission-compression","compression-admission-échappement","combustion-échappement-admission"],0,"C’est le cycle quatre temps classique."],["Dans une turbine, le compresseur sert à...",["comprimer l’air avant la combustion","refroidir les pneus","pressuriser la cabine directement","produire de l’oxygène"],0,"Le compresseur augmente la pression de l’air avant la chambre de combustion."],["Une turbine extrait de l’énergie principalement pour...",["entraîner le compresseur et les accessoires, et selon le moteur fournir la puissance utile","mesurer le QNH","actionner le train uniquement","produire du carburant"],0,"La turbine récupère l’énergie des gaz pour entraîner les organes concernés."],["Un système de détection incendie sert à...",["détecter une condition anormale et alerter l’équipage","augmenter la poussée","calculer le centrage","remplacer les freins"],0,"La détection précède l’alerte et l’application des procédures."],["Lors d’une dépressurisation, le système d’oxygène sert à...",["fournir de l’oxygène aux occupants selon l’architecture et la procédure","refroidir les moteurs","freiner l’avion","mesurer la TAS"],0,"Les systèmes d’oxygène permettent de répondre à une baisse de pression cabine."]];
const F021=[["Fail-safe","Conception tolérant une défaillance grâce à plusieurs chemins de charge."],["Damage-tolerant","Conception tenant compte de la présence possible de dommages et de leur propagation."],["Stress","Force interne par unité de surface."],["Strain","Déformation résultant de l’action des contraintes."],["Hard-time","Maintenance effectuée à un intervalle de temps/cycles fixé."],["On-condition","Maintenance déclenchée par l’état constaté du matériel."],["Hydraulique","Système transmettant une force via un fluide sous pression."],["Anti-skid","Système limitant le glissement/blocage des roues au freinage."],["Commande primaire","Gouverne agissant directement sur les trois axes : profondeur, roulis, lacet."],["Commande secondaire","Volets, becs, spoilers et trim notamment."],["Bleed air","Air prélevé d’une source pneumatique, notamment du moteur ou de l’APU sur les turbines."],["Outflow valve","Valve contrôlant l’évacuation d’air de la cabine et donc la pression cabine."],["Boost pump","Pompe alimentant le circuit carburant sous pression."],["Bus","Barre de distribution électrique alimentant plusieurs consommateurs."],["Cycle turbine","Admission/compression, combustion, détente dans la turbine puis évacuation des gaz."]];

const INST022=[{"id":"022 01","t":"Capteurs et instruments","syllabus":"022 01 00 00","cours":[["Chaîne de mesure","Toute indication suit une chaîne : grandeur physique → capteur → conditionnement/numérisation → calcul → affichage. Une indication erronée peut donc provenir du capteur, de la transmission, du calculateur ou de l’affichage ; le cross-check avec une source indépendante est essentiel."],["Pression","Capsule anéroïde mesure une pression absolue ou différentielle ; soufflet augmente le déplacement ; diaphragme réagit à différence de pression ; tube de Bourdon redresse sa courbure sous pression. Ils servent à mesurer huile, hydraulique, bleed, MAP/EPR ou pression atmosphérique selon installation."],["Température","Thermocouple produit une tension liée à une différence de température ; RTD/sonde résistive change de résistance ; thermistance a un coefficient de température marqué. Les températures moteur sont mesurées dans des zones définies : CHT, EGT, ITT/TGT selon moteur."],["Position et quantité","Potentiomètres, synchros, resolvers et capteurs inductifs transmettent position/angle. La quantité carburant est souvent capacitive : le diélectrique entre électrodes change avec le niveau et la nature du carburant. Des compensations améliorent l’indication de masse."],["Erreurs et tolérance","Précision, résolution, hystérésis, friction et étalonnage sont distincts. Les systèmes critiques utilisent redondance, comparaison et drapeaux de panne plutôt que faire confiance à une seule mesure."],["Instruments de secours et alimentation","Les instruments de secours doivent rester disponibles en cas de panne partielle des écrans ou des calculateurs. Ils peuvent disposer de capteurs propres, d’une alimentation indépendante ou d’une batterie dédiée. La logique de reversionary mode sur avion moderne vise à conserver une information minimale exploitable."]],"pts":["Chaîne de mesure = capteur → traitement → affichage.","Pression absolue et différentielle sont différentes.","Thermocouple : tension thermoélectrique ; RTD/thermistance : résistance.","Capacitance est courante pour quantité carburant.","Cross-check = comparer des sources indépendantes.","Un affichage intégré moderne doit toujours être replacé dans sa logique de secours."],"f":[],"pieges":["Ne pas attribuer automatiquement toute mauvaise indication au capteur.","Résolution élevée ne garantit pas une bonne exactitude."],"ex":"Deux capteurs AoA divergent : le système peut voter/écarter une source selon architecture, mais une dégradation des protections peut apparaître.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"022 02","t":"Données air : Pitot-statique, altitude, vitesse et Mach","syllabus":"022 02 00 00","cours":[["Pression totale et statique","Le pitot mesure la pression totale Pt ; les prises statiques mesurent Ps. À basse vitesse incompressible, la pression dynamique q ≈ Pt−Ps = ½ρV². L’anémomètre interprète ce différentiel ; l’altimètre et le VSI utilisent uniquement la pression statique."],["IAS, CAS, EAS, TAS","IAS est la lecture instrumentale ; CAS corrige erreurs instrument/position ; EAS corrige la compressibilité ; TAS corrige ensuite la densité. À basse altitude/vitesse, différences faibles ; en haute altitude/forte vitesse elles deviennent importantes. La GS ajoute l’effet du vent à la TAS."],["Altimètre","L’altimètre convertit pression statique en altitude selon atmosphère standard et calage. Une baisse de pression avec réglage inchangé fait surestimer l’altitude vraie par rapport au terrain. Température non standard modifie également altitude vraie ; “from high to low, look out below” reste un rappel qualitatif."],["VSI et ADC","Le VSI classique compare pression statique instantanée à une pression retardée ; il présente donc un retard. Un Air Data Computer combine pressures/températures et calcule altitude, vitesses, Mach, température, parfois vertical speed et corrections."],["Mach et température","Mach = TAS / vitesse locale du son. La sonde TAT mesure une température affectée par échauffement de compression ; SAT/OAT est obtenue après correction du recovery. La vitesse du son dépend principalement de la température absolue."],["Pannes Pitot/statique","Pitot bloqué avec drain bloqué peut faire agir l’ASI comme un altimètre ; statique bloquée fige l’altimètre, met VSI à zéro et fausse ASI selon variation altitude. Le résultat exact dépend de ce qui est obstrué : pitot, drain ou static."],["Erreurs altimétriques et de compressibilité","Outre les erreurs de position et de calibrage, les instruments air data subissent des effets de compressibilité à grande vitesse. L’erreur de pression statique influence simultanément altitude, vitesse indiquée et Mach calculé. Une source statique obstruée ou une fuite peuvent produire des symptômes croisés qu’il faut savoir reconnaître."]],"pts":["ASI utilise Pt−Ps ; altimètre et VSI utilisent Ps.","IAS → CAS → EAS → TAS : chaque étape corrige un effet différent.","Mach = TAS/a ; a dépend de température absolue.","Statique bloquée affecte simultanément ASI, altimètre et VSI.","ADC centralise et corrige les données air.","Une panne Pitot n’a pas les mêmes symptômes qu’une panne statique."],"f":[["Pression dynamique","q = ½ ρ V²"],["Mach","M = TAS / a"]],"pieges":["Ne pas confondre TAS et GS.","Pitot bouché seul et pitot+drain bouchés ne donnent pas la même panne.","Altitude indiquée correcte ne garantit pas altitude vraie en température non standard."],"ex":"Après obstruction statique en montée : altimètre reste proche de la valeur au moment du blocage, VSI revient vers zéro et IAS tend à sous-indication.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"022 03","t":"Magnétisme et compas","syllabus":"022 03 00 00","cours":[["Champ terrestre","Le champ magnétique terrestre possède une composante horizontale et verticale. Variation/déclinaison = angle entre nord vrai et nord magnétique ; elle dépend du lieu et évolue avec le temps. Inclinaison magnétique augmente généralement vers les pôles."],["Compas direct","Une rose aimantée s’aligne sur composante horizontale. La déviation provient du champ propre de l’aéronef et varie avec cap/configuration électrique ; une carte de déviation sert à corriger. Les erreurs d’inclinaison provoquent erreurs de virage et d’accélération, surtout aux latitudes moyennes/hautes."],["Erreurs de virage et accélération","Dans l’hémisphère Nord, le compas direct présente overshoot/undershoot selon cap Nord/Sud ; les mnémotechniques ne remplacent pas la compréhension du dip. Sur cap Est/Ouest, une accélération peut créer une indication vers le Nord et une décélération vers le Sud (ANDS, hémisphère Nord)."],["Flux valve","Une flux valve détecte direction du champ terrestre sans avoir à lire directement une carte mobile. Montée loin des perturbations magnétiques, elle alimente un système de cap asservi qui combine référence magnétique et stabilité gyro/inertielle."],["Contrôle croisé","Avant vol, cohérence avec cap piste ou autre référence permet détecter grosse erreur. En vol, comparer compas direct, heading system et navigation aide à isoler une source erronée."],["Erreurs du compas magnétique","Le compas magnétique est sensible à la dip magnétique, aux accélérations et aux virages. Les règles mnémotechniques du type UNOS/ANDS en hémisphère nord illustrent ces erreurs mais doivent être comprises, pas seulement récitées. Elles dépendent aussi de la latitude."]],"pts":["Variation : vrai↔magnétique ; déviation : champ propre avion.","Flux valve fournit une référence magnétique à un système de cap.","Dip magnétique crée erreurs d’accélération et de virage.","La déviation est dépendante de l’installation et du cap.","Variation et déviation sont des corrections différentes ; turning/acceleration errors concernent le compas magnétique."],"f":[],"pieges":["Ne pas appliquer une règle mnémotechnique de l’hémisphère Nord à l’hémisphère Sud.","Un compas exact au parking peut être perturbé par équipement/configuration différente."],"ex":"Un cap piste connu est 270°M et le compas indique 276° : une erreur grossière de 6° doit être comparée aux tolérances/procédures avant départ.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"022 04","t":"Gyroscopes et références d’attitude","syllabus":"022 04 00 00","cours":[["Principes","Un gyro mécanique en rotation tend à conserver son plan (rigidité) et réagit à un couple par précession. Les instruments modernes peuvent employer gyros laser/fibre optique ou MEMS, mais fournissent la même information fondamentale : taux angulaire/attitude."],["Horizon artificiel","Un horizon gyroscopique établit une référence verticale/attitude. Les systèmes classiques peuvent subir erreurs d’accélération, erection et limites de liberté ; les AHRS modernes fusionnent gyros, accélérations et parfois magnétisme."],["Direction gyro","Un directional gyro offre une référence stable à court terme mais dérive ; un système asservi à une référence magnétique corrige progressivement cette dérive. En mode free gyro, l’équipage doit recaler selon procédures."],["Rate gyro","Le turn coordinator/rate gyro mesure surtout vitesse angulaire plutôt qu’angle absolu. Un virage rate one correspond à environ 3°/s, donc 180° en 60 s."],["Pannes et sources","Perte vacuum, alimentation électrique ou données AHRS peut provoquer drapeaux/flags. Le pilote doit connaître la source d’alimentation de chaque instrument de secours afin d’éviter de comparer deux indications dépendant de la même panne."]],"pts":["Rigidité et précession sont les propriétés gyro classiques.","Heading gyro dérive sans référence/correction.","Rate one ≈ 3°/s.","AHRS peut combiner gyros, accéléromètres et magnétomètres.","Indépendance des sources est essentielle au cross-check."],"f":[["Virage rate 1","temps (s) = Δcap / 3"]],"pieges":["Un attitude indicator ne mesure pas directement l’altitude.","Deux écrans différents peuvent dépendre du même AHRS."],"ex":"Pour changer de cap de 90° à rate one, durée ≈ 30 s.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"022 05","t":"Navigation inertielle et IRS","syllabus":"022 05 00 00","cours":[["Principe inertiel","Accéléromètres mesurent accélérations spécifiques ; gyros mesurent rotations. Après initialisation de position et alignement, l’ordinateur transforme ces mesures dans un repère Terre puis intègre accélération en vitesse et vitesse en position. Aucun signal radio extérieur n’est nécessaire pour fonctionner."],["Plateforme versus strapdown","Un ancien INS stabilise physiquement une plateforme ; un IRS strapdown fixe capteurs à l’aéronef et effectue les transformations mathématiquement. Les strapdown dominent grâce à électronique et gyros modernes."],["Alignement","Au sol, l’IRS détermine attitude locale à partir gravité et rotation terrestre, avec position initiale correcte. Un déplacement de l’avion durant alignement peut l’invalider. La latitude et la qualité des capteurs influencent temps et précision."],["Dérive","De petites erreurs de capteur s’intègrent avec le temps : la position inertielle dérive. Le GNSS ou DME/DME peut être fusionné par FMS pour limiter l’erreur de navigation globale sans “corriger physiquement” la plateforme de la même manière sur tous les systèmes."],["Sorties","IRS fournit attitude, cap vrai, vitesse sol, track, position et accélérations selon architecture. Une panne d’une IRS peut être masquée par redondance ; la comparaison de plusieurs unités détecte une source divergente."],["Alignement et mise à jour inertielle","Un IRS doit être correctement aligné sur une position de départ fiable. Une erreur d’initialisation contamine ensuite la solution inertielle. Selon l’architecture, l’IRS peut être mis à jour par GNSS, DME/DME ou autres moyens de navigation pour limiter la dérive de position."]],"pts":["INS/IRS est autonome après alignement mais dérive avec le temps.","Strapdown = capteurs fixés à cellule + calcul numérique.","Position initiale incorrecte contamine la solution.","GNSS et radio-nav peuvent être fusionnés pour limiter erreur position.","Une mauvaise position d’alignement IRS peut générer une erreur cohérente mais fausse."],"f":[],"pieges":["Ne pas dire qu’IRS mesure directement la position : elle est calculée par intégration.","Alignement n’est pas une simple mise sous tension."],"ex":"Une dérive de 1 NM/h donne théoriquement 4 NM après 4 h sans recalage externe, ce qui illustre l’intérêt de la fusion GNSS/FMS.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"022 06","t":"Pilotage automatique et flight director","syllabus":"022 06 00 00","cours":[["Boucle fermée","Un autopilot compare consigne et état mesuré, calcule une erreur puis commande des servos. Inner loop stabilise attitude/taux ; outer loop transforme une consigne comme altitude, cap ou trajectoire en commandes d’attitude."],["Flight director","Le FD calcule les ordres de guidage et les affiche au pilote. AP peut suivre ces mêmes ordres automatiquement. FD ON ne signifie pas AP engagé ; AP engagé n’implique pas qu’un mode attendu est actif : le FMA est la référence de mode."],["Modes latéraux","HDG maintient un cap sélectionné ; NAV/LNAV suit une route calculée ou radio ; LOC capture/localise l’axe ILS. L’armement précède souvent la capture, puis le mode devient actif ; il faut vérifier les annunciations."],["Modes verticaux","VS, FPA, ALT, VNAV, GS/GP ont des lois différentes. Un mode vitesse peut utiliser tangage tandis que poussée gère énergie, ou inversement selon architecture. Mauvaise conscience du mode est une source de mode confusion."],["Autoland et dégradations","Approche automatique utilise redondance capteurs/calculs et peut avoir modes fail-passive/fail-operational selon certification. Les minima applicables dépendent de l’ensemble avion/équipage/aérodrome, pas du seul fait que l’AP possède un mode LAND."],["Modes latéraux et verticaux","Le pilote automatique combine des modes de tenue (HDG, ALT, VS, FPA) et des modes de capture ou de suivi (LOC, GS, LNAV, VNAV selon équipement). La compréhension du mode actif et armé est essentielle pour éviter une surprise d’automatisation. Un avion ne fait jamais “ce qu’il veut” : il fait ce que son mode commande ou ce qu’il peut encore faire dans ses limites."]],"pts":["FD donne guidance ; AP exécute automatiquement.","FMA est l’indication principale des modes armés/actifs.","Capture ≠ armement.","Autopilot est une boucle fermée alimentée par capteurs.","Autoland capability n’est pas synonyme d’autorisation opérationnelle.","Toujours distinguer mode armé et mode actif."],"f":[],"pieges":["Ne jamais déduire le mode actif de la position des sélecteurs seulement.","VS élevé peut conduire à basse vitesse si l’énergie n’est pas surveillée."],"ex":"Après sélection ALT 10 000 ft, le mode peut d’abord rester VS puis capturer ALT ; le pilote surveille le FMA plutôt que supposer la capture.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"022 08","t":"Trim, yaw damper et protections d’enveloppe","syllabus":"022 08 00 00","cours":[["Trim","Le trim réduit les efforts permanents. Un trimmable horizontal stabilizer peut porter l’effort aérodynamique principal plutôt qu’un simple trim tab. Auto-trim peut fonctionner avec AP ou FBW ; runaway trim crée un moment croissant et doit être traité rapidement."],["Mach trim","À haute vitesse, déplacement du centre de pression et compressibilité peuvent créer une tendance nose-down. Mach trim applique une correction de tangage dans la plage prévue ; il peut être indépendant de l’AP."],["Yaw damper","Le yaw damper détecte lacet/roulis oscillatoire et commande le rudder pour amortir le Dutch roll. Son autorité est limitée et il ne remplace pas le pilotage normal de direction pour toutes les fonctions."],["Flight-envelope protection","Une FEP utilise AoA, vitesse, configuration, charge ou attitude selon avion pour prévenir stall, overspeed ou limites de bank/pitch. Sur FBW, la protection peut modifier directement la relation sidestick-surface ; en loi dégradée certaines protections disparaissent."],["Avertissement versus protection","Stall warning informe avant stall ; stall protection intervient pour empêcher/réduire l’approche de l’incidence critique. Stick shaker et stick pusher sont donc des fonctions différentes."],["Mach trim et soulagement de charge","À haute vitesse, le Mach trim compense certaines tendances de stabilité liées à la compressibilité. Le load alleviation ou gust alleviation réduit les efforts structuraux en commandant automatiquement certaines surfaces. Ces fonctions améliorent sécurité et confort mais ne remplacent pas le respect de l’enveloppe de vol."]],"pts":["Yaw damper amortit Dutch roll.","Mach trim corrige un comportement haute vitesse.","Warning avertit ; protection peut agir.","Runaway trim peut créer un moment important même avec commandes neutres.","Mach trim et yaw damper ont des rôles différents."],"f":[],"pieges":["Ne pas confondre stick shaker et pusher.","Protections FBW peuvent être perdues en loi dégradée."],"ex":"Une panne yaw damper peut imposer une limitation d’altitude/vitesse car l’amortissement directionnel devient insuffisant dans certaines zones.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"022 09","t":"Autothrust / autothrottle","syllabus":"022 09 00 00","cours":[["Fonction","Le système commande poussée ou position manettes selon architecture afin de tenir une vitesse, un Mach, une poussée fixe ou un profil FMS. Autothrottle déplace souvent les manettes ; autothrust peut commander le moteur sans déplacement identique selon constructeur."],["Modes","THR/THRUST maintient une consigne de poussée ; SPEED/MACH module poussée pour tenir vitesse ; IDLE réduit à ralenti lorsque requis. Le mode actif doit être lu au FMA, surtout lors transitions montée, capture altitude, descente et approche."],["Interaction énergie","Si poussée est à une limite, vitesse peut être contrôlée par tangage ; si tangage suit trajectoire, A/THR doit disposer de marge de poussée pour tenir vitesse. Un mode vertical agressif peut saturer l’autothrust."],["Déconnexion et pannes","Une déconnexion exige que le pilote replace/contrôle les manettes selon type. Une panne de capteur vitesse ou moteur peut dégrader le système. L’auto-thrust ne remplace pas la surveillance des paramètres moteurs et de l’énergie."],["Modes d’automanette","L’autothrust/autothrottle peut fonctionner en modes poussée fixe, maintien de vitesse, gestion de poussée selon phase de vol ou remise de gaz. Une asymétrie moteur, une panne sonde ou une discordance mode/attente équipage imposent une surveillance permanente. L’automanette ne dispense jamais du cross-check de poussée affichée et de trajectoire."]],"pts":["Autothrust et autopilot sont intégrés mais distincts.","FMA confirme le mode A/THR actif.","Une saturation à thrust limit signifie que la vitesse peut ne plus être tenue.","Déconnexion requiert gestion manuelle immédiate de la poussée.","L’automanette peut être active ou armée ; l’équipage doit surveiller la poussée réelle."],"f":[],"pieges":["Ne pas supposer que “SPEED” signifie forcément contrôle de vitesse par poussée sur tous modes avion.","Une vitesse commandée peut être impossible à tenir si la poussée est limitée."],"ex":"En montée, si l’avion atteint la poussée maximale et que le mode vertical demande trop de taux, la vitesse diminue : il faut gérer énergie, pas accuser automatiquement A/THR.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"022 10","t":"Systèmes de communication de bord","syllabus":"022 10 00 00","cours":[["VHF/HF/SATCOM","VHF est principal moyen voix en visibilité radio ; HF couvre grandes distances par propagation ionosphérique ; SATCOM utilise satellites. Le chapitre 090 traite de phraséologie ; ici l’objectif est l’architecture et la sélection des équipements."],["Audio management","Audio control panel sélectionne émetteur et récepteurs, volumes, ident, interphone et parfois PA. Une erreur de sélection peut donner impression de panne radio. Hot mic/interphone relient membres équipage."],["SELCAL","SELCAL permet à une station sol d’alerter un équipage sans écoute continue de la fréquence. Le code est lié à l’aéronef/opération selon système ; un test confirme la réception."],["Data link","ACARS/CPDLC transportent des messages numériques via VHF, HF ou satellite selon installation. CPDLC ne remplace pas automatiquement la voix dans toutes les phases ; les règles opérationnelles définissent quand et comment l’utiliser."],["Pannes","Une panne d’émetteur, de récepteur, d’audio panel ou de microphone produit des symptômes différents. Le dépannage pilote commence par fréquence, volume/squelch, sélection audio, autre radio et écoute d’une station connue."],["Audio control panel et priorités","Les systèmes de communication de bord organisent la sélection des radios, l’interphone, les alertes sonores et parfois les liaisons de données. Certaines annonces ont priorité sur d’autres canaux afin qu’un message critique ne soit pas masqué. Comprendre la logique de sélection audio évite de “perdre” une fréquence pourtant correctement réglée."]],"pts":["VHF, HF et SATCOM ont des modes de propagation/portée différents.","Audio panel peut être la cause d’une “panne radio” apparente.","SELCAL alerte l’équipage ; CPDLC échange des données ATC.","Radio réglée ne signifie pas nécessairement radio écoutée : la sélection audio compte aussi."],"f":[],"pieges":["Ne pas confondre panne radio avec mauvaise sélection audio.","CPDLC n’abolit pas les obligations voix lorsqu’elles s’appliquent."],"ex":"Impossible d’émettre sur VHF1 : avant conclure panne, vérifier micro, PTT, fréquence, audio panel puis essayer VHF2.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"022 11","t":"FMS / FMGS","syllabus":"022 11 00 00","cours":[["Rôle","Le FMS combine navigation, plan de vol et performance. Il utilise une base de données, des capteurs de position et des modèles avion/moteur pour prévoir temps, carburant et trajectoires latérale/verticale. Le FMGS ajoute explicitement guidance et interfaces de pilotage automatique selon constructeur."],["Base de données","La navigation database contient waypoints, routes, procédures, navaids et contraintes codées. Elle suit un cycle AIRAC ; les données doivent être valides pour la période d’utilisation. Une procédure publiée reste l’autorité : un codage incorrect doit être détecté par comparaison."],["Position FMS","Le FMS peut mélanger GNSS, IRS, DME/DME et VOR/DME. La précision estimée est comparée à une précision requise selon fonction ; la hiérarchie des capteurs varie. Une “position FMS” est donc une solution calculée, pas un capteur unique."],["Performance","Avec masse, vents, températures et modèle moteur, le FMS prédit trajectoire et carburant. Des entrées erronées (vent, masse, cost index, réserves) donnent des prédictions cohérentes mathématiquement mais fausses opérationnellement."],["Guidage","LNAV suit la trajectoire latérale ; VNAV calcule un profil vertical avec contraintes. Une discontinuity, vector leg ou modification doit être comprise avant exécution. Le pilote reste responsable de vérifier clairance, route et contraintes."],["LNAV, VNAV et base de données","Le FMS suit une logique de trajectoire latérale et verticale fondée sur une base de données navigation certifiée. L’intégrité de la base, le sens de la procédure et la cohérence des contraintes altitude/vitesse doivent être vérifiés par l’équipage. Le raw data reste un moyen précieux de confirmation."]],"pts":["FMS = navigation + performance + planification/guidage.","Navigation database doit être valide et comparée à la procédure publiée.","Position FMS peut être multi-capteurs.","Garbage in → garbage out : prédictions dépendent des entrées.","LNAV/VNAV n’autorisent pas à ignorer une clairance ATC.","Le FMS est puissant mais dépend de la qualité des données et des entrées équipage."],"f":[],"pieges":["Ne pas confondre précision calculée et intégrité disponible.","Une route dans le FMS n’est pas automatiquement la route ATC autorisée."],"ex":"Un vent croisière saisi trop optimiste donnera ETA et fuel-at-destination trop optimistes jusqu’à recalcul avec conditions réelles.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"022 12","t":"Alertes et systèmes de proximité","syllabus":"022 12 00 00","cours":[["Philosophie d’alerte","Warning = danger immédiat demandant action ; caution = situation anormale nécessitant attention/action ; advisory/status = information de priorité plus faible. Master warning/caution attire l’attention, puis l’équipage identifie le message système précis."],["Stall et overspeed","Stall warning doit être distinct et précéder le stall. Stick shaker avertit, pusher protège sur certains avions. Overspeed utilise VMO/MMO et alerte visuelle/sonore selon certification."],["Radio-altimètre","Mesure hauteur géométrique au-dessus du terrain par onde radio à basse altitude. Il alimente GPWS/TAWS, autoland, callouts et certaines protections. Il ne fournit pas altitude AMSL."],["GPWS/TAWS","GPWS classique analyse hauteur/taux/configuration ; TAWS/EGPWS ajoute base terrain et position pour prédire le conflit. Des modes alertent sink rate, terrain closure, altitude loss after take-off, configuration landing, glide slope, etc."],["ACAS/TCAS","Interroge/écoute transpondeurs environnants et calcule risque de conflit. TA = traffic advisory ; RA = resolution advisory. Les RA sont coordonnées entre appareils compatibles. La logique repose sur trajectoire relative, pas simple distance horizontale."],["Altitude alert","Compare altitude sélectionnée à altitude mesurée et avertit approche/écart selon logique avion. Cela réduit busts mais n’exonère pas surveillance."],["TAWS, TCAS et windshear","Les systèmes d’alerte ne poursuivent pas tous le même objectif : TAWS/EGPWS protège du relief, TCAS gère le risque de collision, et la détection windshear surveille l’environnement de vent dangereux. Une alerte TA est informative alors qu’une RA implique une réponse coordonnée selon les procédures. La hiérarchie des alertes fait partie de la connaissance ATPL de base."]],"pts":["Radio altimeter = hauteur terrain, pas altitude AMSL.","TAWS ajoute prédiction terrain/base de données au GPWS.","TA informe ; RA donne une manœuvre verticale.","Stall warning ≠ stall protection.","Alerting systems hiérarchisent les menaces.","TAWS, TCAS et windshear sont trois familles d’alertes différentes."],"f":[],"pieges":["Un TCAS traffic symbol n’est pas forcément une RA.","TAWS peut générer nuisance alerts si base/configuration/position sont inadéquates, mais une alerte doit être traitée selon procédure."],"ex":"Un RA “CLIMB” est basé sur séparation prévue et peut apparaître alors que l’autre avion semble visuellement éloigné ; la priorité est d’appliquer la procédure ACAS.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"022 13","t":"Affichages électroniques intégrés","syllabus":"022 13 00 00","cours":[["PFD","Le Primary Flight Display regroupe attitude, vitesse, altitude, vertical speed, cap/track et modes. Les tapes affichent tendances et bugs ; flags ou changements de couleur signalent données invalides. La densité d’information exige un scan structuré."],["ND","Navigation Display présente route, navaids, météo radar, trafic et terrain selon sélections. Modes ARC/ROSE/PLAN changent représentation ; heading-up et track-up ne doivent pas être confondus."],["EICAS / ECAM","EICAS/ECAM centralisent paramètres moteurs, systèmes et alertes. Selon philosophie, ils affichent checklists/actions ou synoptiques. Ils ne remplacent pas les procédures QRH/FCOM lorsqu’une action différée ou non affichée est requise."],["Sources et reconfiguration","Un même écran peut afficher plusieurs sources ; après panne écran ou générateur symbolique, reversionary mode transfère informations essentielles sur écran restant. Il faut distinguer panne display de panne source de données."],["Couleurs","Les couleurs suivent des conventions de priorité mais exact usage dépend constructeur : rouge/ambre sont critiques, magenta/vert/blanc/cyan servent souvent aux modes/targets. La signification doit être apprise par type."],["Modes dégradés et reversion","En cas de panne écran ou calculateur, les informations peuvent être regroupées sur un autre affichage. Le pilote doit savoir ce qui est perdu, ce qui est reconfiguré et quelle redondance subsiste. Un mode dégradé n’est sûr que si l’équipage comprend exactement ce qui reste disponible."]],"pts":["PFD = pilotage primaire ; ND = situation navigationnelle.","EICAS/ECAM = moteurs/systèmes/alertes.","Panne écran ≠ panne capteur.","FMA sur PFD est essentiel pour mode awareness.","Reversionary mode : un seul écran peut reprendre plusieurs fonctions après panne."],"f":[],"pieges":["Ne pas déduire une panne d’ADC d’un seul écran noir.","Heading-up et track-up changent la lecture du vent/dérive."],"ex":"Après panne d’un display unit, le système peut reconfigurer PFD/ND sur les écrans restants sans perte des capteurs eux-mêmes.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"022 14","t":"Maintenance, surveillance et enregistrement","syllabus":"022 14 00 00","cours":[["BITE","Built-In Test Equipment surveille équipements et mémorise faults. Il aide maintenance mais un message BITE n’est pas toujours affiché directement au pilote. Les tests au sol peuvent être automatiques ou initiés."],["Central maintenance","Un CMC/CFDS collecte messages de nombreux calculateurs, facilite isolation de panne et historique. Les codes doivent être interprétés avec documentation maintenance, pas utilisés comme unique justification opérationnelle."],["FDR","Flight Data Recorder enregistre paramètres réglementaires pour enquête
