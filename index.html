const MBSVG=`<svg viewBox="0 0 400 175" role="img" aria-label="Moments et centre de gravité"><defs><marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="var(--text)"/></marker></defs><g font-size="11" fill="var(--text)"><line x1="30" y1="95" x2="380" y2="95" stroke="var(--muted)" stroke-width="3"/><line x1="40" y1="30" x2="40" y2="150" stroke="var(--muted)" stroke-dasharray="4 3"/><text x="44" y="26">Datum</text><rect x="100" y="62" width="28" height="30" fill="#dc2626"/><text x="106" y="54">m1</text><rect x="290" y="62" width="28" height="30" fill="#ea580c"/><text x="296" y="54">m2</text><path d="M205 98L195 118L215 118Z" fill="#16a34a"/><text x="160" y="134">CG = ΣM / ΣW</text><line x1="40" y1="146" x2="114" y2="146" stroke="var(--text)" marker-end="url(#ar2)"/><text x="60" y="160">bras 1</text><line x1="40" y1="166" x2="304" y2="166" stroke="var(--text)" marker-end="url(#ar2)"/><text x="150" y="172">bras 2</text></g></svg>`;
const PERF=[{"id":"032 01","t":"Principes généraux de performance","syllabus":"032 01 00 00","cours":[["Forces et énergie","En vol stabilisé, performance dépend de l’équilibre poussée/traînée et portance/poids. Excès de poussée produit accélération ou pente de montée ; excès de puissance produit taux de montée. Les moteurs à réaction sont souvent analysés en poussée, les hélices en puissance."],["Vitesses caractéristiques","VS dépend de masse, densité, surface et CLmax ; VMCG/VMCA concernent contrôle avec moteur critique inopérant ; V1 est vitesse de décision calculée ; VR rotation ; V2 sécurité décollage ; VREF référence atterrissage. Le sens précis dépend du cadre de certification/opération."],["Variables influentes","Masse plus élevée augmente vitesses et distances ; altitude-pression/température élevées réduisent densité et performance ; vent de face réduit distance sol, arrière l’augmente ; pente montante pénalise décollage ; contamination augmente distances et peut modifier limites."],["Décollage et atterrissage","Declared distances : TORA, TODA, ASDA, LDA. La distance requise doit être comparée à la distance disponible avec les facteurs/règles de la classe de performance et l’état de piste. Screen height et obstacle clearance sont distincts du simple roulage."],["Montée","Gradient = gain d’altitude / distance horizontale ; taux = altitude/temps. Un fort vent de face augmente l’angle/gradient par rapport au sol pour un même taux mais ne crée pas de performance air supplémentaire."],["Croisière, range, endurance","Range = distance obtenue avec carburant ; endurance = temps. Pour jet, range/endurance optimaux dépendent de vitesse/altitude et SFC ; pour hélice, les vitesses associées à minimum drag et minimum power jouent des rôles différents."],["Données AFM","Les graphiques/tables utilisent conditions précises et corrections. Interpolation est permise seulement dans domaine/forme prévue ; extrapolation hors graphe est généralement invalide. Les valeurs de l’examen peuvent être données via extraits de manuel."],["Influence environnementale","Vent, pente, état de piste, température, altitude-pression et contamination modifient directement les distances et gradients de montée. Il faut savoir raisonner sur la performance disponible et requise, pas seulement lire un chiffre. Une piste plus longue ne compense pas toujours une dégradation sévère des autres facteurs."]],"pts":["Excès de poussée ↔ pente/accélération ; excès de puissance ↔ taux de montée.","Masse, densité, vent, pente et piste modifient performance.","Gradient et rate of climb sont différents.","TORA/TODA/ASDA/LDA sont des distances déclarées différentes.","Range ≠ endurance.","Température élevée, altitude-pression élevée et contamination dégradent généralement la performance."],"f":[["Stall","Vs = √(2W/(ρSCLmax))"],["Gradient","gradient ≈ Δh / distance horizontale"],["Specific range","SR = distance / fuel"]],"pieges":["Vent de face améliore distance sol mais pas la capacité aérodynamique intrinsèque.","Ne pas extrapoler un graphique AFM.","Ne pas confondre gradient % et angle en degrés."],"ex":"Un gradient de 3,3 % correspond environ à 200 ft/NM car 1 NM ≈ 6076 ft : 0,033×6076 ≈ 200 ft.","mod":"032 Performance","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 032","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — exigences de performance","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"032 02","t":"Classe B — monomoteur","syllabus":"032 02 00 00","cours":[["Domaine","Performance Class B concerne principalement avions plus légers selon Air OPS. Les données certifiées AFM sont ajustées par exigences opérationnelles : on ne transpose pas les facteurs d’un transport CS-25."],["Décollage","La distance de décollage est déterminée avec masse, altitude, température, vent, pente et état de piste. Les obstacles imposent un profil de montée ; avec un seul moteur, la panne moteur après décollage n’offre pas de trajectoire OEI garantie comparable à la classe A."],["Montée et croisière","Best rate / best angle et puissance disponible dépendent altitude et masse. Le plafond pratique/théorique apparaît quand excès de puissance devient faible/nul. Range/endurance suivent courbes de puissance et consommation moteur."],["Atterrissage","La distance requise est dérivée de données AFM et facteurs opérationnels applicables. Masse, vent, pente, surface, configuration et technique influencent la distance ; la conformité doit être vérifiée avant départ puis réévaluée lorsque requis."],["Monomoteur : logique risque","Une panne moteur transforme immédiatement l’avion en planeur : la performance pertinente devient finesse, vitesse de plané, hauteur disponible et choix de site. Cette différence explique pourquoi la classe B SE ne peut pas être raisonnée comme un jet multi-moteur."],["Décollage, montée et atterrissage en classe B monomoteur","Pour les avions monomoteurs de classe B, l’analyse performance reste globale mais doit intégrer masses, obstacles, vent et surface. L’atterrissage et le décollage sont traités avec des marges réglementaires spécifiques. Le pilote doit identifier si la performance est simplement “possible” ou légalement acceptable."]],"pts":["Classe B SE : pas de performance OEI soutenue garantie comme classe A.","Facteurs opérationnels doivent venir du cadre applicable, pas d’une mémoire générique.","Altitude-densité élevée pénalise décollage et montée.","Après panne moteur, finesse et hauteur deviennent centrales.","Performance calculée et conformité réglementaire ne sont pas toujours synonymes."],"f":[],"pieges":["Ne pas utiliser V1/V2 de classe A sur un SE classe B.","Distance AFM brute et distance opérationnelle requise peuvent différer."],"ex":"Une température élevée peut rendre la montée après décollage insuffisante malgré une piste assez longue : longueur de piste et obstacle clearance sont deux vérifications distinctes.","mod":"032 Performance","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 032","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — exigences de performance","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"032 03","t":"Classe B — multimoteur","syllabus":"032 03 00 00","cours":[["Spécificité multi-moteur","Avec deux moteurs, une panne moteur crée perte de poussée et asymétrie. La performance OEI dépend masse, altitude, température, configuration, moteur critique et vitesse ; elle peut être faible ou négative sur certains avions légers."],["Vitesses OEI","VMCA est vitesse minimale de contrôle en air dans conditions définies, pas une vitesse de meilleure montée. VYSE est vitesse de meilleur taux de montée monomoteur pour certains avions légers. Une vitesse trop basse peut rendre le contrôle directionnel impossible avant même que la portance soit insuffisante."],["Décollage","Les exigences classe B ME ne sont pas celles d’une classe A équilibrée. Selon avion et masse, la panne moteur peut exiger poursuivre ou interrompre selon vitesse/conditions mais les concepts accelerate-stop/go certifiés ne se transposent pas automatiquement."],["Montée OEI","Train, volets, hélice moulinante et moteur critique ont effet majeur. Mise en drapeau réduit fortement traînée d’une hélice arrêtée. Le gradient net/obstacle doit être lu dans les données applicables."],["Atterrissage","Approche et remise de gaz OEI peuvent être limitantes. La masse d’atterrissage doit permettre la performance requise et le contrôle de l’asymétrie."],["Considérations multimoteurs classe B","Sur bimoteur léger, la panne moteur après décollage reste un point critique même hors logique transport catégorie A. Il faut comprendre accélération, pente réelle, masse et trajectoire de dégagement. Le comportement OEI n’est jamais résumé par une seule vitesse."]],"pts":["VMCA = contrôle, VYSE = performance de montée : ne pas confondre.","Hélice non feathered augmente énormément la traînée OEI.","Performance OEI peut être négative sur avion léger chaud/haut/lourd.","Classe B ME ≠ classe A.","La performance OEI sur bimoteur léger doit être replacée dans le contexte masse/altitude/obstacles."],"f":[],"pieges":["Plus vite n’est pas toujours mieux : traînée et vitesse optimale OEI comptent.","VMCA n’est pas fixe indépendamment configuration/puissance/altitude."],"ex":"Après panne d’un moteur, train rentré + hélice feathered + vitesse proche VYSE maximisent généralement la chance de montée ; un train sorti peut supprimer tout gradient positif.","mod":"032 Performance","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 032","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — exigences de performance","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"032 04","t":"Classe A — avions de transport","syllabus":"032 04 00 00","cours":[["Cadre classe A","Classe A concerne notamment avions multi-moteurs à turbine relevant des critères Air OPS. La conception CS-25 et les règles opérationnelles utilisent V1, VR, V2, distances accelerate-stop/accelerate-go et trajectoire net take-off pour garantir marges avec panne moteur critique."],["V1, VR, V2","V1 est vitesse de décision déterminée dans calcul : avant, un rejet peut être initié dans ASDA ; après, le décollage doit normalement être poursuivi dans hypothèses réglementaires. VR permet rotation compatible avec V2 et geometry; V2 assure marge de stall/contrôle et performance OEI."],["Balanced field","Balanced field est le cas où exigences accelerate-stop et accelerate-go sont égales pour une masse/condition ; ce n’est pas obligatoire sur chaque piste. Stopway aide ASDA ; clearway aide TODA mais pas TORA/ASDA."],["Segments de décollage","Après lift-off OEI : 1er segment jusqu’à train rentré ; 2e segment avec configuration initiale jusqu’à hauteur réglementaire, généralement critique ; accélération/clean-up ; segment final jusqu’à configuration en route. Les exigences utilisent trajectoire brute puis marge pour net flight path."],["Obstacle clearance","Le net take-off flight path est comparé aux obstacles dans un corridor défini. Virages, vent et navigation modifient domaine/gradient requis ; un obstacle éloigné peut être plus limitant qu’un obstacle proche."],["En route OEI / drift-down","Après panne moteur en croisière, l’avion peut descendre jusqu’à altitude où poussée OEI équilibre traînée. Drift-down profile doit assurer franchissement terrain/obstacles et possibilité d’atteindre aérodrome approprié."],["Atterrissage","Landing distance required inclut facteurs réglementaires et conditions piste. Le landing climb / approach climb peuvent devenir limitants à masse élevée ou température élevée. Dispatch calculation et in-flight landing performance ne sont pas toujours identiques."],["ASD, TODA, OEI et drift-down","En performance transport, il faut distinguer accelerate-stop distance, distance de décollage, trajectoire nette de montée et performances en route avec un moteur inopérant. Le drift-down décrit la descente ou le palier optimisé après panne moteur à haute altitude afin de rejoindre une altitude soutenable. Les facteurs d’atterrissage, d’obstacle et de piste contaminée complètent l’analyse."]],"pts":["V1 = décision calculée ; VR = rotation ; V2 = sécurité décollage.","Stopway augmente ASDA ; clearway augmente TODA.","Net flight path = gross performance diminuée d’une marge réglementaire.","Second segment est souvent déterminant OEI.","Drift-down assure terrain clearance après panne moteur.","Balanced field, net flight path et drift-down sont des notions clés de la classe A."],"f":[],"pieges":["Balanced field n’est pas synonyme de piste “standard”.","Ne pas confondre clearway et stopway.","Une limitation peut être obstacle, brake energy, tyre speed, climb ou runway — pas seulement longueur de piste."],"ex":"Si accelerate-stop limite à 72 t et obstacle climb limite à 69 t, la masse réglementée est au plus 69 t avant autres limites structurelles/opérationnelles.","mod":"032 Performance","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 032","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — exigences de performance","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true}];
PERF.forEach(c=>c.mod="032 Performance");

const LAW010=[{"id":"010 01","t":"Droit international : conventions, accords et organisations","syllabus":"010 01 00 00","cours":[["010 01 01 — Convention de Chicago : pourquoi elle existe","La Convention relative à l’aviation civile internationale, signée à Chicago le 7 décembre 1944, fournit le cadre juridique mondial de l’aviation civile internationale. Pour l’ATPL, l’idée centrale n’est pas d’apprendre 96 articles par cœur : il faut comprendre que la Convention organise les rapports entre États, fixe des principes communs et permet l’adoption de Standards and Recommended Practices (SARPs) par l’OACI."],["Souveraineté et territoire","Chaque État possède une souveraineté complète et exclusive sur l’espace aérien au-dessus de son territoire. Cela explique pourquoi un vol international doit respecter les règles applicables dans l’espace traversé et pourquoi les services internationaux réguliers nécessitent les droits et autorisations appropriés. Au-dessus de la haute mer, les règles pertinentes de l’Annexe 2 s’appliquent sans exception dans le cadre européen SERA."],["Aéronefs civils et aéronefs d’État","La Convention de Chicago s’applique aux aéronefs civils. Les aéronefs utilisés dans des services militaires, douaniers ou de police sont des aéronefs d’État au sens de la Convention. Cette distinction est importante : les obligations et procédures applicables à un avion de ligne ne sont pas automatiquement celles d’un aéronef d’État."],["Nationalité, certificats et licences","La Convention met en place une logique de reconnaissance internationale : l’aéronef possède la nationalité de l’État où il est immatriculé, et les certificats et licences délivrés ou validés conformément aux standards internationaux sont destinés à être reconnus par les autres États contractants, sous réserve des conditions prévues par la Convention."],["SARPs, Annexes et différences","Un Standard ICAO correspond à une spécification dont l’application uniforme est jugée nécessaire pour la sécurité ou la régularité de la navigation internationale. Une Recommended Practice est une spécification dont l’application uniforme est jugée souhaitable. Lorsqu’un État ne peut se conformer à un Standard international, le mécanisme ICAO prévoit la notification des différences. Pour un pilote, cela signifie qu’une règle ICAO générale doit toujours être reliée à sa mise en œuvre européenne et aux publications opérationnelles applicables."],["Organisation de l’OACI","L’OACI est une agence spécialisée des Nations unies. L’Assemblée réunit les États contractants ; le Conseil est l’organe permanent ; des commissions et comités techniques contribuent à l’élaboration des standards. Les bureaux régionaux facilitent l’application coordonnée des plans et procédures de navigation aérienne dans les différentes régions ICAO."],["Publications : Annexes, PANS et Documents","Les Annexes contiennent les SARPs. Les PANS (Procedures for Air Navigation Services), comme le Doc 4444 pour l’ATM ou le Doc 8168 pour les procédures de vol, détaillent des procédures qui ne possèdent pas exactement le même statut juridique que les SARPs. D’autres Documents ICAO fournissent des manuels, critères ou éléments d’interprétation. À l’examen, savoir identifier la nature du document est souvent plus utile que retenir un numéro isolé."],["Cadre européen : UE, EASA, EUROCONTROL, ECAC","Dans l’Union européenne, les règlements de l’UE sont juridiquement applicables dans le cadre défini par le droit de l’Union. EASA prépare et administre une grande partie du cadre technique de sécurité, publie des AMC/GM et réalise des tâches de certification et de standardisation. EUROCONTROL a un rôle majeur dans l’ATM et la gestion du réseau européen. ECAC est une organisation intergouvernementale de coopération en aviation civile. Ces organismes ont des fonctions différentes et ne doivent pas être confondus."],["Architecture réglementaire EASA","Pour raisonner correctement, sépare : règlement de base et règlements d’exécution/délégués ; Certification Specifications (CS) qui décrivent des moyens techniques de conformité pour la certification ; Acceptable Means of Compliance (AMC) qui sont des moyens non exclusifs de démontrer la conformité ; Guidance Material (GM) qui aide à comprendre et appliquer les règles. Un AMC n’est pas une loi supplémentaire : c’est un moyen acceptable de conformité."],["Single European Sky et coopération ATM","Le Single European Sky vise notamment à améliorer la performance, l’interopérabilité et la coordination du système ATM européen. Pour l’ATPL, il faut surtout comprendre la répartition des rôles entre législation UE, EASA, prestataires de services et organismes de réseau plutôt que mémoriser l’historique institutionnel dans ses moindres détails."]],"pts":["Chicago 1944 = socle du système mondial de l’aviation civile","Souveraineté complète et exclusive de l’État sur son espace aérien","Annexes = SARPs ; PANS = procédures de navigation aérienne","Différences aux Standards ICAO peuvent être notifiées","EASA ≠ ICAO ≠ EUROCONTROL ≠ ECAC","Le droit national n’est pas la base de l’examen théorique EASA 010"],"f":[["SARP","Standard and Recommended Practice."],["AMC","Acceptable Means of Compliance."],["GM","Guidance Material."]],"pieges":["Ne pas confondre Standard ICAO et règlement UE directement applicable.","Ne pas attribuer à EASA le rôle mondial de l’OACI.","AMC = moyen acceptable de conformité, pas une obligation unique lorsqu’une autre démonstration de conformité est admise."],"ex":"Un vol commercial traverse trois États. La Convention de Chicago fournit le cadre international, mais l’équipage applique les règles européennes et les procédures publiées pour chaque espace traversé.","mod":"010 Air Law","refs":[{"label":"Syllabus EASA 2020 — Subject 010 Air Law, ED Decision 2020/018/R","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Easy Access Rules for SERA — révision août 2025","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-standardised-european-rules-air"},{"label":"EASA Easy Access Rules for Aircrew — révision novembre 2025","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"verified":"2026-09-28","weight":2},{"id":"010 02","t":"Navigabilité, nationalité et immatriculation","syllabus":"010 02 00 00","cours":[["010 02 01 — Navigabilité : logique générale","La navigabilité relie la conception approuvée d’un type d’aéronef à l’état de l’aéronef individuel. Il faut distinguer la navigabilité initiale — conception et production conformes à des exigences de certification — de la navigabilité continue, qui maintient l’aéronef dans un état conforme et sûr pendant son exploitation."],["Annexe 8 et exigences européennes","L’Annexe 8 de l’OACI fixe le cadre international de navigabilité. Dans l’UE, la navigabilité initiale relève notamment du règlement (UE) n° 748/2012 et de ses annexes, tandis que la navigabilité continue relève notamment du règlement (UE) n° 1321/2014. Le syllabus demande de comprendre la relation entre standards ICAO et exigences/certification européennes, pas d’apprendre les processus industriels détaillés d’un organisme de conception."],["Certificat de navigabilité","Le Certificate of Airworthiness (CofA) concerne l’aéronef individuel et atteste qu’il satisfait aux exigences applicables de navigabilité. Il ne doit pas être confondu avec un certificat de type, qui concerne la conception d’un type d’aéronef, ni avec le certificat d’immatriculation, qui concerne son identité juridique."],["Maintien de navigabilité","La navigabilité n’est pas acquise une fois pour toutes. Maintenance, inspections, données approuvées, consignes de navigabilité, gestion des défauts et enregistrements contribuent à la maintenir. Un dommage ou une modification doit être évalué conformément aux données approuvées ; un simple jugement opérationnel de l’équipage ne remplace pas le processus de navigabilité."],["010 02 03 — Annexe 7 : nationalité","Un aéronef ne peut être valablement immatriculé dans plusieurs États en même temps. Il possède la nationalité de l’État sur le registre duquel il est inscrit. L’État de registre n’est pas forcément l’État de l’exploitant : les deux notions doivent rester séparées dans les questions ATPL."],["Certificat d’immatriculation","Le certificat d’immatriculation identifie notamment l’État de registre et l’aéronef. Il s’agit d’un document d’identité juridique de l’aéronef. Il n’atteste ni de sa navigabilité technique ni de l’autorisation commerciale de l’exploitant."],["Marques de nationalité et d’immatriculation","Les marques doivent être attribuées conformément aux règles applicables et placées de manière lisible sur l’aéronef. La marque de nationalité identifie l’État, la marque d’immatriculation identifie l’aéronef au sein du système d’immatriculation. Les règles d’emplacement diffèrent selon la catégorie d’aéronef ; à l’examen, l’objectif est surtout de connaître le principe et l’autorité qui attribue les marques."],["Ce que le pilote doit réellement vérifier","Le pilote de ligne ne réalise pas la certification de l’aéronef. Avant le vol, il travaille dans un système d’exploitation où l’état technique, la remise en service, les défauts différés et les documents de bord doivent être conformes. Air Law demande de comprendre la chaîne de responsabilités et la signification juridique des documents."]],"pts":["Type certificate ≠ CofA ≠ certificat d’immatriculation","Navigabilité initiale et navigabilité continue sont deux étapes différentes","L’aéronef a la nationalité de son État de registre","État de registre et État de l’exploitant peuvent être différents","Un aéronef ne peut pas avoir simultanément plusieurs immatriculations valides"],"f":[],"pieges":["Ne pas assimiler certificat d’immatriculation et certificat de navigabilité.","Ne pas considérer une réparation techniquement possible comme automatiquement approuvée.","Attention aux questions qui mélangent État de registre, État de conception et État de l’exploitant."],"ex":"Une compagnie exploite un avion immatriculé dans un autre État membre. L’immatriculation détermine l’État de registre ; l’exploitation commerciale dépend du cadre de l’exploitant ; la navigabilité reste un sujet distinct.","mod":"010 Air Law","refs":[{"label":"Syllabus EASA 2020 — Subject 010 Air Law, ED Decision 2020/018/R","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Initial Airworthiness — révision novembre 2025","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-initial-airworthiness-and-environmental"},{"label":"EASA Continuing Airworthiness — révision septembre 2025","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-continuing-airworthiness"}],"verified":"2026-09-28","weight":1},{"id":"010 04","t":"Licences du personnel navigant","syllabus":"010 04 00 00","cours":[["010 04 01 — Annexe 1 et Part-FCL","L’Annexe 1 de l’OACI établit les standards internationaux relatifs aux licences du personnel. Dans l’UE, le règlement (UE) n° 1178/2011 et en particulier Part-FCL définissent les licences, qualifications, certificats, privilèges et conditions applicables aux pilotes civils. L’examen demande de savoir relier le cadre ICAO au cadre européen."],["Licence, rating, certificate","Une licence donne un ensemble de privilèges de base ; une qualification (rating) ajoute ou précise des privilèges, par exemple classe, type ou vol aux instruments ; certains privilèges reposent aussi sur des certificats ou endorsements. La possibilité d’exercer dépend toujours de la validité des éléments pertinents : licence, qualification, expérience récente, médical et, le cas échéant, compétence linguistique."],["PPL, CPL et ATPL","Le PPL est une licence de pilote privé. Le CPL permet l’exercice de privilèges professionnels dans le cadre défini par Part-FCL. L’ATPL constitue le niveau de licence permettant notamment d’exercer les privilèges de commandant de bord en transport aérien commercial sur les aéronefs multi-pilotes correspondants, sous réserve des autres conditions applicables. Une licence seule ne remplace jamais une qualification de classe/type ou un médical valide."],["Skill test, proficiency check, assessment","Un skill test est associé à la délivrance de certaines licences ou qualifications ; un proficiency check sert principalement à démontrer la compétence pour revalider ou renouveler une qualification ; une assessment of competence est utilisée pour certains certificats ou privilèges spécifiques. Les termes ont un sens réglementaire précis."],["Revalidation et renouvellement","Revalidation = prolongation d’une qualification encore valide lorsque les conditions sont remplies. Renewal = rétablissement d’une qualification expirée après réalisation des exigences applicables. Le piège classique consiste à employer renewal pour une qualification qui n’a pas encore expiré."],["Médical et aptitude","L’exercice des privilèges d’une licence professionnelle nécessite le certificat médical approprié. La durée de validité, les limitations et les obligations en cas de diminution de l’aptitude relèvent de Part-MED. Pour Air Law, il faut surtout comprendre qu’un pilote ne peut pas exercer ses privilèges lorsqu’il sait ou suspecte qu’une diminution de son aptitude compromet la sécurité."],["Compétence linguistique","Les pilotes utilisant la radiotéléphonie doivent détenir l’endorsement de compétence linguistique requis. Part-FCL prévoit notamment les niveaux ICAO 4, 5 et 6 ; les niveaux 4 et 5 doivent être réévalués selon les intervalles réglementaires, contrairement au niveau 6. Pour les titulaires d’un IR, la capacité à utiliser l’anglais au niveau approprié fait partie des exigences spécifiques."],["Expérience récente et validité pratique","Une qualification valide ne suffit pas toujours : l’exercice d’un privilège peut dépendre d’exigences d’expérience récente, de formation ou de contrôle. Dans une question ATPL, sépare toujours validité administrative et aptitude opérationnelle immédiate."],["Règle de raisonnement","Pour toute question de licence, pose quatre questions : quelle licence ? quelle qualification ? quel médical ? quelles conditions de récence/compétence ? Cette méthode évite la plupart des confusions entre “détenir” un titre et “pouvoir exercer” un privilège à un instant donné."]],"pts":["Part-FCL = cadre UE principal des licences pilotes","Licence, rating, médical et récence sont des couches différentes","Revalidation = avant expiration ; renewal = après expiration","Skill test ≠ proficiency check","Compétence linguistique : niveau 4 opérationnel, 5 étendu, 6 expert"],"f":[],"pieges":["Ne pas conclure qu’un pilote peut exercer un privilège uniquement parce que sa licence existe.","Ne pas confondre durée de validité d’un médical et durée de validité d’une qualification.","Toujours vérifier si la question parle de délivrance, revalidation ou renouvellement."],"ex":"Un pilote possède un CPL valide mais sa qualification de type a expiré : la licence existe toujours, mais le privilège associé à ce type ne peut pas être exercé avant renouvellement conforme.","mod":"010 Air Law","refs":[{"label":"Syllabus EASA 2020 — Subject 010 Air Law, ED Decision 2020/018/R","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Easy Access Rules for Aircrew — révision novembre 2025","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"verified":"2026-09-28","weight":1},{"id":"010 05","t":"Règles de l’air : SERA et principes de conduite","syllabus":"010 05 00 00","cours":[["010 05 01 — Champ d’application de SERA","SERA (Standardised European Rules of the Air) harmonise les règles de l’air dans l’Union. Le règlement (UE) n° 923/2012 s’applique aux aéronefs, aux autorités compétentes, aux prestataires ANS, aux exploitants d’aérodromes et au personnel au sol concerné dans le champ défini. Pour les vols au-dessus de la haute mer, les règles de l’Annexe 2 de Chicago s’appliquent sans exception ; SERA organise leur continuité dans l’environnement européen."],["Responsabilité et autorité du PIC","Le pilote commandant de bord est responsable de l’exploitation de l’aéronef conformément aux règles de l’air, qu’il manipule ou non les commandes. Il peut déroger aux règles lorsqu’une telle dérogation est absolument nécessaire pour des raisons de sécurité. Cette faculté d’urgence ne doit pas être confondue avec un pouvoir général de choisir quelles règles appliquer."],["Préparation du vol et conduite prudente","Avant le vol, le PIC doit prendre connaissance de toutes les informations disponibles appropriées au vol prévu. Les règles interdisent la conduite négligente ou imprudente mettant en danger la vie ou les biens. L’alcool, les substances psychoactives et l’aptitude du pilote sont également encadrés."],["Hauteurs minimales","Sauf pour décollage/atterrissage ou autorisation appropriée, un VFR au-dessus d’une zone densément peuplée ou d’un rassemblement en plein air ne doit pas voler à moins de 1 000 ft au-dessus de l’obstacle le plus élevé dans un rayon de 600 m. Ailleurs, la limite générale est 500 ft au-dessus du sol ou de l’eau, ou 500 ft au-dessus de l’obstacle le plus élevé dans un rayon de 500 ft. Les règles IFR utilisent une logique différente fondée sur les altitudes minimales et le franchissement d’obstacles."],["Priorités de passage","Quand deux aéronefs convergent approximativement au même niveau, celui qui voit l’autre à sa droite lui cède le passage, sous réserve des priorités entre catégories d’aéronefs. En approche frontale, chacun modifie son cap vers la droite. Un aéronef qui dépasse contourne l’autre par la droite. L’aéronef en phase finale d’atterrissage ou le plus bas bénéficie de règles de priorité spécifiques, sans pouvoir utiliser cette priorité pour couper devant un autre aéronef déjà engagé."],["Feux de l’aéronef","Les feux anticollision et feux de navigation sont utilisés selon les conditions définies par SERA. Les feux de navigation indiquent la trajectoire relative de l’aéronef à un observateur. Une question ATPL peut porter sur la logique des couleurs et sur l’obligation d’utiliser les feux appropriés de nuit ou selon les circonstances."],["Plan de vol ATS","Un plan de vol doit être soumis dans les cas prévus par SERA, notamment pour certains vols contrôlés, certains vols traversant des frontières ou zones/routes désignées, et certains vols de nuit quittant la proximité d’un aérodrome. Le plan de vol contient les informations nécessaires à l’ATS ; les modifications significatives doivent être transmises et la clôture du plan de vol est une étape opérationnelle importante lorsqu’elle est requise."],["VMC : tableau de référence","À et au-dessus de 10 000 ft AMSL, la visibilité de vol standard est de 8 km avec 1 500 m horizontalement et 1 000 ft verticalement par rapport aux nuages. En dessous de 10 000 ft, la visibilité standard est de 5 km. À bas niveau en classes F et G — à et sous 3 000 ft AMSL ou 1 000 ft au-dessus du terrain, la valeur la plus élevée étant retenue — le vol peut être effectué hors nuages et avec la surface en vue, sous réserve des règles de visibilité applicables. En classes B à E, les distances aux nuages standard restent applicables."],["VFR et VFR de nuit","Un vol VFR doit respecter les minima VMC applicables. Sans clairance ATC, un VFR ne doit pas décoller/atterrir dans une CTR ni entrer dans le circuit si le plafond est inférieur à 1 500 ft ou la visibilité sol inférieure à 5 km. Les vols VFR de nuit sont possibles dans les conditions prévues par SERA : plan de vol lorsqu’on quitte la proximité d’un aérodrome, communication bilatérale lorsqu’elle est disponible, minima VMC adaptés et respect des hauteurs minimales spécifiques."],["Special VFR","Le SVFR permet à un vol VFR d’opérer dans une CTR dans des conditions météorologiques inférieures aux VMC normales, uniquement avec une clairance ATC et dans les conditions SERA applicables. SVFR ne signifie pas “VFR sans minima” et ne supprime ni les responsabilités du pilote ni les conditions de visibilité/nuages requises."],["IFR : principes essentiels","Un vol IFR suit les règles de vol aux instruments quelle que soit la météo. En espace contrôlé, une clairance ATC est requise. Les niveaux de croisière, altitudes minimales, communications et comptes rendus dépendent de la route et de l’espace. Le passage de VFR à IFR ou l’annulation IFR doit être communiqué selon les procédures applicables."],["Signaux et interception","SERA comprend des signaux visuels, lumineux et de circulation au sol ainsi que des procédures d’interception. Un aéronef intercepté doit suivre les procédures et signaux prescrits, tenter d’établir les communications appropriées et conserver la priorité absolue de la sécurité du vol."],["Carburant : MINIMUM FUEL et MAYDAY FUEL","La déclaration MINIMUM FUEL informe l’ATC que toutes les options d’aérodromes planifiées ont été réduites à un aérodrome spécifique et qu’un changement de clairance pourrait conduire à l’atterrissage avec moins que la réserve finale planifiée ; ce n’est pas encore une situation d’urgence. Une urgence carburant est déclarée avec MAYDAY FUEL lorsque le carburant utilisable prévu à l’atterrissage est inférieur à la réserve finale planifiée applicable."]],"pts":["PIC responsable du respect des règles de l’air ; dérogation seulement si absolument nécessaire pour la sécurité","Priorité frontale : chacun à droite ; dépassement : par la droite","VMC ≥10 000 ft : 8 km ; <10 000 ft : 5 km, sauf dispositions de bas niveau applicables","Séparation nuages standard : 1 500 m horizontal / 1 000 ft vertical","VFR CTR sans clairance spéciale : plafond ≥1 500 ft et visibilité sol ≥5 km","MINIMUM FUEL n’est pas une déclaration d’urgence","Classe A : VFR normalement non autorisé"],"f":[["VMC","Conditions météorologiques de vol à vue."],["SVFR","Vol VFR spécial autorisé par ATC dans une CTR sous conditions."],["PIC","Pilot-in-command."]],"pieges":["Ne pas appliquer les minima bas niveau F/G aux classes B-E.","Ne pas confondre “clear of cloud and surface in sight” avec une autorisation générale de voler avec n’importe quelle visibilité.","La priorité de passage ne décharge jamais le pilote de l’obligation d’éviter une collision.","MINIMUM FUEL ≠ MAYDAY FUEL."],"ex":"Tu arrives en VFR vers une CTR avec 4 km de visibilité sol. Les minima d’entrée VFR standard ne sont pas satisfaits : une clairance SVFR peut être envisagée si les conditions et l’ATC le permettent ; sinon il faut changer de plan.","mod":"010 Air Law","refs":[{"label":"Syllabus EASA 2020 — Subject 010 Air Law, ED Decision 2020/018/R","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Easy Access Rules for SERA — révision août 2025","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-standardised-european-rules-air"}],"verified":"2026-09-28","weight":9},{"id":"010 06","t":"PANS‑OPS : départs, approches, attente et procédures IFR","syllabus":"010 06 00 00","cours":[["010 06 01 — Rôle des PANS‑OPS","Les PANS‑OPS (ICAO Doc 8168) décrivent des critères et procédures normalisés pour les départs, arrivées, approches, attentes et autres opérations IFR. Pour le pilote, l’objectif n’est pas de recalculer la conception d’une procédure, mais de comprendre la logique de protection, les segments, les altitudes/hauteurs publiées et les actions à effectuer."],["Calage altimétrique","Sous l’altitude de transition, la position verticale est exprimée en altitude avec le QNH approprié ; au-dessus du niveau de transition, elle est exprimée en flight levels avec le calage standard 1013,25 hPa. La couche de transition sépare altitude de transition et niveau de transition. QFE indique une hauteur par rapport au datum QFE, mais n’est pas le référentiel normal de navigation en route."],["Procédures de départ","Un départ IFR doit assurer le franchissement des obstacles tout en rejoignant la structure ATS. Une SID peut imposer trajectoires, altitudes, contraintes de vitesse et moyens de navigation. Le pilote doit distinguer une clairance de route de l’autorisation de décollage et vérifier qu’il peut respecter les contraintes publiées avant d’accepter la clairance."],["Départ omnidirectionnel et gradient","Quand aucune SID spécifique n’est utilisée, des critères de départ omnidirectionnel peuvent être publiés. Les gradients de montée de procédure sont des exigences de franchissement d’obstacles et ne doivent pas être confondus avec les gradients de performance réglementaires de l’avion. Un gradient de 3,3 % correspond à environ 200 ft/NM ; toute exigence supérieure doit être identifiée dans la procédure."],["Structure d’une approche instrumentale","Une procédure comprend typiquement des segments initial, intermédiaire, final et d’approche interrompue. Chaque segment possède une fonction : organiser l’arrivée, stabiliser la trajectoire et assurer la protection obstacles. L’IAF, IF, FAF/FAP et MAPt ne sont pas interchangeables."],["Approches de précision et 2D/3D","Une approche 3D fournit un guidage latéral et vertical conforme aux critères applicables ; une approche 2D fournit principalement un guidage latéral et utilise une altitude/hauteur minimale de descente. La terminologie opérationnelle moderne distingue notamment DA/H pour les opérations avec décision à une altitude/hauteur et MDA/H pour certaines approches 2D."],["Approche interrompue","Si les critères de poursuite ne sont pas satisfaits au point/altitude de décision approprié, ou si la sécurité l’exige, l’équipage exécute la missed approach publiée ou celle donnée par ATC. Le segment d’approche interrompue débute à un point défini et son profil de montée suppose le respect des critères publiés."],["Circling","Le circling est une manœuvre visuelle effectuée après une approche instrumentale afin d’atterrir sur une piste dont l’axe n’est pas celui de l’approche. La protection dépend notamment de la catégorie de l’aéronef et de la procédure. Perdre les références visuelles pendant la manœuvre impose de suivre la procédure d’approche interrompue appropriée."],["Holding : géométrie et entrée","Un circuit d’attente standard est basé sur des virages à droite sauf indication contraire. Les entrées direct, parallèle et décalée/teardrop sont des méthodes d’intégration utilisées selon le secteur d’arrivée. L’objectif de l’examen est de déterminer l’entrée correcte, le sens des virages, les temps/distance de branche et les corrections au vent."],["Holding : vitesse et temps","Les vitesses maximales d’attente et les temps de branche dépendent de l’altitude et du document applicable. Les valeurs sont publiées dans les procédures et PANS‑OPS ; une consigne ATC ou une limitation publiée peut imposer une valeur plus restrictive. En pratique et à l’examen, la priorité est de respecter la valeur publiée applicable à la procédure donnée."],["Approches parallèles","Les opérations sur pistes parallèles ou quasi parallèles peuvent être indépendantes ou dépendantes selon la configuration et les procédures. Elles reposent sur des critères spécifiques de surveillance, de séparation et de zones de protection ; l’équipage doit suivre strictement l’alignement, les clairances et toute instruction d’évitement."],["SSR et transpondeur","Un transpondeur en état de fonctionnement est exploité selon SERA et les instructions ATC. Les codes d’urgence classiques sont 7700 pour une urgence générale, 7600 pour une panne de communications et 7500 pour une intervention illicite. IDENT n’est utilisé que lorsqu’il est demandé par ATC ou dans les cas prévus. Mode C fournit l’information d’altitude-pression lorsque disponible."],["Panne transpondeur","Une panne en vol doit être signalée à l’ATS dès que possible et gérée conformément aux instructions et procédures. Avant départ, un transpondeur inopérant peut entraîner une restriction ou une coordination préalable ; il ne faut pas supposer qu’un vol IFR en espace contrôlé pourra simplement partir sans transpondeur."]],"pts":["Altitude de transition : QNH ; niveau de transition : au-dessus, 1013,25 hPa","SID = procédure publiée ; clearance ≠ autorisation de décollage","Segment final, MAPt/DA/H et missed approach doivent être distingués","Holding standard : virages à droite sauf publication contraire","SSR : 7500 unlawful interference, 7600 COM failure, 7700 emergency","Gradient procédure ≠ performance avion"],"f":[],"pieges":["Ne pas utiliser QFE comme si c’était un flight level.","Ne pas confondre FAF, FAP et MAPt.","Un virage d’attente à gauche n’est pas “non standard” si la procédure le publie ainsi : il devient la procédure à suivre.","Les codes 7500/7600/7700 doivent être connus sans hésitation."],"ex":"Sur une SID, l’ATC te donne une clairance de route mais pas encore de clearance take-off. Tu peux préparer et lire la SID, mais tu ne dois pas commencer le décollage : les deux autorisations sont distinctes.","mod":"010 Air Law","refs":[{"label":"Syllabus EASA 2020 — Subject 010 Air Law, ED Decision 2020/018/R","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Easy Access Rules for SERA — révision août 2025","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-standardised-european-rules-air"},{"label":"EASA Easy Access Rules ATM/ANS — révision mars 2025","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-traffic-managementair-navigation-services-provision-services"}],"verified":"2026-09-28","weight":10},{"id":"010 07","t":"Services de la circulation aérienne et gestion du trafic","syllabus":"010 07 00 00","cours":[["010 07 01 — Objectifs des ATS","Les ATS ont notamment pour objectifs de prévenir les collisions entre aéronefs et, sur l’aire de manœuvre, entre aéronefs et obstacles ; d’accélérer et maintenir un écoulement ordonné du trafic ; de fournir conseils et informations utiles ; et d’alerter les organismes appropriés lorsqu’un aéronef a besoin de recherche et sauvetage."],["Les quatre services à distinguer","ATC = service de contrôle ; FIS = information de vol ; alerting service = service d’alerte ; air traffic advisory service est une notion ICAO historique/particulière selon l’environnement. ATC délivre des clairances et assure la séparation prescrite ; FIS informe mais n’est pas un service de séparation générale."],["Unités ATS","ACC fournit le contrôle régional dans les control areas ; APP gère les vols contrôlés à l’arrivée et au départ d’un ou plusieurs aérodromes ; TWR fournit le contrôle d’aérodrome. FIC fournit le service d’information de vol dans une FIR lorsque cette fonction n’est pas assurée par une unité ATC compétente."],["Classification des espaces A à G","Les classes d’espace déterminent quels vols IFR/VFR sont admis, quels services sont fournis et quelles exigences de clairance/communication s’appliquent. Classe A : IFR uniquement. Classes B, C, D, E comportent des niveaux décroissants ou différents de contrôle selon IFR/VFR ; F et G sont non contrôlées au sens ATC général. Pour répondre correctement, il faut raisonner service par service plutôt que mémoriser “contrôlé/non contrôlé” seulement."],["Clairance ATC","Une ATC clearance autorise un aéronef à poursuivre selon des conditions spécifiées. Le pilote doit lire/restituer les éléments critiques exigés et demander clarification s’il ne peut pas comprendre ou respecter une clairance. Une clairance ne libère jamais le PIC de sa responsabilité de sécurité et n’autorise pas à enfreindre une règle applicable sans coordination appropriée."],["Limite de clairance et EAT","La clearance limit est le point jusqu’auquel l’aéronef est autorisé. L’Expected Approach Time (EAT) est l’heure à laquelle ATC prévoit qu’un aéronef retardé quittera le holding pour effectuer son approche. EAT n’est pas une clearance et ne remplace pas une autorisation d’approche."],["Séparation : principes","La séparation peut être verticale ou horizontale. La séparation horizontale est longitudinale ou latérale. Les minima exacts dépendent de l’espace, de la surveillance, des moyens de navigation et des procédures. Le pilote doit savoir quel service assure la séparation dans une classe d’espace donnée et reconnaître les principes d’application, sans inventer un minimum non publié."],["Position reports et surveillance","Lorsqu’ils sont requis, les comptes rendus de position contiennent les éléments prescrits : identification, position, heure, niveau et autres informations pertinentes. La surveillance ATS (radar/ADS‑B selon l’environnement) peut permettre de réduire ou remplacer certains reports vocaux, mais ne change pas automatiquement les responsabilités du pilote."],["Panne de communications","En panne de communications bilatérales, le pilote applique les procédures SERA/ICAO correspondant aux conditions VMC/IMC et aux circonstances. Le transpondeur 7600 facilite l’identification. L’ATS continuera à transmettre les informations pertinentes sur les fréquences appropriées et à protéger l’espace en tenant compte de la trajectoire supposée. Il faut distinguer “radio failure” de perte totale de tous les moyens de communication/navigation."],["Urgences et priorité","Un aéronef en détresse a priorité sur les autres trafics. ATC peut prendre des mesures particulières : assistance, priorité, coordination d’un emergency descent, information des autres aéronefs. En cas de panne ou urgence, le PIC peut s’écarter d’une clairance si la sécurité l’exige, mais doit informer ATC dès que possible."],["Strayed / unidentified aircraft","Un strayed aircraft s’est écarté significativement de sa trajectoire prévue ou signale qu’il est perdu ; un unidentified aircraft est observé ou signalé dans une zone mais son identité n’est pas établie. Les actions ATS visent à établir l’identité, assister l’aéronef et prévenir les conflits."],["Fuel dumping","Le délestage carburant peut être utilisé lorsqu’un aéronef doit réduire sa masse avant atterrissage. Il est coordonné avec l’ATS et effectué, lorsque possible, dans une zone et à une altitude appropriées pour limiter les risques. L’examen peut vérifier la logique de coordination et les précautions plutôt qu’une “altitude universelle” hors contexte."],["AIRPROX et comptes rendus","AIRPROX désigne une situation où, de l’avis d’un pilote ou du personnel ATS, la distance entre aéronefs ainsi que leurs positions/vitesses relatives ont été telles que la sécurité pouvait être compromise. Un compte rendu d’incident ATS sert à fournir les éléments nécessaires à l’analyse de sécurité et ne doit pas être confondu avec une attribution immédiate de responsabilité."],["ATM européen","Le règlement d’exécution (UE) 2017/373 structure les exigences de fourniture des services ATM/ANS dans l’Union : ATS, MET, AIS, CNS et autres fonctions associées. Pour l’examen 010, il faut connaître le rôle de ce cadre européen et sa relation avec les standards ICAO."]],"pts":["ATC, FIS et alerting service ont des objectifs différents","Classe A = IFR uniquement","Clearance limit ≠ EAT","Séparation horizontale = latérale ou longitudinale","7600 = panne COM ; une procédure de panne COM dépend des conditions et de l’espace","AIRPROX = proximité ayant pu compromettre la sécurité"],"f":[],"pieges":["FIS n’est pas un service ATC et n’assure pas par défaut une séparation.","Une EAT n’autorise pas à quitter l’attente sans clearance.","Ne pas inventer une altitude de fuel dumping : utiliser le contexte/procédure publiée.","La panne COM ne supprime pas les règles de l’air."],"ex":"Tu arrives au holding avec une EAT à 18:20. À 18:20, tu ne quittes pas automatiquement l’attente : il faut appliquer la clearance/procédure appropriée.","mod":"010 Air Law","refs":[{"label":"Syllabus EASA 2020 — Subject 010 Air Law, ED Decision 2020/018/R","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Easy Access Rules ATM/ANS — révision mars 2025","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-traffic-managementair-navigation-services-provision-services"},{"label":"EASA Easy Access Rules for SERA — révision août 2025","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-standardised-european-rules-air"}],"verified":"2026-09-28","weight":6},{"id":"010 08","t":"Information aéronautique (AIS/AIM)","syllabus":"010 08 00 00","cours":[["010 08 01 — Mission de l’AIS/AIM","L’objectif est de garantir le flux de données et informations aéronautiques nécessaires à la sécurité, la régularité et l’efficacité de la navigation aérienne. L’environnement moderne parle de plus en plus d’AIM (Aeronautical Information Management), avec une forte exigence sur la qualité, l’intégrité et l’actualité des données."],["AIP","L’Aeronautical Information Publication contient les informations aéronautiques permanentes ou de longue durée essentielles à la navigation. Elle est organisée en parties GEN, ENR et AD. Une AIP amendment modifie de manière durable le contenu ; un AIP supplement contient des changements temporaires de longue durée ou des informations de courte durée nécessitant un texte/graphique étendu."],["NOTAM","Un NOTAM diffuse rapidement une information sur l’établissement, l’état ou la modification d’une installation, d’un service, d’une procédure ou d’un danger dont la connaissance en temps utile est essentielle au personnel chargé des opérations de vol. Un NOTAM n’est pas un substitut à une AIP pour une information permanente qui doit être intégrée au cycle documentaire approprié."],["SNOWTAM et état de piste","Le SNOWTAM est un format spécial de NOTAM lié à la présence ou à la suppression de conditions dangereuses dues à la neige, la neige fondante, la glace, le givre ou l’eau associée sur l’aire de mouvement. Dans l’environnement moderne, il est lié au Global Reporting Format de l’état de piste ; le pilote doit savoir que le RCR/RWYCC est un élément opérationnel distinct du simple “runway wet/dry”."],["AIRAC","AIRAC organise la publication de changements importants selon des dates communes prédéterminées afin que les bases de données et documents soient mis à jour de manière coordonnée. Une information soumise à AIRAC doit être publiée suffisamment à l’avance pour permettre sa réception et son traitement avant la date d’effet. AIRAC est un cycle de gestion du changement, pas un type de NOTAM."],["AIC","Une Aeronautical Information Circular diffuse des informations qui ne justifient pas une AIP amendment ou un NOTAM mais concernent la sécurité, la navigation, la technique, l’administration ou la réglementation sur une période significative."],["Pre-flight Information Bulletin","Le PIB rassemble les NOTAM et autres informations opérationnelles pertinentes pour la préparation du vol. Il doit être lu avec l’AIP, les suppléments, cartes, météo et informations de route : un PIB seul ne représente pas toute l’information prévol."],["WGS‑84 et qualité des données","Les coordonnées aéronautiques utilisent le système géodésique WGS‑84 dans le cadre ICAO. L’intégrité et la précision des données sont essentielles parce qu’une erreur de coordonnées peut se propager jusque dans une base FMS ou une procédure RNAV."],["Information post‑flight","Les équipages peuvent transmettre après vol des informations concernant l’état ou le fonctionnement de services/équipements ou la présence de dangers qui doivent être portés à la connaissance de l’AIS ou des organismes compétents. La boucle d’information ne s’arrête donc pas au briefing prévol."]],"pts":["AIP = information permanente/longue durée structurée","AIP SUP ≠ NOTAM","AIRAC = cycle de mise en vigueur coordonnée","NOTAM = information opérationnelle urgente/temps utile","PIB = sélection prévol, pas totalité de l’AIP","WGS‑84 = référence géodésique internationale"],"f":[],"pieges":["Ne pas confondre AIRAC avec une publication : c’est une procédure/cycle de diffusion.","Un NOTAM ne remplace pas durablement une information AIP permanente.","SNOWTAM et NOTAM partagent la logique d’information urgente, mais le format et le contenu sont spécifiques."],"ex":"Une nouvelle SID entre en vigueur à une date AIRAC. L’équipage vérifie que la base de données est au cycle correct et que les NOTAM éventuels ne modifient pas la procédure publiée.","mod":"010 Air Law","refs":[{"label":"Syllabus EASA 2020 — Subject 010 Air Law, ED Decision 2020/018/R","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Easy Access Rules ATM/ANS — révision mars 2025","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-traffic-managementair-navigation-services-provision-services"}],"verified":"2026-09-28","weight":1},{"id":"010 09","t":"Aérodromes : données, infrastructures, marquages et feux","syllabus":"010 09 00 00","cours":[["010 09 01 — Référence réglementaire","Le syllabus combine les principes de l’Annexe 14 de l’OACI et, pour l’UE, le règlement (UE) n° 139/2014 avec les CS/AMC/GM EASA applicables. L’objectif du pilote n’est pas de concevoir une piste, mais de comprendre les données publiées, les surfaces, les marquages, les feux et les services qui conditionnent l’exploitation."],["Aerodrome reference code","Le code de référence d’aérodrome associe un élément numérique lié à la longueur de piste de référence de l’avion et une lettre liée notamment à l’envergure/dimensions. Il sert à relier les caractéristiques d’aéronefs aux spécifications des installations ; ce n’est pas une “catégorie de performance” de l’avion."],["Données aérodrome : ARP, élévation, déclinaison","L’Aerodrome Reference Point (ARP) est un point géographique établi pour l’aérodrome. Les publications donnent aussi élévation, coordonnées, caractéristiques des pistes, aides visuelles et autres données nécessaires. Les équipages doivent distinguer altitude/élévation de l’aérodrome et hauteur d’un obstacle au-dessus d’un datum local."],["ACN/PCN et résistance des chaussées","Le système historique ACN/PCN compare l’effet relatif d’un aéronef à la capacité portante déclarée d’une chaussée. Depuis l’évolution ICAO vers ACR/PCR, les publications peuvent refléter le nouveau système selon l’implémentation. Pour un cours basé sur le syllabus 2020, il faut connaître la logique : une donnée avion est comparée à une donnée chaussée afin d’évaluer l’admissibilité structurelle, et toujours vérifier l’AIP actuel."],["Declared distances","TORA = Take-Off Run Available ; TODA = Take-Off Distance Available ; ASDA = Accelerate-Stop Distance Available ; LDA = Landing Distance Available. TODA peut inclure une clearway ; ASDA peut inclure une stopway. Ces quatre distances sont publiées séparément et ne doivent jamais être déduites uniquement de la longueur physique de la piste."],["Runway, strip, RESA, clearway, stopway","La runway est la surface préparée pour décollage/atterrissage. Le runway strip entoure la piste et vise notamment à réduire les risques en cas de sortie. La RESA se situe au-delà de l’extrémité de piste pour réduire les conséquences d’un overrun/undershoot. Clearway et stopway ont des fonctions différentes dans les calculs de distances disponibles."],["Taxiways, holding positions et hot spots","Les taxiways relient les différentes parties de l’aérodrome. Les runway-holding positions protègent la piste et, selon les cas, des surfaces sensibles ILS/MLS. Un hot spot est un emplacement présentant un risque accru de collision/incursion où une vigilance particulière est nécessaire."],["Marquages de piste","Les marquages blancs identifient généralement la piste : désignation, axe, seuil, point d’attente selon les cas, aiming point et touchdown zone. Un seuil déplacé conserve une portion de piste pouvant être utilisable pour certaines opérations selon publication ; un seuil temporairement fermé ou une piste fermée possède des marquages spécifiques."],["Marquages et panneaux de taxiway","Les marquages de taxiway sont généralement jaunes. Les panneaux obligatoires utilisent typiquement un fond rouge avec inscription blanche ; les panneaux d’information utilisent d’autres combinaisons normalisées. Savoir différencier location sign et direction/destination sign aide à éviter les erreurs de roulage."],["Feux de piste","Les feux de bord de piste sont normalement blancs, avec des secteurs jaunes possibles vers l’extrémité selon la configuration. Les feux de seuil sont verts vus dans le sens de l’approche et les feux d’extrémité sont rouges. Les feux d’axe et de touchdown zone utilisent des transitions de couleur qui donnent au pilote une information de distance restante."],["Feux de taxiway et stop bars","Les feux d’axe de taxiway sont verts ; les feux de bord sont bleus. Une stop bar est constituée de feux rouges transversaux et constitue une barrière opérationnelle forte : un aéronef ne doit pas la franchir lorsqu’elle est allumée, sauf procédures spécifiques prévues par le cadre applicable."],["PAPI et indication de pente","Un PAPI standard présente quatre unités lumineuses. Deux blanches/deux rouges indiquent que l’aéronef est proche de la pente nominale ; davantage de blanc indique trop haut, davantage de rouge trop bas. Le PAPI fournit un guidage visuel de pente et ne remplace ni une clearance d’atterrissage ni les minima d’une procédure instrumentale."],["Services, obstacles et RFFS","Les aérodromes certifiés disposent de services et procédures concernant notamment sauvetage et lutte contre l’incendie, inspection, gestion des dangers animaliers, état de surface et travaux. Les obstacles peuvent nécessiter marquage et balisage, mais le fait d’être balisé ne supprime pas leur impact sur les procédures ou performances."],["Runway condition et GRF","Le Global Reporting Format fournit un langage standardisé pour l’état de piste, notamment par Runway Condition Code et description des contaminants. L’équipage utilise ces informations avec les données de performance approuvées ; un RWYCC n’est pas lui-même une distance d’atterrissage."]],"pts":["TORA/TODA/ASDA/LDA : connaître la signification exacte","Panneaux obligatoires : fond rouge, inscription blanche","Taxiway centreline lights : vert ; edge lights : bleu","Runway threshold lights : vert ; runway end lights : rouge","PAPI 2 blanc / 2 rouge ≈ pente correcte","Stop bar rouge allumée = ne pas franchir dans le fonctionnement normal","Aérodrome 010 est un sujet fortement pondéré à l’examen ATPL(A)"],"f":[["TORA","Take-Off Run Available."],["TODA","Take-Off Distance Available."],["ASDA","Accelerate-Stop Distance Available."],["LDA","Landing Distance Available."]],"pieges":["TODA n’est pas forcément égale à TORA.","Clearway ≠ stopway.","Ne pas confondre couleur des marquages avec couleur des feux.","PAPI n’assure pas la séparation obstacle hors du contexte prévu et ne remplace pas une procédure instrumentale."],"ex":"Une piste physique mesure 2 500 m, mais l’AIP publie TORA 2 300 m et TODA 2 600 m. Le pilote utilise les declared distances publiées, pas la longueur physique seule.","mod":"010 Air Law","refs":[{"label":"Syllabus EASA 2020 — Subject 010 Air Law, ED Decision 2020/018/R","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Easy Access Rules for Aerodromes — révision mars 2026","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aerodromes"}],"verified":"2026-09-28","weight":8},{"id":"010 10","t":"Facilitation","syllabus":"010 10 00 00","cours":[["010 10 01 — Objet de l’Annexe 9","La facilitation vise à simplifier et accélérer les formalités liées à l’entrée et à la sortie des aéronefs, équipages, passagers, bagages, fret et courrier tout en permettant aux États d’exercer leurs contrôles de frontière, santé, douane et immigration."],["Entrée et départ des aéronefs","Les États cherchent à réduire les délais et formalités inutiles en utilisant des documents et procédures standardisés. Pour l’équipage, cela se traduit par la préparation des documents de bord, déclarations et informations exigées pour un vol international."],["Équipages et passagers","Les documents de voyage, visas lorsqu’ils sont requis, contrôles de frontière et procédures applicables aux membres d’équipage répondent à une logique de facilitation distincte des règles de sécurité du vol. Des dispositions particulières existent pour personnes inadmissibles, déportées ou nécessitant assistance."],["Fret, courrier et santé publique","L’Annexe 9 couvre également les formalités de cargaison, courrier, douane et mesures de santé publique. Un commandant n’est pas l’autorité de frontière : son rôle est de s’assurer que l’exploitation respecte les procédures de l’exploitant et les exigences applicables."],["Facilitation vs sûreté","Facilitation cherche à fluidifier ; sûreté cherche à prévenir les actes d’intervention illicite. Une mesure peut servir les deux domaines, mais leurs objectifs juridiques ne sont pas les mêmes. À l’examen, cette distinction évite de confondre Annexes 9 et 17."]],"pts":["Annexe 9 = Facilitation","Facilitation ne signifie pas suppression des contrôles","Formalités frontière ≠ clearance ATC","Annexe 9 et Annexe 17 ont des objectifs différents"],"f":[],"pieges":["Ne pas répondre “security” à une question sur la simplification des formalités de frontière.","Une autorisation de vol ne remplace pas les formalités d’immigration/douane."],"ex":"Un vol a reçu toutes ses clearances ATC mais l’équipage n’a pas les documents d’entrée requis pour l’État de destination : la clearance aéronautique n’efface pas les exigences de facilitation/frontière.","mod":"010 Air Law","refs":[{"label":"Syllabus EASA 2020 — Subject 010 Air Law, ED Decision 2020/018/R","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"verified":"2026-09-28","weight":1},{"id":"010 11","t":"Recherche et sauvetage (SAR)","syllabus":"010 11 00 00","cours":[["010 11 01 — Définitions essentielles","L’Annexe 12 définit notamment emergency phase, uncertainty phase, alert phase, distress phase, Rescue Coordination Centre (RCC), Rescue Sub-centre et State of Registry. Les mots ont une gradation précise de gravité."],["INCERFA — phase d’incertitude","Une phase d’incertitude est déclarée lorsque subsiste une incertitude quant à la sécurité d’un aéronef et de ses occupants, par exemple absence de communication ou arrivée non confirmée dans les délais définis. Elle constitue le premier niveau de la chaîne d’alerte."],["ALERFA — phase d’alerte","La phase d’alerte correspond à une inquiétude accrue concernant la sécurité de l’aéronef ou de ses occupants, par exemple après des tentatives de contact infructueuses supplémentaires ou lorsqu’un aéronef a été autorisé à atterrir et n’atterrit pas dans le délai attendu."],["DETRESFA — phase de détresse","La phase de détresse signifie qu’il existe une certitude raisonnable qu’un aéronef et ses occupants sont menacés d’un danger grave et imminent et ont besoin d’une assistance immédiate. Elle déclenche le niveau d’intervention SAR le plus élevé."],["Organisation SAR","Les États établissent des Search and Rescue Regions et des RCC/RSC afin de coordonner les moyens. Le RCC rassemble les renseignements, détermine les zones de recherche et coordonne les ressources aériennes, maritimes ou terrestres."],["Rôle d’un aéronef non SAR","Un aéronef qui observe un aéronef ou des personnes en détresse doit, dans la mesure compatible avec sa propre sécurité, transmettre les renseignements, maintenir l’observation si possible et suivre les instructions du RCC/ATS. La sécurité de l’aéronef assistant reste une limite essentielle."],["Signaux SAR","Les signaux SAR normalisés permettent la communication entre aéronefs, navires, équipes de sauvetage et survivants. Ils sont conçus pour être compris même lorsque les communications radio sont impossibles."],["Informations utiles","Position, heure, nature de la détresse, personnes à bord, autonomie, dernière route et moyens de survie sont des informations particulièrement importantes. Plus l’information initiale est précise, plus la zone de recherche peut être réduite rapidement."]],"pts":["INCERFA → ALERFA → DETRESFA = gravité croissante","RCC = Rescue Coordination Centre","DETRESFA = danger grave/imminent + assistance immédiate","Un aéronef témoin aide dans la limite de sa propre sécurité"],"f":[],"pieges":["Ne pas inverser ALERFA et DETRESFA.","RCC coordonne ; il n’est pas nécessairement l’unité qui exécute physiquement la recherche.","Une perte de contact n’implique pas immédiatement DETRESFA : les phases dépendent des circonstances."],"ex":"Un avion n’arrive pas à destination et aucun contact ne peut être établi. La réponse SAR progresse selon les informations disponibles : INCERFA peut évoluer vers ALERFA puis DETRESFA si les indices de danger augmentent.","mod":"010 Air Law","refs":[{"label":"Syllabus EASA 2020 — Subject 010 Air Law, ED Decision 2020/018/R","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Easy Access Rules ATM/ANS — révision mars 2025","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-traffic-managementair-navigation-services-provision-services"}],"verified":"2026-09-28","weight":1},{"id":"010 12","t":"Sûreté de l’aviation civile","syllabus":"010 12 00 00","cours":[["010 12 01 — Safety vs security","En français aéronautique, “sécurité” traite des risques accidentels ; “sûreté” traite de la protection contre les actes d’intervention illicite. L’Annexe 17 et le règlement (CE) n° 300/2008 structurent la sûreté de l’aviation civile. Cette distinction est fondamentale à l’examen."],["Principes de l’Annexe 17","Les États doivent établir une organisation, des programmes et des mesures permettant de protéger l’aviation civile contre les actes d’intervention illicite. Le système repose sur plusieurs couches : contrôle d’accès, inspection-filtrage, protection des aéronefs, contrôle des bagages/fret et coordination des autorités."],["Zones et contrôle d’accès","Airside, security restricted areas et accès contrôlés répondent à des exigences de sûreté différentes selon leur sens réglementaire. Les badges, inspections et contrôles visent à réduire la possibilité d’introduire des personnes ou objets non autorisés dans des zones sensibles."],["Aéronef : security check et search","Un aircraft security check est une inspection de certaines zones de l’aéronef afin de détecter objets interdits ou indices d’intervention illicite. Une aircraft security search est une inspection plus approfondie selon le cadre applicable. Les termes ne sont pas interchangeables."],["Bagages, fret et personnes","Passagers, bagages cabine/soute, fret, courrier, approvisionnements et véhicules font l’objet de mesures adaptées. Le pilote n’a pas à mémoriser des détails de sûreté sensibles ; l’ATPL porte sur les principes, les responsabilités et les mesures publiquement enseignables."],["Intervention illicite","En cas d’intervention illicite, la priorité est la sécurité des personnes et de l’aéronef. L’équipage suit les procédures de l’exploitant, tente de maintenir les communications appropriées et coopère avec les autorités. Le code transpondeur 7500 signale une unlawful interference lorsqu’il peut être utilisé sans accroître le danger."],["Flight crew compartment","Pour les avions auxquels les règles correspondantes s’appliquent, la porte du poste de pilotage et son contrôle constituent une mesure de sûreté importante. Les procédures d’accès sont conçues pour empêcher l’accès non autorisé tout en permettant la gestion d’une situation opérationnelle ou d’urgence."],["Isolated aircraft parking position","Un aéronef soumis ou suspecté d’avoir été soumis à une intervention illicite peut être dirigé vers une position isolée afin de limiter les risques pour les personnes, bâtiments et autres aéronefs. Le pilote suit alors les instructions ATC et de sûreté adaptées à la situation."],["Cadre UE actuel","Le règlement (CE) n° 300/2008 établit des règles communes de sûreté de l’aviation civile dans l’Union et sert aussi de base à une interprétation commune de l’Annexe 17. Les mesures détaillées sont complétées par des actes d’exécution dont certaines dispositions ne sont pas destinées à une diffusion générale."]],"pts":["Security = actes illicites ; safety = risques accidentels","7500 = intervention illicite","Annexe 17 = cadre ICAO sûreté","Règlement (CE) 300/2008 = cadre commun UE","La sûreté repose sur plusieurs barrières successives"],"f":[],"pieges":["Ne pas exposer ni inventer des procédures sensibles non publiques.","Ne pas confondre aircraft security check et security search.","7500 ne doit pas être sélectionné si son utilisation augmente directement le danger selon la situation réelle et les procédures équipage."],"ex":"Une menace crédible est signalée après repoussage. L’équipage ne traite pas la situation comme un simple problème technique : coordination ATC/sûreté, procédure opérateur et protection des personnes deviennent prioritaires.","mod":"010 Air Law","refs":[{"label":"Syllabus EASA 2020 — Subject 010 Air Law, ED Decision 2020/018/R","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"Règlement (CE) n° 300/2008 — sûreté de l’aviation civile","url":"https://eur-lex.europa.eu/eli/reg/2008/300/oj?locale=fr"}],"verified":"2026-09-28","weight":2},{"id":"010 13","t":"Enquêtes sur accidents et incidents","syllabus":"010 13 00 00","cours":[["010 13 01 — Définitions","L’Annexe 13 définit notamment accident, incident, serious incident, investigation, flight recorder, operator, State of Design, State of Manufacture, State of Occurrence, State of the Operator et State of Registry. Les questions demandent souvent de distinguer précisément ces termes."],["Accident vs serious incident","Un accident comporte les critères définis par l’Annexe 13, notamment selon les blessures, dommages structuraux ou disparition/inaccessibilité de l’aéronef. Un serious incident ne remplit pas nécessairement ces critères mais présente des circonstances indiquant qu’il existait une forte probabilité d’accident. La différence repose donc sur la nature et les conséquences de l’événement, pas sur un jugement subjectif de “gravité ressentie”."],["Objectif de l’enquête","Le seul objectif fondamental de l’enquête de sécurité est la prévention des accidents et incidents. Elle n’a pas pour finalité d’attribuer faute ou responsabilité. Des procédures judiciaires, disciplinaires ou assurantielles peuvent exister en parallèle, mais elles ont une finalité différente."],["État d’occurrence et autres États","En principe, l’État d’occurrence conduit ou délègue l’enquête selon l’Annexe 13. Les États de registre, de l’exploitant, de conception et de construction peuvent avoir des droits de participation et des obligations d’information. Il faut savoir reconnaître les rôles, pas uniquement mémoriser une liste de noms."],["Notification et préservation","Après un accident ou incident grave, les autorités compétentes doivent être notifiées et les preuves doivent être protégées : épave, enregistreurs, documents, données ATS et éléments opérationnels. La préservation vise à permettre une analyse indépendante et fiable."],["Rapports et recommandations","L’enquête produit des rapports et peut émettre des recommandations de sécurité. Une recommandation vise la prévention ; elle ne constitue pas en elle-même une décision de responsabilité civile ou pénale."],["Cadre européen : règlement 996/2010","Dans l’UE, le règlement (UE) n° 996/2010 organise l’enquête et la prévention des accidents et incidents en aviation civile. Il renforce l’indépendance des autorités d’enquête de sécurité et leur coopération, en cohérence avec l’Annexe 13."],["Occurrence reporting : règlement 376/2014","Le règlement (UE) n° 376/2014 organise le compte rendu, la collecte, l’analyse et le suivi d’événements de sécurité. Il ne faut pas le confondre avec l’enquête d’accident : un occurrence report alimente la prévention et la gestion du risque, mais n’est pas nécessairement une enquête Annexe 13."],["Just culture et protection de l’information","Le système européen vise à encourager le signalement des événements et la protection appropriée des informations de sécurité. L’objectif est d’apprendre des événements et d’identifier les risques systémiques, tout en conservant les exceptions prévues pour les comportements manifestement inacceptables."]],"pts":["Objectif d’une enquête de sécurité = prévention, pas attribution de faute","Serious incident = forte probabilité d’accident, sans nécessairement remplir les critères d’un accident","État d’occurrence joue un rôle central dans l’enquête Annexe 13","Règlement 996/2010 = enquête de sécurité UE","Règlement 376/2014 = occurrence reporting et analyse de sécurité"],"f":[],"pieges":["Ne pas confondre enquête de sécurité et procédure judiciaire.","Une recommandation de sécurité n’est pas un jugement de responsabilité.","Incident grave et accident sont des catégories réglementaires, pas des appréciations libres."],"ex":"Après une sortie de piste avec dommages importants, l’enquête de sécurité cherche les facteurs contributifs et émet des recommandations. Une procédure judiciaire éventuelle est séparée et n’a pas le même objectif.","mod":"010 Air Law","refs":[{"label":"Syllabus EASA 2020 — Subject 010 Air Law, ED Decision 2020/018/R","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"Règlement (UE) n° 996/2010 — enquêtes accidents/incidents","url":"https://eur-lex.europa.eu/eli/reg/2010/996/oj/fra"},{"label":"Règlement (UE) n° 376/2014 — comptes rendus d’événements","url":"https://eur-lex.europa.eu/eli/reg/2014/376/oj?locale=fr"}],"verified":"2026-09-28","weight":2}];

const SYS021=[{"id":"021 01","t":"Conception, charges, contraintes et maintenance","syllabus":"021 01 00 00","cours":[["Philosophies de conception","Une structure certifiée n’est pas supposée être indestructible. Le principe safe-life fixe une durée de vie avant retrait ; le fail-safe prévoit plusieurs chemins de charge afin qu’une rupture locale ne soit pas immédiatement catastrophique ; le damage-tolerant suppose l’existence possible de défauts et impose qu’ils puissent être détectés avant d’atteindre une taille critique. La redondance et la ségrégation réduisent les défaillances de cause commune."],["Charges, contraintes et déformations","Une charge extérieure crée des efforts internes de traction, compression, cisaillement, flexion ou torsion. La contrainte est une force rapportée à une surface ; la déformation décrit la réponse du matériau. Dans le domaine élastique, le matériau reprend sa forme lorsque la charge disparaît ; au-delà de la limite élastique apparaît une déformation permanente, puis éventuellement la rupture."],["Fatigue et corrosion","La fatigue provient de l’accumulation de cycles de charge, souvent à un niveau bien inférieur à la résistance statique ultime. Les concentrations de contraintes, entailles, défauts, corrosion et cycles de pressurisation l’accélèrent. La corrosion peut être chimique ou électrochimique et réduit la section efficace ; elle peut aussi amorcer des fissures de fatigue."],["Maintenance et surveillance","Hard-time signifie retrait ou révision à une échéance définie ; on-condition signifie maintien en service tant que des inspections démontrent un état acceptable ; condition monitoring suit les tendances d’une population ou d’un paramètre afin de détecter une dégradation. Le pilote ne “répare” pas le système : il reconnaît les indications, applique les limitations et transmet l’information technique."],["Logique de panne","Pour comprendre un système ATPL, suivre toujours source d’énergie → distribution → commande → actionneu
