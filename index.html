const COMM090=[{"id":"090 01","t":"Concepts et principes de radiotéléphonie","syllabus":"090 01 00 00","cours":[["But","La radiotéléphonie vise messages courts, non ambigus et vérifiables. Phraseology standard réduit charge cognitive ; plain language complète lorsqu’aucune phrase standard ne couvre situation. Clarté prime vitesse."],["Structure","Écouter avant transmettre, utiliser callsign correct, station appelée puis appelant lors contact initial, parler à débit régulier et éviter transmissions longues. Une fréquence occupée ne doit pas être coupée sauf priorité/urgence appropriée."],["Readback / hearback","Les éléments critiques d’une clearance doivent être read back conformément règles ; contrôleur vérifie hearback. Un readback correct mais non corrigé ne déplace pas responsabilité de comprendre/exécuter clearance."],["Nombres et lettres","Prononciation aviation standard des chiffres/phonetic alphabet limite confusion. Fréquences, niveaux, headings, runway, QNH ont formats spécifiques. Éviter jargon local."],["Q codes essentiels","Les Q codes encore indispensables en culture ATPL sont surtout QNH, QFE, QNE, QDM, QDR et QTE. QNH correspond au réglage altimétrique donnant une altitude par rapport au niveau moyen de la mer ; QFE donne une hauteur par rapport au datum d’aérodrome ; QNE correspond au réglage standard 1013,25 hPa pour l’expression en niveaux de vol. En radionavigation, QDM est le cap magnétique à suivre vers la station sans correction de vent ; QDR est le relèvement magnétique FROM la station ; QTE est le relèvement vrai FROM la station. Il faut comprendre ces codes même si certains sont moins utilisés en exploitation moderne."],["Radio check et lisibilité","Un contrôle radio doit rester bref. La réponse peut utiliser l’échelle OACI de lisibilité 1 à 5 : 1 unreadable, 2 readable now and then, 3 readable but with difficulty, 4 readable, 5 perfectly readable. Un “read you five” n’est pas de la fantaisie : c’est une information opérationnelle sur la qualité de réception."],["Qualité radio","Readability 1–5 décrit qualité réception. Si message douteux : SAY AGAIN, CONFIRM, CORRECTION, WORDS TWICE etc. Ne jamais inventer partie non comprise."]],"pts":["Phraseology standard d’abord, plain language si nécessaire.","Readback + hearback ferment boucle de communication.","Écouter avant transmettre.","Callsign abrégé seulement lorsque initié/autorisé de façon appropriée.","QNH, QFE, QNE, QDM et QDR doivent être connus sans hésitation.","L’échelle de lisibilité radio va de 1 à 5."],"f":[],"pieges":["Un “roger” ne remplace pas readback obligatoire.","WILCO ne signifie pas que toutes données critiques sont relues.","QDM et QDR sont complémentaires mais n’ont pas le même sens.","Un radio check doit rester court et ne pas encombrer la fréquence."],"ex":"Si une station te donne QDR 090, tu es à l’est de la station ; le QDM de retour, sans vent, est 270.","mod":"090 Communications","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 090","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"SERA — communication et règles de l’air","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-standardised-european-rules-air"}],"v5":true},{"id":"090 02","t":"Procédures normales VFR et IFR","syllabus":"090 02 00 00","cours":[["Prise de contact","Premier appel contient station, callsign, type/position/intentions selon phase. Après établissement, éviter répéter informations inutiles. Changement fréquence : monitor/listen puis contact à moment requis."],["Sol/départ","Taxi clearance doit être comprise avec holding points/runway crossings. Take-off clearance est distincte de line-up. Une instruction “taxi to holding point” n’autorise jamais entrée piste sans clearance spécifique lorsque requise."],["En route","Position report peut inclure identification, position, time, level, next point/time, ensuing point selon environnement. IFR controlled flight lit niveaux/headings/speeds assignés et signale inability si performance incompatible."],["Arrivée/approche","ATIS réduit fréquence mais données critiques restent vérifiées. Approach clearance, descent, QNH, runway, wind et landing clearance ont rôles différents. Une clearance approche ne vaut pas landing clearance."],["Transfert de fréquence et monitoring","Lors d’un handover, le pilote doit basculer sur la fréquence assignée puis établir le contact avec le bon indicatif. Une instruction “monitor” signifie écouter sans appel initial sauf nécessité, mais le pilote reste responsable de signaler toute incapacité ou situation anormale. Un mauvais readback de fréquence ou un oubli de transfert est une erreur classique en environnement dense."],["Heure et références temporelles","Les heures transmises en aviation sont exprimées en UTC. Elles servent à coordonner départs, reports de position, EAT/CTOT, EOBT et événements d’urgence. Il faut entendre correctement les groupes horaires et distinguer heure de clairance, heure estimée et heure effective."],["Conditional clearances","Doivent identifier trafic/condition clairement et être utilisées selon conditions réglementaires. Équipage doit avoir trafic en vue quand nécessaire et read back condition + instruction."]],"pts":["Line-up ≠ take-off clearance.","Approach clearance ≠ landing clearance.","ATIS ne remplace pas readback des éléments critiques.","Inability doit être annoncé plutôt qu’accepter une clearance inexécutable.","Un handover doit être exécuté avec la bonne fréquence et le bon indicatif.","Les transmissions temps en aviation se font en UTC."],"f":[],"pieges":["Ne pas anticiper un crossing de piste.","Une clearance conditionnelle exige compréhension de la condition."],"ex":"“Cleared ILS approach runway 27” autorise procédure approche, pas atterrissage : attendre “cleared to land”.","mod":"090 Communications","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 090","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"SERA — communication et règles de l’air","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-standardised-european-rules-air"}],"v5":true},{"id":"090 03","t":"Informations météo en radiotéléphonie","syllabus":"090 03 00 00","cours":[["Vent","Vent transmis en degrés et kt selon conventions ATS ; direction peut être magnetic ou true selon contexte/service, donc connaître règle locale/produit. Gusts sont signalés lorsqu’applicables."],["Visibilité et RVR","Visibility décrit atmosphère générale ; RVR mesure/estime distance visuelle le long runway. En faible visibilité, RVR peut être plus opérationnel pour minima. Plusieurs points TDZ/MID/END peuvent être reportés."],["Nuages","Cloud base, amount et CB/TCU sont transmis lorsque pertinents. Ceiling se rapporte couche BKN/OVC la plus basse. Vertical visibility est utilisée lorsque ciel obscurci."],["QNH / QFE / QNE","QNH permet altitude AMSL approximative ; QFE hauteur au-dessus du datum d’aérodrome ou seuil selon contexte ; QNE correspond au réglage standard 1013,25 hPa utilisé pour les niveaux de vol au-dessus de l’altitude de transition. Readback du QNH est critique car une erreur de réglage déplace la référence verticale ; il faut aussi savoir quand passer du QNH au standard puis revenir au QNH en descente."],["Phénomènes","Thunderstorm, icing, windshear, runway state et significant weather peuvent être transmis par ATIS/ATC. Un rapport pilote de windshear peut déclencher warnings aux suivants."]],"pts":["RVR ≠ visibilité générale.","BKN/OVC définissent ceiling.","QNH readback est critique.","Pilot reports complètent informations météo ATS.","QNE = 1013,25 hPa et niveaux de vol.","La transition impose le bon changement de référence altimétrique."],"f":[],"pieges":["Ne pas traduire automatiquement un vent METAR true en même référence qu’un vent ATC sans connaître convention.","RVR a des emplacements distincts."],"ex":"RVR 300/250/200 m signifie dégradation le long de la piste de TDZ vers rollout ; minima se comparent selon règles opérationnelles applicables.","mod":"090 Communications","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 090","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"SERA — communication et règles de l’air","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-standardised-european-rules-air"}],"v5":true},{"id":"090 04","t":"Panne de communication","syllabus":"090 04 00 00","cours":[["Diagnostic","Vérifier fréquence, volume/squelch, audio panel, PTT/micro, autre radio, casque/haut-parleur, fréquence précédente et réception seule. Une panne apparente peut être congestion ou erreur de sélection."],["Transpondeur","Code radio failure 7600 lorsque applicable. Mode S/ADS-B continue fournir informations si transpondeur fonctionne. Une panne COM n’implique pas panne transpondeur/navigation."],["VFR","En VMC, stratégie dépend espace et possibilités : rester/prendre VMC et atterrir sur aérodrome approprié lorsque règles le prévoient, surveiller signaux lumineux à aérodrome contrôlé, utiliser téléphone/data link/relay si disponible."],["IFR","Procédure lost comm suit SERA/ICAO : route et niveau/altitude selon dernière clearance, expected clearance et flight plan dans ordre défini, avec timing pour approche. Il faut apprendre la règle actuelle du 010 plutôt qu’une recette simplifiée hors contexte."],["Réception seule","TRANSMITTING BLIND peut être utilisé si émetteur fonctionne sans réception, avec répétition et position/intention. Relay via autre aéronef/ATS peut restaurer communication."]],"pts":["7600 signale radio failure.","Diagnostiquer chaîne audio avant conclure panne totale.","Lost comm IFR utilise règles route/niveau/timing précises du 010.","Data link/relay peut servir si disponible."],"f":[],"pieges":["Ne pas appliquer une procédure IFR lost comm de mémoire simplifiée sans contexte SERA actuel.","Radio failure n’annule pas automatiquement clearance existante."],"ex":"Après perte réception VHF, essayer seconde radio et relay avant passer à scénario total lost comm.","mod":"090 Communications","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 090","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"SERA — communication et règles de l’air","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-standardised-european-rules-air"}],"v5":true},{"id":"090 05","t":"Détresse et urgence","syllabus":"090 05 00 00","cours":[["Priorités","MAYDAY = distress : danger grave/imminent et assistance immédiate requise. PAN PAN = urgency : sécurité d’un aéronef/personne concernée sans besoin immédiat de secours au niveau détresse. Distress a priorité absolue."],["Message MAYDAY","MAYDAY ×3, station appelée, callsign, nature détresse, intentions, position/level/heading et autres informations utiles selon situation. Sous forte charge, transmettre l’essentiel plutôt qu’attendre message parfait."],["PAN PAN","Structure comparable mais préfixe PAN PAN. Peut concerner problème médical, système dégradé ou situation nécessitant priorité sans menace immédiate. Une urgence peut évoluer en détresse."],["121.5 et transpondeur","121.5 MHz est fréquence internationale urgence VHF ; 7700 signale urgence générale, 7600 radio, 7500 unlawful interference sous règles appropriées. Utiliser code assigné/ATC instructions sauf nécessité."],["Silence radio","Stations doivent éviter interférer avec trafic de détresse. ATS peut imposer silence. Une station capable d’aider peut relayer message si détresse non accusée."]],"pts":["MAYDAY = détresse ; PAN PAN = urgence.","121.5 MHz = fréquence VHF urgence internationale.","7700 emergency, 7600 radio failure, 7500 unlawful interference.","Transmettre l’essentiel sans retarder action de pilotage."],"f":[],"pieges":["PAN PAN n’est pas “moins sérieux donc sans priorité”.","Ne pas changer transpondeur de façon automatique si ATC donne autre instruction adaptée."],"ex":"Un feu moteur non maîtrisé justifie MAYDAY ; une dégradation système stable nécessitant retour peut commencer PAN PAN selon jugement/procédures.","mod":"090 Communications","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 090","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"SERA — communication et règles de l’air","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-standardised-european-rules-air"}],"v5":true},{"id":"090 06","t":"VHF : propagation et fréquences","syllabus":"090 06 00 00","cours":[["Bande aviation","Voice VHF aviation utilise bande autour de 118–137 MHz avec espacement de canaux selon espace aérien, dont 8,33 kHz en Europe dans nombreuses zones. Un affichage “channel” n’est pas toujours la fréquence physique exacte au sens simple."],["Line-of-sight","VHF se propage quasi optiquement ; portée augmente avec altitude des antennes. Terrain/buildings peuvent masquer. La courbure terrestre limite même par ciel clair."],["Interférences","Same/adjacent channel, transmissions simultanées et stuck microphone peuvent bloquer fréquence. Squelch supprime bruit faible ; mauvaise utilisation peut masquer signal faible."],["Portée et fréquence","Augmenter puissance aide jusqu’à limite mais ne contourne pas l’horizon radio. Les relais et stations élevées étendent couverture."],["Canaux 8,33","Équipement compatible doit être sélectionné selon channel designation publiée. Le pilote ne doit pas convertir mentalement par arrondi une fréquence si procédure/channel est fournie."]],"pts":["VHF = principalement line-of-sight.","Altitude augmente radio horizon.","8,33 kHz utilise channel spacing spécifique.","Stuck mic peut bloquer fréquence."],"f":[["Longueur d’onde","λ = c/f"]],"pieges":["Plus de puissance ne franchit pas toujours terrain/horizon.","Channel 8,33 et fréquence porteuse ne se traitent pas comme simple arrondi."],"ex":"À FL350, portée VHF vers station sol élevée peut atteindre centaines de NM, mais relief proche peut toujours créer shadow à basse altitude.","mod":"090 Communications","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 090","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"SERA — communication et règles de l’air","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-standardised-european-rules-air"}],"v5":true},{"id":"090 07","t":"Autres communications et identification","syllabus":"090 07 00 00","cours":[["Morse","Certaines aides radio transmettent ident Morse. Avant utilisation, identification correcte confirme aide attendue ; absence/ident incorrect peut signifier maintenance ou mauvaise station."],["Q codes et relèvements","Les examens ATPL aiment relier communications et radionavigation : QDM vers la station, QDR depuis la station, QTE relèvement vrai depuis la station, QNH/QFE/QNE pour l’altimétrie. Il faut surtout retenir le sens TO/FROM et la référence magnétique ou vraie utilisée. En exploitation moderne, ces codes apparaissent moins souvent en phraseologie pure, mais ils restent un langage classique des questions théoriques."],["Abréviations et expressions normalisées","Au-delà de l’alphabet phonétique, il faut connaître les expressions normalisées : WILCO, ROGER, AFFIRM, NEGATIVE, CORRECTION, DISREGARD, STANDBY, UNABLE, SAY AGAIN, READ BACK, REPORT, MONITOR. Leur but est de réduire l’ambiguïté ; elles ne sont pas interchangeables. WILCO implique réception et exécution, alors que ROGER signifie seulement “j’ai reçu”."],["VOLMET / ATIS","VOLMET diffuse météo de plusieurs aérodromes en route ; ATIS fournit message terminal répétitif incluant météo et informations opérationnelles. Lettre ATIS permet confirmer version reçue."],["CPDLC","Data link ATC échange clearances/requêtes structurées. Readback textuel est intégré au dialogue mais vigilance sur message uplink, latence et sélection de réponse reste nécessaire. En cas d’ambiguïté/urgence, voice est souvent préféré selon procédure."],["HF et SELCAL","HF permet longues distances océanique mais bruit/propagation variable. SELCAL avertit équipage d’un appel, évitant écoute permanente. Une vérification SELCAL est réalisée avant dépendre du système."],["Communication inter-pilotes/relay","Relayer un message nécessite préserver contenu et identifier source/destination. La fréquence guard peut être utilisée pour urgence ou établissement contact selon règles ; elle ne doit pas être encombrée."]],"pts":["Ident Morse confirme aide radio.","ATIS letter identifie version du message.","CPDLC complète la voix mais exige monitoring.","SELCAL alerte sur HF/VHF selon installation.","WILCO = reçu et j’exécute ; ROGER = reçu seulement.","QDM/QDR/QTE restent des classiques de la banque ATPL."],"f":[],"pieges":["Ne pas utiliser une aide sans ident lorsque identification est requise.","Un message data link ne doit pas être accepté automatiquement si clearance paraît incohérente.","ROGER ne veut pas dire WILCO.","QTE est un relèvement vrai FROM la station, pas un cap à suivre."],"ex":"ATIS “Information Kilo” reçu : annoncer “with Kilo” évite répétition, mais ATC transmet encore changements critiques ultérieurs.","mod":"090 Communications","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 090","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"SERA — communication et règles de l’air","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-standardised-european-rules-air"}],"v5":true}];
const Q090=[["Quel est le sujet EASA actuel correspondant aux communications ATPL ?",["090 Communications","091 VFR Communications uniquement","092 IFR Communications uniquement","100 KSA"],0,"EASA a fusionné les anciens 091 et 092 dans le Subject 090 Communications."],["Combien de rubriques principales comporte le syllabus 090 ?",["4","5","7","10"],2,"Le syllabus est organisé de 090 01 à 090 07."],["Dans le Q-code, QNH correspond principalement à…",["Une référence altimétrique liée au niveau moyen de la mer","La température","La visibilité","La vitesse du vent"],0,"QNH est un réglage altimétrique permettant d’obtenir une altitude par rapport au niveau moyen de la mer dans le contexte approprié."],["L’alphabet phonétique OACI sert principalement à…",["Accélérer toutes les transmissions","Éviter les confusions entre lettres","Remplacer les indicatifs","Transmettre uniquement les nombres"],1,"Il permet une transmission non ambiguë des lettres."],["‘Roger’ signifie généralement…",["Je vais exécuter l’instruction","Votre message a été reçu","Attendez","J’ai une urgence"],1,"Roger signifie que la dernière transmission a été reçue."],["‘Wilco’ signifie…",["Message reçu uniquement","Attendez","J’ai compris et vais exécuter","Panne radio"],2,"Wilco signifie compris et vais me conformer à l’instruction."],["‘Stand by’ signifie…",["Autorisation immédiate","Attendez","Détresse","Changement de fréquence obligatoire"],1,"Stand by demande d’attendre."],["L’ATIS fournit principalement…",["Une information automatique d’aérodrome","Une clairance de route mondiale","Un service de radar météo embarqué","Une carte aéronautique"],0,"ATIS diffuse des informations opérationnelles et météorologiques d’aérodrome."],["Quel code transpondeur est associé à une panne de communications ?",["7500","7600","7700","7000"],1,"7600 est le code associé à une panne de communication."],["Quel code indique une urgence générale ?",["7500","7600","7700","2000"],2,"7700 est le code d’urgence général."],["Le code 7500 est associé à…",["Une panne radio","Une intervention illicite","Une urgence générale","Un vol VFR"],1,"7500 est associé à une intervention illicite."],["MAYDAY indique…",["Une demande de routine","Une urgence sans détresse","Une détresse","Un changement de fréquence"],2,"MAYDAY est le signal de détresse."],["PAN PAN indique…",["Une détresse","Une urgence","Une panne de transpondeur uniquement","Une information météo"],1,"PAN PAN est le signal d’urgence."],["Quelle priorité est correcte ?",["Routine > urgence > détresse","Détresse > urgence > routine","Urgence > détresse > routine","Toutes ont la même priorité"],1,"Les communications de détresse ont la priorité la plus élevée."],["La propagation VHF aéronautique est principalement…",["En visibilité directe","Par réflexion ionosphérique longue distance","Sous-marine","Uniquement satellitaire"],0,"La VHF est principalement en visibilité directe."],["Une augmentation de l’altitude de l’aéronef tend à…",["Réduire l’horizon radio","Augmenter la portée en visibilité directe","Supprimer le relief","Rendre la fréquence inutile"],1,"Une altitude plus élevée augmente généralement l’horizon radio."],["La fréquence VHF internationale d’urgence aéronautique est…",["118.000 MHz","121.500 MHz","123.450 MHz","130.000 MHz"],1,"121,5 MHz est la fréquence VHF internationale d’urgence."],["Avant de changer de fréquence, l’équipage doit notamment…",["Ignorer l’instruction","Identifier et sélectionner la fréquence appropriée","Passer sur 121,5 MHz systématiquement","Couper le transpondeur"],1,"Le changement doit suivre l’instruction et la fréquence assignée/publiée."],["Un test radio sert à vérifier principalement…",["Le centrage","L’émission et la réception","La météo","La navigation inertielle"],1,"Il permet de vérifier le fonctionnement de la transmission et réception."],["Une radioroute ou aide radio doit être identifiée lorsque…",["Cela est prévu par la procédure ou nécessaire pour confirmer l’installation","Jamais","Seulement en VFR","Seulement après atterrissage"],0,"L’identification permet de vérifier que l’installation utilisée est bien celle attendue."],["Le message ATIS est généralement identifié par…",["Une lettre ou identification de version","Le numéro de piste uniquement","Le code 7600","Le type d’avion"],0,"Les versions successives de l’ATIS sont identifiées pour que l’équipage puisse confirmer l’information reçue."],["Quel élément doit être lu back en priorité ?",["Une conversation personnelle","Une autorisation ou instruction critique","Une météo déjà connue","Un indicatif inutile"],1,"Les autorisations et informations critiques sont répétées pour confirmer leur bonne compréhension."],["HEAVY/SUPER dans un indicatif servent notamment à…",["Indiquer la catégorie de turbulence ou masse pertinente selon les procédures","Indiquer un vol VFR","Indiquer une panne radio","Remplacer l’immatriculation"],0,"Ces suffixes font partie des indicatifs utilisés selon la catégorie applicable."],["En cas de panne radio, la première priorité est…",["Remplir le journal de bord","Maintenir le contrôle de l’aéronef","Changer trois fois de fréquence","Couper tous les équipements"],1,"Aviate first : le contrôle de l’aéronef reste prioritaire."],["En cas de panne de communication, le code 7600…",["Signale la panne de communication","Signale toujours une détresse","Remplace toutes les procédures","Est interdit en IFR"],0,"7600 signale une panne de communication au système de surveillance."],["Le message de détresse doit notamment contenir…",["Uniquement le nom du pilote","Les informations nécessaires à l’assistance et à la localisation","Uniquement la météo","Seulement l’altitude"],1,"La structure du message fournit les éléments nécessaires aux services de secours et ATS."],["Le terme ‘readback’ correspond à…",["La répétition d’une information reçue","Un test moteur","Une procédure météo","Un changement de plan de vol"],0,"Le readback confirme notamment les éléments critiques d’une clairance."],["Une communication VHF peut être limitée par…",["Le relief et l’horizon","Uniquement la couleur de l’avion","Le carburant restant","Le centrage uniquement"],0,"Le relief et la géométrie de visibilité directe peuvent limiter la portée."],["Un message reçu d’un service ATS est automatiquement…",["Une clairance","Une information météo","À interpréter selon sa nature et son contenu","Un message de détresse"],2,"Une information ne doit pas être transformée en clairance par interprétation."],["Le principal objectif de la phraséologie standard est…",["Rendre les échanges plus longs","Réduire les ambiguïtés et erreurs d’interprétation","Éviter les readbacks","Supprimer les indicatifs"],1,"La phraséologie standardise les échanges et réduit les ambiguïtés."],["Dans une transmission, une fréquence doit être…",["Transmise et interprétée selon les règles de transmission des nombres","Toujours dite en anglais courant","Remplacée par l’indicatif","Ignorée après réception"],0,"Les fréquences suivent des règles de transmission standardisées."],["La portée VHF dépend notamment…",["De la hauteur des antennes et de la géométrie","Uniquement de l’immatriculation","Uniquement de la température","Uniquement du QNH"],0,"La hauteur et l’horizon radio sont déterminants pour une communication VHF."],["Un système data link est…",["Un moyen de communication numérique","Un type de radar primaire","Un Q-code","Un type de transpondeur uniquement"],0,"Le data link permet des échanges numériques selon le système et les procédures."],["La règle essentielle lors d’une communication critique est de…",["Privilégier la clarté et la vérification","Parler le plus vite possible","Éviter tout readback","Changer de fréquence sans instruction"],0,"La clarté et la confirmation des informations critiques sont fondamentales."],["QNE correspond à…",["Un réglage altimétrique standard 1013,25 hPa","Un code de détresse","Un relèvement vrai vers la station","Un réglage donnant la hauteur au-dessus du terrain"],0,"QNE d function escATPL(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function modFocusATPL(m){
  const f={
    "010":"En droit aérien, raisonne toujours dans cet ordre : source de la règle → champ d’application → acteur responsable → conditions → action ou conséquence opérationnelle → publication à vérifier. Distingue soigneusement le cadre international ICAO, le droit de l’Union européenne, les AMC/GM et l’information opérationnelle publiée dans l’AIP ou par NOTAM.",
    "021":"Dans les systèmes, raisonne toujours en chaîne d'énergie et d'information : source → distribution → conversion → utilisation → protection. Une panne doit être suivie jusqu'à son effet observable et jusqu'aux moyens de détection ou de secours.",
    "022":"Pour un instrument, sépare systématiquement grandeur physique → capteur/source → calcul ou transmission → affichage → erreurs et conséquences. C'est cette chaîne qui permet de comprendre une indication anormale.",
    "031":"Chaque problème de centrage se résout par conservation des moments : définir le datum, lister les masses, calculer les moments, trouver le CG, puis comparer aux limites. Ensuite seulement on interprète l'effet sur stabilité et performances.",
    "032":"Une performance n'est jamais un chiffre isolé : elle dépend de la masse, de la configuration, de l'altitude-densité, du vent, de la piste, des obstacles et du moteur disponible. Le raisonnement ATPL consiste à identifier d'abord les conditions, puis la distance ou le gradient pertinent.",
    "033":"Une préparation de vol est une chaîne : données publiées → météo/espaces → route → vent → temps et carburant → alternatives → vérifications avant départ. Une modification en vol oblige à recalculer la suite du vol, pas seulement le prochain point.",
    "040":"Les facteurs humains se comprennent par interactions : personne, équipage, environnement, procédure et organisation. En situation réelle, l'objectif est de détecter les menaces et les erreurs assez tôt pour éviter qu'elles ne deviennent un état non souhaité.",
    "050":"En météo, pars toujours de la physique : pression et température déterminent la densité ; humidité et stabilité déterminent nuages et convection ; fronts et relief organisent les mouvements de l'air. Relie ensuite le phénomène à sa conséquence opérationnelle.",
    "061":"En navigation, distingue toujours référence, direction, distance et vitesse : nord vrai/magnétique, heading/track, TAS/GS, bearing/route. Une petite confusion de vocabulaire peut produire une erreur de plusieurs milles ou degrés.",
    "062":"Pour une aide radio, suis la chaîne émission → propagation → réception → traitement → indication. Puis demande-toi ce qui change avec la distance, l'altitude, la fréquence, les obstacles ou une défaillance.",
    "070":"Les procédures opérationnelles se lisent comme des conditions d'utilisation : prérequis → limites → procédure normale → surveillance → action en cas d'écart. L'objectif est de savoir quand une règle s'applique et quelle décision elle entraîne.",
    "081":"En aérodynamique, relie chaque formule à une cause physique. Une variation de vitesse, densité, incidence, configuration ou facteur de charge doit toujours être traduite en variation de portance, traînée, stabilité ou performance.",
    "090":"Une communication aéronautique est une boucle fermée : écouter → comprendre → transmettre → readback → hearback → exécuter → vérifier. Les mots de procédure réduisent l'ambiguïté lorsque la charge de travail augmente."
  };
  return f[m]||"Relie la définition, le mécanisme physique ou opérationnel, puis la conséquence observable en vol. Une notion ATPL est réellement maîtrisée lorsque tu peux expliquer pourquoi elle existe et prédire ce qui se passe si une variable change.";
}
function termListATPL(m,c){
  const db=ATPL_TERM_DB[m]||[];
  const hay=(c.t+" "+c.cours.map(x=>x[0]+" "+x[1]).join(" ")).toLowerCase();
  let found=db.filter(x=>hay.includes(x[0].toLowerCase()));
  if(found.length<6) found=db.slice(0,Math.min(8,db.length));
  return found.slice(0,10);
}

function deepExplanationATPL(m,c,sec,i){
  const raw=sec[1]||"", title=sec[0]||"";
  const base=modFocusATPL(m);
  if(m==="010") return {
    p1:raw,
    p2:`Lecture ATPL : pour « ${title} », commence par identifier la source et le champ d’application. Demande ensuite qui porte la responsabilité, quelles conditions déclenchent la règle et quelle conséquence opérationnelle en découle.`,
    p3:`À l’examen, ne choisis pas une réponse parce qu’elle « semble prudente » : rattache-la au cadre ICAO/UE ou à la publication opérationnelle réellement applicable. ${base}`
  };
  const modText={
  "021":`Dans ce chapitre, l'objet technique doit être vu comme un ensemble fonctionnel. Une source fournit une énergie ou une information, celle-ci est distribuée puis transformée avant d'atteindre un consommateur. Les protections et redondances sont essentielles parce qu'une panne n'est pas seulement « un élément qui s'arrête » : elle peut provoquer une cascade d'effets, une indication anormale, une perte de capacité ou le basculement automatique sur une voie de secours. L'approche ATPL consiste donc à identifier le fonctionnement normal, les principales sources de panne, la détection et les conséquences opérationnelles.`,
  "022":`La difficulté des instruments vient du fait que l'équipage ne voit jamais directement la grandeur physique : il voit une indication produite par une chaîne de mesure. Il faut donc savoir quelle pression, température, accélération, référence magnétique ou information de navigation est utilisée, comment elle est transformée, et comment une erreur de capteur se manifeste. Une indication peut être fausse sans être immédiatement incohérente ; la comparaison entre sources indépendantes est alors fondamentale.`,
  "031":`Le centrage est un problème de mécanique : les masses créent des moments autour d'un datum. La somme des moments détermine la position du centre de gravité. En exploitation, le calcul ne s'arrête pas au chiffre du CG : une position différente modifie la stabilité, les efforts de commande, le trim et donc la performance. Il faut toujours distinguer ce qui change la masse totale de ce qui ne fait que déplacer une masse à l'intérieur de l'avion.`,
  "032":`Une performance certifiée est le résultat d'un ensemble de conditions précises. Une variation de température, de masse, de vent, de pente de piste ou de configuration change la distance ou le gradient disponible. C'est pourquoi les vitesses V1, VR, V2 et les distances TORA/TODA/ASDA/LDA ne doivent pas être apprises comme des nombres isolés : elles appartiennent à une logique de décision et de trajectoire. En examen, commence par identifier la phase du vol et la variable recherchée.`,
  "033":`La préparation de vol transforme des informations dispersées en une stratégie cohérente. La route doit être compatible avec les espaces et publications, le vent transforme le cap en route et la TAS en GS, puis le temps de vol détermine la consommation. Enfin, le carburant disponible doit rester compatible avec les réserves et les alternatives. Une bonne méthode est de recalculer chaque segment dans le même ordre pour éviter de mélanger une donnée vraie, magnétique ou sol.`,
  "040":`Les facteurs humains ne sont pas un sujet séparé de l'exploitation : ils expliquent pourquoi une procédure correcte peut être mal appliquée. Une charge de travail élevée, une fatigue, une interruption, une information ambiguë ou une mauvaise coordination peuvent dégrader la perception de la situation. Le cadre TEM permet de chercher les menaces et erreurs avant qu'elles ne franchissent les barrières de sécurité ; le CRM ajoute la coordination entre personnes, procédures et ressources.`,
  "050":`La météorologie devient utile au pilote lorsqu'elle est convertie en conséquences. Une différence de température et de point de rosée renseigne sur la saturation ; la stabilité indique le type de convection ; le gradient de pression renseigne sur le vent ; les fronts organisent les nuages et précipitations. Il faut ensuite relier le phénomène au vol : visibilité, plafond, turbulence, givrage, cisaillement, performances ou possibilité de déroutement.`,
  "061":`La navigation générale repose sur des définitions qui doivent rester séparées : la position est donnée par latitude/longitude, la direction peut être exprimée par cap ou route, le relèvement décrit une direction vers une référence, et la vitesse peut être vraie ou sol. Les calculs deviennent beaucoup plus fiables lorsqu'on écrit explicitement la référence utilisée à chaque étape et qu'on effectue un contrôle de cohérence avec la carte ou la trajectoire prévue.`,
  "062":`La radionavigation est une application de la physique des ondes. Une station émet un signal, celui-ci se propage avec des limites de portée et des erreurs possibles, puis le récepteur transforme le signal en information exploitable. Les différents systèmes n'utilisent pas la même grandeur : certains donnent un relèvement, d'autres une distance, d'autres encore un guidage latéral/vertical ou une position calculée. Comprendre cette chaîne permet de prévoir les effets d'une perte de signal ou d'une mauvaise géométrie.`,
  "070":`Une règle opérationnelle prend son sens lorsqu'on sait à quelle situation elle s'applique et quelle décision elle impose. En préparation, il faut vérifier les limites et les conditions ; en vol, surveiller que ces conditions restent vraies ; en cas d'écart, appliquer la procédure correspondante et réévaluer la situation. Cette logique évite d'appliquer mécaniquement une règle apprise hors de son contexte.`,
  "081":`L'aérodynamique relie directement la physique de l'écoulement au comportement de l'avion. La densité et la vitesse déterminent la pression dynamique, l'incidence et la configuration déterminent les coefficients aérodynamiques, puis portance et traînée déterminent les accélérations et les performances. À l'ATPL, la formule est donc le début du raisonnement : il faut pouvoir expliquer pourquoi une variation de vitesse, de poids, de facteur de charge ou de configuration produit l'effet observé.`,
  "090":`Une communication aéronautique efficace est une procédure de gestion de l'information. Le pilote doit identifier qui parle, quelle instruction est donnée, quelles parties nécessitent un readback et quelle action en découle. En situation urgente ou de détresse, la priorité est de transmettre l'information utile sans ambiguïté et de maintenir la boucle de communication. Les mots de procédure servent précisément à réduire les erreurs lorsque la charge de travail est forte.`
  };
  const a=modText[m]||base;
  return {p1:raw,p2:a,p3:`Application ATPL — ${base}`};
}
function scenarioATPL(m,c){
  const s={
  "010":"Avant un vol international, l’équipage ne se contente pas d’une règle apprise : il vérifie les publications en vigueur, les NOTAM, les procédures ATS et les éventuelles différences ou dispositions nationales. En cas de conflit apparent, il faut identifier la source juridiquement applicable et la procédure opérationnelle publiée plutôt que raisonner par habitude.",
  "021":"En croisière, une alarme indique la perte d'une source système. Avant d'agir, identifie la fonction réellement perdue, vérifie les indications indépendantes, applique la procédure QRH/AFM applicable et surveille la voie de secours. Le bon réflexe n'est pas de mémoriser une action unique, mais de comprendre la chaîne source → distribution → consommateur.",
  "022":"Un paramètre affiché devient incohérent avec une autre source. Compare les indications, identifie quelle chaîne de mesure alimente chacune et cherche une défaillance commune ou indépendante. Une seule indication isolée ne suffit pas toujours à conclure.",
  "031":"Après modification du chargement, la masse totale reste dans la limite mais le CG se rapproche de la limite arrière. Le vol n'est pas automatiquement acceptable : il faut vérifier l'enveloppe de centrage et les conséquences sur stabilité, trim et performances.",
  "032":"Par journée chaude et piste humide, la masse est proche de la limite. Le raisonnement consiste à intégrer température, altitude-densité, état de piste, vent, obstacle et masse avant de conclure sur la performance disponible.",
  "033":"Un vent réel est différent de la prévision après le départ. Recalcule la GS et l'ETE, puis compare le carburant restant aux besoins jusqu'à destination et aux réserves. Si la marge devient insuffisante, le déroutement se décide avant que la situation ne devienne critique.",
  "040":"Une interruption survient pendant une approche déjà chargée. L'équipage doit reconnaître la menace, répartir les tâches, verbaliser les intentions et conserver des marges. Le TEM transforme un risque diffus en actions concrètes de prévention.",
  "050":"Une arrivée est prévue avec température élevée, point de rosée proche et vent variable. Vérifie les risques de brume/brouillard, cisaillement et dégradation de performance, puis compare les options avant l'engagement de l'approche.",
  "061":"Une dérive augmente progressivement malgré un cap inchangé. Compare heading et track, identifie la composante de vent et recalcule la correction de vent plutôt que de modifier le cap au hasard.",
  "062":"Une aide de navigation devient intermittente. Vérifie l'identification, la cohérence avec les autres sources, la géométrie et les éventuels facteurs de propagation. Une perte de signal doit être traitée comme une perte d'information, pas seulement comme une panne d'affichage.",
  "070":"Une condition opérationnelle change avant une étape importante. Reviens aux prérequis, limites et minima applicables ; si une condition n'est plus satisfaite, la stratégie doit être réévaluée selon les procédures de l'exploitant.",
  "081":"En virage serré, l'avion ralentit et le facteur de charge augmente. La vitesse de décrochage augmente avec sqrt(n) : il faut comprendre que l'incidence critique reste le mécanisme du décrochage, tandis que la vitesse nécessaire pour éviter cette incidence augmente.",
  "090":"Une instruction ATC est reçue dans une phase chargée. Écoute jusqu'au bout, identifie les éléments à readback, répète-les clairement et vérifie l'action avant de quitter la fréquence. En cas de doute, demande une clarification plutôt que d'inférer."
  };
  return s[m]||"Traduis la notion en situation de vol : quelles informations sont disponibles, quelle variable change, quelle conséquence apparaît et quelle action permet de conserver une marge de sécurité ?";
}

function cidx(m,c){ return Math.max(0,(m.d||[]).indexOf(c)); }
function numericATPL(m,c){
  const h=(c.t+" "+c.cours.map(x=>x[0]+" "+x[1]).join(" ")).toLowerCase();
  const E=(title,meta,steps,result,trap)=>({title,meta,steps,result,trap});
  if(m.c==="031"){
    if(/pesée/.test(h)) return E("Déterminer le CG après pesée","Avion : masse avant = 1 850 kg à 12,0 m ; masse arrière = 650 kg à 18,0 m. Référence : même datum.",["M = 1 850×12 + 650×18 = 33 000 kg·m","m = 1 850+650 = 2 500 kg","CG = 33 000/2 500 = 13,20 m"],"CG = 13,20 m du datum. Il faut ensuite comparer cette position à l'enveloppe de centrage applicable.","Ne pas diviser un moment par une seule masse ; utiliser la masse totale et conserver les mêmes unités de bras.");
    return E("Chargement et centrage","Masse de base 2 400 kg, CG à 11,5 m. On ajoute 120 kg de fret à 16,0 m.",["Moment initial = 2 400×11,5 = 27 600 kg·m","Moment fret = 120×16 = 1 920 kg·m","Masse finale = 2 520 kg ; moment final = 29 520 kg·m","CG final = 29 520/2 520 = 11,714 m"],"Le fret arrière déplace le CG de 11,50 à 11,71 m : le signe et la position du bras comptent autant que la masse.","Une masse supplémentaire ne se traduit pas automatiquement par le même déplacement du CG : il faut recalculer le moment total.");
  }
  if(m.c==="032"){
    if(/montée|gradient/.test(h)) return E("Gradient de montée","ROC = 900 ft/min ; TAS = 120 kt.",["120 kt = 120×101,27 = 12 152 ft/min de distance horizontale","Gradient = 900/12 152 = 0,0741","En pourcentage : 7,41 %"],"Le gradient est ≈ 7,4 %. Pour une trajectoire obstacle, c'est le gradient qui relie directement gain d'altitude et distance horizontale.","Ne pas diviser 900 ft/min par 120 sans convertir les nœuds en ft/min.");
    if(/atterrissage/.test(h)) return E("Vitesse et énergie à l'atterrissage","VREF = 70 kt. On compare l'énergie cinétique à 70 kt et 77 kt.",["L'énergie cinétique varie comme V²","Rapport = (77/70)² = 1,21","À 77 kt, l'énergie est donc ≈ 21 % supérieure"],"Une hausse apparemment faible de vitesse augmente fortement l'énergie à dissiper, ce qui explique l'effet sur la distance d'atterrissage.","Ne pas appliquer une proportionnalité linéaire à l'énergie : elle dépend du carré de la vitesse.");
    return E("Altitude-densité : raisonnement numérique","Élévation 2 000 ft ; température ISA locale 11 °C ; température réelle 29 °C. Approximation : +120 ft d'altitude-densité par °C au-dessus de l'ISA.",["Écart T = 29−11 = 18 °C","Correction ≈ 18×120 = 2 160 ft","Altitude-densité ≈ 2 000+2 160 = 4 160 ft"],"L'avion se comporte approximativement comme s'il était à 4 160 ft : densité plus faible et performances de décollage/ montée dégradées.","Cette règle est une approximation pédagogique ; en exploitation, utiliser les données de performance approuvées.");
  }
  if(m.c==="033"){
    if(/carburant|fuel/.test(h)) return E("Devis carburant","Étape : 180 NM ; GS = 120 kt ; consommation = 36 L/h. On ajoute 45 min de réserve.",["ETE = 180/120 = 1,50 h = 1 h 30","Carburant route = 1,50×36 = 54 L","Réserve = 0,75×36 = 27 L","Besoin total = 81 L"],"Il faut prévoir au minimum 81 L pour route + réserve, avant toute marge ou carburant réglementaire supplémentaire applicable.","Une réserve en minutes doit être convertie en heures avant de la multiplier par un débit en L/h.");
    return E("Vitesse sol avec vent","TAS = 120 kt ; vent de face 20 kt, composante exactement alignée avec la route.",["GS = TAS − vent de face","GS = 120−20 = 100 kt","Pour 150 NM : ETE = 150/100 = 1,50 h"],"ETE = 1 h 30. Le vent modifie le temps et donc directement le carburant consommé.","Le vent de face ne se soustrait à la TAS que pour sa composante sur la route ; un vent de travers nécessite le triangle des vitesses.");
  }
  if(m.c==="040") return E("Charge de travail et capacité","Une tâche nominale demande 70 unités de capacité ; trois interruptions ajoutent 10 unités chacune. Capacité disponible : 100.",["Charge totale = 70 + 3×10 = 100","Marge = 100−100 = 0","Toute nouvelle interruption crée une surcharge"],"La marge est nulle : le problème n'est pas une 'faiblesse' mathématique mais l'absence de capacité résiduelle pour absorber un événement supplémentaire.","Ce modèle est pédagogique et non une mesure physiologique réelle : ne pas lui attribuer une précision clinique.");
  if(m.c==="050"){
    if(/vent/.test(h)) return E("Composante de vent de face","Vent 30 kt, angle 60° par rapport à la route.",["Composante face = 30×cos60°","= 30×0,5 = 15 kt","Composante travers = 30×sin60° ≈ 26,0 kt"],"Le vent apporte 15 kt de composante de face et environ 26 kt de travers.","Utiliser cos pour la composante alignée et sin pour la composante perpendiculaire lorsque l'angle est mesuré par rapport à la route.");
    if(/thermodynamique/.test(h)) return E("Conversion de température","Température extérieure = 20 °C.",["T(K) = 20+273,15","= 293,15 K"],"La température absolue est 293,15 K.","Les lois des gaz utilisent la température absolue en kelvins, pas les degrés Celsius.");
    if(/précipitations/.test(h)) return E("Intensité de précipitation","Un pluviomètre mesure 12 mm en 30 min.",["Intensité = 12/0,5 h","= 24 mm/h"],"L'intensité moyenne est 24 mm/h.","30 min = 0,5 h avant de calculer une intensité en mm/h.");
    if(/masses d'air|fronts/.test(h)) return E("Déplacement d'un front","Un front progresse à 25 kt pendant 2 h.",["Distance = 25×2 = 50 NM","En km : 50×1,852 = 92,6 km"],"Le front se déplace d'environ 50 NM, soit 92,6 km.","La vitesse du système météo et la vitesse de l'avion sont deux choses distinctes.");
    if(/systèmes de pression/.test(h)) return E("Gradient de pression simplifié","Deux points sont séparés de 60 NM et présentent 12 hPa d'écart.",["Gradient = 12/60 = 0,20 hPa/NM"],"Le gradient moyen est 0,20 hPa/NM : un gradient plus fort est associé à un vent géostrophique plus important dans les hypothèses correspondantes.","Un gradient de pression n'est pas directement une vitesse de vent : la relation dépend aussi de la latitude et des forces en jeu.");
    if(/climatologie/.test(h)) return E("Moyenne climatique","Températures mensuelles : 12, 14, 16 et 18 °C.",["Somme = 60 °C","Moyenne = 60/4 = 15 °C"],"La moyenne de la série est 15 °C.","Une moyenne climatologique décrit une statistique de référence, pas une prévision du jour.");
    if(/dangers pour le vol/.test(h)) return E("Temps avant cisaillement","Un aéronef parcourt 6 NM avant une zone de cisaillement à 120 kt.",["Temps = 6/120 h","= 0,05 h = 3 min"],"La zone sera atteinte dans environ 3 min si la vitesse sol reste constante.","Le temps restant dépend de la vitesse sol réelle, pas seulement de la TAS.");
    if(/informations météorologiques/.test(h)) return E("Évolution d'un METAR","Un METAR est renouvelé toutes les 30 min sur une période de 3 h.",["Nombre d'intervalles = 3 h / 0,5 h","= 6 intervalles"],"Cela représente 6 intervalles de renouvellement dans le modèle donné.","La périodicité d'un produit n'est pas une garantie qu'un phénomène change exactement entre deux émissions.");
    if(/atmosphère|température|isa/.test(h)) return E("Température ISA","À 5 000 ft, température ISA au niveau mer 15 °C et gradient −2 °C/1 000 ft.",["Écart d'altitude = 5×1 000 ft","ΔT = 5×(−2) = −10 °C","TISA = 15−10 = 5 °C"],"La température ISA à 5 000 ft est 5 °C. La valeur réelle doit ensuite être comparée à l'ISA pour le raisonnement de densité et de performances.","Utiliser −2 °C/1 000 ft dans cette couche ISA et non une valeur inventée pour la stratosphère.");
    if(/pression|altitude/.test(h)) return E("QNH et altitude-pression","QNH = 1003 hPa ; différence par rapport à 1013 hPa = −10 hPa. Approximation : 27 ft/hPa.",["Écart = −10 hPa","Correction ≈ −10×27 = −270 ft","Une pression plus basse que 1013 hPa implique une altitude-pression supérieure à l'altitude géométrique de référence"],"L'ordre de grandeur de la correction est 270 ft. En exploitation, appliquer la méthode et les références enseignées par le cours et les instruments utilisés.","Le signe est essentiel : pression plus basse → altitude-pression plus élevée, toutes choses égales par ailleurs.");
    return E("Spread température / point de rosée","Température = 18 °C ; point de rosée = 16 °C.",["Spread = T−Td = 18−16 = 2 °C","Le spread est faible","À refroidissement suffisant, la saturation est atteinte plus facilement"],"Un spread de 2 °C indique une humidité proche de la saturation : le risque de brume/nuages bas doit être examiné avec les autres paramètres météo.","Un petit spread ne signifie pas automatiquement brouillard : il faut aussi considérer vent, refroidissement, relief et structure de la masse d'air.");
  }
  if(m.c==="061"){
    if(/in-flight navigation/.test(h)) return E("ETE avec GS observée","Un avion parcourt 80 NM en 40 min.",["40 min = 2/3 h","GS = 80/(2/3) = 120 kt"],"La vitesse sol observée est 120 kt.","Calculer une GS à partir d'un temps réellement mesuré permet de détecter une différence avec la prévision.");
    if(/magnetism|compass/.test(h)) return E("Variation magnétique","Cap vrai = 085°. Variation = 7°E. Convention : Cm = Cv − variation.",["Cm = 85−7","= 078°"],"Le cap magnétique est 078° selon cette convention.","Le signe de la variation est conventionnel : toujours utiliser la relation donnée par le cours ou la carte.");
    if(/charts/.test(h)) return E("Échelle cartographique","Sur une carte 1:250 000, une distance mesurée est 6,0 cm.",["Distance = 6×250 000 cm","= 1 500 000 cm","= 15 km ≈ 8,10 NM"],"La distance est 15 km, soit environ 8,1 NM.","À 1:250 000, 1 cm représente 2,5 km.");
    if(/dead reckoning/.test(h)) return E("DR : distance et temps","TAS = 100 kt ; vent arrière 20 kt aligné avec la route ; distance = 180 NM.",["GS = 100+20 = 120 kt","ETE = 180/120 = 1,5 h","= 1 h 30"],"Le temps de route est 1 h 30 dans ce cas aligné.","Une composante de vent arrière s'ajoute à la TAS pour obtenir la GS.");
    if(/dérive|dead reckoning|in-flight|wind/.test(h)) return E("Correction de dérive — règle 1:60","Après 60 NM, l'avion est 2 NM à droite de la route prévue.",["Erreur angulaire ≈ 2/60 rad","En degrés : 2×60/60 = 2°","Correction initiale pratique ≈ 2° vers la route, puis correction de retour selon la méthode utilisée"],"L'écart représente environ 2° de dérive latérale sur 60 NM. La règle 1:60 donne un ordre de grandeur rapide à vérifier par les méthodes de navigation applicables.","Ne pas confondre l'angle d'erreur avec une correction permanente de cap sans tenir compte du vent et de la phase de vol.");
    return E("Distance sur la carte","Une route mesure 8,4 cm sur une carte au 1:500 000.",["Distance réelle = 8,4×500 000 cm","= 4 200 000 cm = 42 000 m","= 42 km ≈ 22,7 NM"],"La distance est ≈ 22,7 NM. La conversion finale en NM doit être contrôlée, car les temps de vol et consommations utilisent souvent des unités nautiques.","Au 1:500 000, 1 cm représente 5 km ; c'est un excellent contrôle mental du résultat.");

    if(/basic radio propagation|propagation/.test(h)) return E("Temps de propagation radio","Une onde parcourt 300 km ; c ≈ 300 000 km/s.",["t = d/c = 300/300 000 s","= 0,001 s","= 1 ms"],"Le temps de propagation est d'environ 1 ms.","Conserver les mêmes unités de distance et vitesse avant de diviser.");
    if(/radar/.test(h)) return E("Portée radar et temps aller-retour","Une impulsion radar revient après 100 µs. c ≈ 300 000 km/s.",["100 µs = 0,0001 s","Distance aller-retour = c×t = 30 km","Distance cible = 30/2 = 15 km"],"La cible est à environ 15 km : le facteur 1/2 vient du trajet aller-retour.","Oublier le facteur 1/2 est un piège classique.");
    if(/area navigation|rnav|fms/.test(h)) return E("RNAV : erreur de position","Position calculée : 50,00 NM ; position de référence : 50,80 NM.",["Erreur = 0,80 NM","Erreur relative = 0,80/50 = 1,6 %"],"L'écart est de 0,80 NM, soit 1,6 % de la distance de référence.","Une erreur de position doit être comparée à la tolérance de la spécification applicable, pas seulement jugée 'petite'.");
    if(/global navigation|gnss/.test(h)) return E("GNSS : géométrie simplifiée","Un récepteur utilise 4 satellites et calcule une position avec une incertitude horizontale estimée de 8 m.",["Incertitude donnée = 8 m","En NM : 8/1852 ≈ 0,0043 NM"],"8 m correspondent à environ 0,0043 NM.","Une précision de position n'est pas synonyme de précision de navigation utilisable : vérifier l'intégrité et les exigences opérationnelles.");
    if(/pbn/.test(h)) return E("PBN : tolérance de navigation","Une spécification impose une précision latérale de 1 NM. Une erreur estimée est 0,6 NM.",["Marge = 1,0−0,6 = 0,4 NM","Utilisation de la marge = 60 % de la tolérance"],"L'erreur donnée reste inférieure à 1 NM dans cet exemple pédagogique.","La valeur numérique seule ne suffit pas : il faut vérifier la spécification, l'intégrité et les conditions d'utilisation.");
    if(/dme/.test(h)) return E("Distance DME et slant range","L'avion est à 8 000 ft au-dessus de la station et le DME indique 5,0 NM.",["8 000 ft = 1,316 NM verticalement","Distance horizontale = √(5²−1,316²)","≈ √23,268 = 4,82 NM"],"La distance horizontale est ≈ 4,82 NM. Le DME mesure une distance oblique (slant range), surtout notable à faible distance de la station avec une grande différence d'altitude.","Près de la station, l'indication DME n'est pas exactement la distance horizontale : c'est la distance oblique.");
    if(/ils|glide/.test(h)) return E("Pente ILS","Un avion est à 3,0 NM du seuil sur un glide path nominal de 3°.",["Altitude théorique ≈ distance × tan(3°)","3 NM = 18 228 ft","18 228×tan(3°) ≈ 955 ft","Ajouter l'altitude du seuil pour obtenir l'altitude géométrique correspondante"],"L'ordre de grandeur est ≈ 955 ft au-dessus de l'altitude du seuil à 3 NM sur un plan de 3°. Les données publiées de la procédure restent la référence opérationnelle.","Ne pas utiliser 3° comme 3 % : l'angle et le gradient sont deux grandeurs différentes.");
    return E("VOR : différence angulaire","Le radial sélectionné est 090°. Le récepteur indique un écart de 20° entre le radial de référence et l'orientation sélectionnée.",["Radial = direction magnétique depuis la station","090° signifie est depuis la station","L'indication TO/FROM et le CDI doivent être interprétés ensemble"],"La valeur 090° décrit une position angulaire par rapport à la station, pas le cap à prendre automatiquement.","Radial VOR ≠ cap avion : le radial est une référence géographique centrée sur la station.");
  }
  if(m.c==="022"){
    if(/magnétisme|compas|flux/.test(h)) return E("Erreur de compas et virage","Cap magnétique indiqué = 090°. Une déviation locale de +3° est appliquée selon la convention donnée.",["Lecture corrigée = 090°+3°","= 093°"],"La correction donne 093° dans cette convention. Le signe doit toujours être déduit de la convention de la question ou de la carte de déviation.","Ne pas appliquer E/W automatiquement : le signe dépend de la convention utilisée.");
    if(/gyroscopiques/.test(h)) return E("Dérive d'un gyroscope","Un gyroscope dérive de 0,5°/h. Après 3 h sans recalage :",["Erreur = 0,5×3","= 1,5°"],"L'erreur théorique accumulée est 1,5°. Les systèmes réels utilisent des références et recalages pour limiter cette dérive.","Une dérive en °/h doit être multipliée par le temps en heures.");
    if(/référence|inertielle/.test(h)) return E("Déplacement inertiel simplifié","Une vitesse constante de 120 m/s est maintenue pendant 30 s sur un axe.",["Distance = V×t","= 120×30 = 3 600 m","= 3,6 km"],"Dans ce modèle sans accélération ni erreur, le déplacement est de 3,6 km.","Un système inertiel réel intègre les erreurs de position et d'accélération ; ce calcul illustre seulement l'intégration de base.");
    if(/contrôle de vol|autopilot|automatiques/.test(h)) return E("Erreur de suivi d'altitude","Altitude commandée = 3 000 ft ; altitude indiquée = 2 850 ft.",["Erreur = 3 000−2 850","= +150 ft","Le système doit interpréter l'écart selon son mode de contrôle"],"L'écart est de 150 ft. L'action du pilote dépend du mode engagé et des limites/procédures applicables.","Ne pas supposer qu'une erreur d'indication équivaut à une panne du pilote automatique : identifier d'abord la chaîne de mesure.");
    if(/automanette|poussée/.test(h)) return E("Erreur de poussée","Poussée commandée = 85 % ; poussée indiquée = 78 %.",["Écart = 85−78 = 7 points de pourcentage","Écart relatif ≈ 7/85 = 8,2 %"],"La poussée indiquée est inférieure de 7 points, soit environ 8,2 % de la consigne.","Points de pourcentage et pourcentage relatif ne sont pas la même chose.");
    if(/communication/.test(h)) return E("Débit binaire","Une liaison transmet 12 000 bits en 3 s.",["Débit = 12 000/3","= 4 000 bit/s"],"Le débit est 4 kbit/s.","Bits et octets ne sont pas interchangeables : 8 bits = 1 octet.");
    if(/fms/.test(h)) return E("Erreur de distance FMS","Distance prévue = 420 NM ; distance recalculée = 398 NM.",["Écart = 420−398 = 22 NM","Erreur relative = 22/420 ≈ 5,24 %"],"Le calcul montre une différence de 22 NM, soit environ 5,2 %. Il faut ensuite identifier la source de cette différence avant toute action.","Une différence de calcul n'est pas automatiquement une erreur système : vérifier données, procédure et référence.");
    if(/alerte|proximité/.test(h)) return E("Temps avant conflit","Deux trajectoires convergent avec une séparation de 3 NM et une vitesse de rapprochement de 180 kt.",["Temps = distance/vitesse = 3/180 h","= 0,0167 h","≈ 1,0 min"],"Le temps théorique avant rencontre est d'environ 1 minute si la vitesse de rapprochement reste constante.","Utiliser la vitesse de rapprochement, pas la vitesse d'un seul avion.");
    if(/affichage électronique|maintenance|enregistrement|numériques|calculateurs/.test(h)) return E("Échantillonnage numérique","Un capteur est échantillonné à 100 Hz pendant 12 s.",["Nombre d'échantillons = 100×12","= 1 200"],"Le système acquiert 1 200 échantillons dans ce modèle idéal.","Fréquence en Hz = échantillons par seconde.");
    if(/pressure|pression|airspeed|vitesse/.test(h)) return E("Pression dynamique et vitesse","ρ = 1,225 kg/m³ ; vitesse = 60 m/s. On utilise q = ½ρV².",["V² = 3 600 m²/s²","q = 0,5×1,225×3 600","q = 2 205 Pa"],"La pression dynamique vaut 2 205 Pa. Comme q varie avec V², une variation de vitesse produit un effet non linéaire sur la pression dynamique.","Ne pas oublier le facteur 1/2 et utiliser la vitesse en m/s si ρ est en kg/m³.");
    return E("Conversion de pression","Une pression est indiquée à 29,92 inHg. 1 inHg ≈ 33,8639 hPa.",["p = 29,92×33,8639","p ≈ 1013,25 hPa"],"29,92 inHg correspond approximativement à 1013,25 hPa, valeur ISA au niveau mer.","Ne pas inverser le facteur de conversion inHg ↔ hPa.");
  }
  if(m.c==="081"){
    if(/décrochage|facteur de charge|virage/.test(h)) return E("Vitesse de décrochage en virage","Vs1g = 50 kt ; facteur de charge n = 2.",["Vs(n) = Vs1g×√n","Vs = 50×√2","Vs ≈ 70,7 kt"],"À facteur de charge 2, la vitesse de décrochage augmente à environ 71 kt. L'incidence critique ne change pas simplement parce que l'avion est en virage ; c'est la portance requise et donc la vitesse nécessaire qui augmentent.","Ne pas multiplier 50 par 2 : la relation est en √n.");
    if(/traînée/.test(h)) return E("Traînée parasite et vitesse","Une composante de traînée varie comme V². Si elle vaut 400 N à 100 kt, quelle est sa valeur à 150 kt ?",["D₂/D₁ = (V₂/V₁)²","= (150/100)² = 2,25","D₂ = 400×2,25 = 900 N"],"La traînée parasite devient 900 N dans ce modèle simplifié. Cela illustre pourquoi elle augmente rapidement avec la vitesse.","Ce modèle concerne la composante parasite ; la traînée induite évolue dans le sens opposé avec la vitesse.");
    return E("Portance et vitesse","À masse et configuration constantes, la portance requise reste 10 000 N. La vitesse passe de 100 à 80 kt.",["L = ½ρV²SCL","Si L, ρ et S sont constants, CL ∝ 1/V²","CL₂/CL₁ = (100/80)² = 1,5625"],"À 80 kt, le coefficient de portance requis est environ 56 % plus élevé. Cela rapproche l'avion de l'incidence critique si les autres paramètres restent constants.","Ne pas conclure que la portance diminue simplement parce que la vitesse diminue : CL s'ajuste si l'avion reste en équilibre.");
  }
  if(m.c==="021"){
    if(/atterrisseurs|roues|pneumatiques|freins/.test(h)) return E("Énergie cinétique au freinage","Masse = 1 800 kg ; vitesse = 20 m/s. Modèle : E = ½mV².",["V² = 400 m²/s²","E = 0,5×1 800×400 = 360 000 J","E = 360 kJ"],"Le système de freinage doit dissiper environ 360 kJ dans ce modèle simplifié ; la température et la capacité d'absorption deviennent donc des considérations opérationnelles.","L'énergie dépend de V² : doubler la vitesse quadruple l'énergie à dissiper.");
    if(/pressurisation|conditionnement|pneumatiques/.test(h)) return E("Pression différentielle cabine","Pression extérieure = 300 hPa ; pression cabine = 750 hPa.",["Δp = 750−300","Δp = 450 hPa","La pression cabine est supérieure à la pression extérieure"],"La structure subit une différence de pression de 450 hPa dans ce modèle. Le calcul permet de relier pressurisation et contraintes structurales.","La pression différentielle est une différence : ne pas additionner les deux pressions.");
    if(/protection et détection/.test(h)) return E("Temps de détection","Un capteur effectue un cycle toutes les 2 s. Combien de cycles en 1 min ?",["60/2 = 30 cycles/min","Donc 30 cycles sont possibles en 60 s"],"La fréquence de contrôle est de 0,5 Hz dans cet exemple.","Une fréquence de 0,5 Hz correspond à une période de 2 s.");
    if(/têtes de rotor|pales|transmission/.test(h)) return E("Vitesse périphérique d'une pale","Rayon rotor = 5 m ; régime = 360 tr/min.",["ω = 2π×360/60 = 37,70 rad/s","V = ωr = 37,70×5 = 188,5 m/s","≈ 367 kt"],"La vitesse tangentielle théorique en bout de pale est ≈ 188,5 m/s.","La vitesse de rotation en tr/min doit être convertie en rad/s avant V=ωr.");
    if(/anti-givrage|dégivrage/.test(h)) return E("Énergie de chauffage anti-givrage","Un système consomme 6 kW pendant 5 min.",["5 min = 1/12 h","E = P×t = 6×1/12 = 0,5 kWh","Soit 500 Wh"],"Le système consomme 0,5 kWh sur cette durée, ce qui permet de relier puissance électrique et endurance énergétique d'une source.","Convertir les minutes en heures lorsque la puissance est exprimée en kW.");
    if(/moteurs à pistons/.test(h)) return E("Puissance mécanique","Couple = 250 N·m ; régime = 2 400 tr/min. P = Cω.",["ω = 2π×2 400/60 ≈ 251,3 rad/s","P ≈ 250×251,3 = 62 832 W","P ≈ 62,8 kW"],"La puissance mécanique est ≈ 62,8 kW dans ce modèle idéal.","Le régime en tr/min doit être converti en rad/s avant d'utiliser P=Cω.");
    if(/moteurs à turbines/.test(h)) return E("Débit massique et poussée","Un moteur fournit une poussée de 20 kN avec un débit carburant de 0,8 kg/s.",["Débit spécifique simplifié = 0,8/20 = 0,040 kg/(N·s)","Pour 20 000 N : 0,8/20 000 = 4,0×10⁻⁵ kg/(N·s)"],"Le résultat doit être interprété avec les conventions de TSFC utilisées par le cours et l'unité demandée par la question.","Toujours vérifier si le débit spécifique est exprimé par N, kN, heure ou seconde.");
    if(/oxygène/.test(h)) return E("Autonomie d'une bouteille d'oxygène","Volume disponible = 600 L ; débit = 40 L/min.",["Durée = 600/40 = 15 min","Soit 0,25 h"],"L'autonomie théorique est de 15 min avant prise en compte des marges et conditions réelles du système.","Une consommation en L/min doit être comparée à un volume en L, pas à un débit en L/h sans conversion.");
    if(/hydraul/.test(h)) return E("Force hydraulique","Pression hydraulique = 207 bar ; surface de piston = 10 cm².",["207 bar = 20,7 MPa = 20,7×10⁶ Pa","10 cm² = 0,001 m²","F = pA = 20,7×10⁶×0,001 = 20 700 N"],"La force théorique est 20,7 kN avant prise en compte des rendements et pertes.","Convertir cm² en m² : 10 cm² = 0,001 m², pas 0,01 m².");
    if(/électri/.test(h)) return E("Puissance électrique","Un bus fournit 28 V à une charge de 35 A.",["P = V×I","P = 28×35 = 980 W","≈ 0,98 kW"],"La charge absorbe environ 980 W dans ce modèle continu.","Vérifier si la question demande puissance électrique, énergie ou capacité : W, Wh et Ah ne sont pas interchangeables.");
    if(/carburant/.test(h)) return E("Débit carburant et autonomie","Débit = 180 kg/h ; carburant utilisable = 720 kg.",["Endurance = masse / débit","= 720/180 = 4,0 h"],"Endurance théorique = 4 h, avant réserves, limitations et carburant non utilisable éventuel.","L'autonomie réelle n'est pas automatiquement égale à l'endurance théorique : intégrer les réserves et conditions d'exploitation.");
    return E("Chaîne système : pression → force","Un actionneur reçoit 3 MPa sur une surface de 0,004 m².",["F = pA","F = 3 000 000×0,004","F = 12 000 N"],"La pression n'est pas une force : la force résultante dépend de la surface sur laquelle elle agit.","Toujours distinguer pression (Pa) et force (N).");
  }
  if(m.c==="090"){
    if(/general operating/.test(h)) return E("Débit vocal","Un message contient 48 mots et doit être transmis en 24 s.",["Débit = 48/24 = 2 mots/s","Soit 120 mots/min"],"Le débit moyen est 120 mots/min.","En radiotéléphonie, la clarté et la structure priment sur la vitesse brute.");
    if(/weather/.test(h)) return E("Visibilité et conversion","Visibilité reportée = 5 km. Conversion : 1 NM = 1,852 km.",["NM = 5/1,852","≈ 2,70 NM"],"5 km correspondent à environ 2,7 NM.","Ne pas confondre visibilité en km avec distance nautique.");
    if(/voice communication failure/.test(h)) return E("Temps d'un message","Un pilote doit transmettre 30 mots à 100 mots/min.",["Temps = 30/100 min","= 0,30 min","= 18 s"],"Le message dure environ 18 secondes à ce débit.","Le calcul donne une durée théorique : en cas de panne de communication, appliquer les procédures publiées, pas une improvisation.");
    if(/distress|urgency/.test(h)) return E("Priorité du message","Un message d'urgence comporte 36 mots transmis à 90 mots/min.",["Temps = 36/90 min","= 0,4 min","= 24 s"],"La transmission dure environ 24 s dans ce modèle.","Le calcul ne change pas la priorité ni la structure réglementaire du message.");
    if(/vhf propagation|allocation/.test(h)) return E("Longueur d'onde VHF","f = 125 MHz ; c ≈ 3×10⁸ m/s.",["λ = c/f","= 3×10⁸/(125×10⁶)","= 2,40 m"],"La longueur d'onde est d'environ 2,4 m.","MHz doit être converti en Hz.");
    return E("Fréquence et longueur d'onde VHF","Une fréquence VHF est 118 MHz. On utilise λ = c/f avec c ≈ 3×10⁸ m/s.",["f = 118×10⁶ Hz","λ = 3×10⁸ / 118×10⁶","λ ≈ 2,54 m"],"La longueur d'onde est ≈ 2,54 m. La fréquence élevée correspond donc à une longueur d'onde métrique dans cette bande.","Convertir MHz en Hz avant d'appliquer λ = c/f.");
  }
  if(m.c==="070"){
    if(/special operational|hazards/.test(h)) return E("Marge face à un danger","Une distance minimale publiée est 5 NM ; la trajectoire prévue passe à 6,2 NM.",["Marge = 6,2−5,0 = 1,2 NM","Marge relative = 1,2/5 = 24 %"],"La trajectoire se situe 1,2 NM au-delà de la valeur minimale dans cet exemple.","Une marge positive ne dispense pas de vérifier toutes les autres conditions et limites applicables.");
    if(/helicopter emergency/.test(h)) return E("Autonomie après panne","Un hélicoptère dispose de 90 kg de carburant utilisable et consomme 180 kg/h.",["Endurance = 90/180 = 0,5 h","= 30 min"],"L'endurance théorique est de 30 min avant les réserves et limitations applicables.","Ne pas confondre endurance théorique et temps disponible pour une manœuvre d'urgence.");
    if(/specialised operations/.test(h)) return E("Marge opérationnelle spécialisée","Une opération exige 12 min de marge ; le calcul disponible donne 15 min.",["Marge restante = 15−12 = 3 min","Marge relative = 3/12 = 25 %"],"Il reste 3 min au-delà du minimum de l'exemple.","Une marge calculée ne remplace jamais une limite ou une condition réglementaire.");
    return E("Marge opérationnelle","Une procédure impose une limite de 30 min. Une étape est estimée à 24 min.",["Marge = 30−24 = 6 min","Marge relative = 6/30 = 20 %"],"La marge disponible est de 6 min, soit 20 % de la limite. Une marge calculée n'autorise toutefois pas à dépasser une limite réglementaire ou opérationnelle.","Une marge n'est pas une permission de dépasser la limite : elle mesure seulement l'écart restant.");
  }
  return E("Calcul ATPL appliqué au chapitre","Donnée de travail : vitesse 120 kt, distance 180 NM, consommation 36 L/h.",["Temps = distance / vitesse = 180/120 = 1,50 h","Carburant = 1,50×36 = 54 L","Contrôle : 1 h 30 × 36 L/h = 54 L"],"Le résultat est 1 h 30 et 54 L. Relie toujours le nombre obtenu à la variable opérationnelle du chapitre.","Avant de calculer, vérifier les unités et identifier exactement ce que demande la question.");
}
function renderNumericATPL(m,c){
  if(m&&m.c==="010") return `<div class="example-card numeric-atpl"><h3>⚖️ Cas d’application Air Law</h3><p><b>Situation :</b> ${escATPL(c.ex||"Analyse une situation opérationnelle du chapitre.")}</p><ol><li><b>Source :</b> quel texte ou type de publication gouverne la situation ?</li><li><b>Champ :</b> à quel vol, espace, personne ou phase la règle s’applique-t-elle ?</li><li><b>Responsabilité :</b> qui doit agir ou décider ?</li><li><b>Action :</b> quelle conséquence opérationnelle découle de la règle ?</li></ol><div class="why-card"><b>🧠 Méthode d’examen</b><p>Source → champ d’application → conditions → responsabilité → action. Cette chaîne est plus fiable que la mémorisation d’une phrase isolée.</p></div></div>`;
  const e=numericATPL(m,c);
  return `<div class="example-card numeric-atpl"><h3>🧮 Exercice numérique ATPL — ${escATPL(e.title)}</h3><p><b>Données / énoncé :</b> ${escATPL(e.meta)}</p><ol>${e.steps.map((x,i)=>`<li>${escATPL(x)}</li>`).join("")}</ol><div class="answer"><b>Résultat :</b> ${escATPL(e.result)}</div><div class="why-card"><b>🔎 Interprétation :</b><p>Le calcul n'est utile que s'il permet de prédire ou de vérifier un effet en vol : performance, position, marge, indication ou décision opérationnelle.</p></div><div class="warning-card"><b>⚠️ Piège ECQB :</b> ${escATPL(e.trap)}</div></div>`;
}
function renderDeepLessonATPL(m,c,idx){
  const pct=Math.round(((idx+1)/m.d.length)*100), terms=termListATPL(m.c,c), rows=tableATPL(m.c,c), isLaw=m.c==="010";
  const explanations=c.cours.map((sec,i)=>{
    const e=deepExplanationATPL(m.c,c,sec,i), d=diagramSectionATPL(m,c,sec,i);
    const extra=isLaw
      ? `<div class="long-explain"><h4>⚖️ Lecture réglementaire</h4><p>${escATPL(e.p2)}</p><p>${escATPL(e.p3)}</p></div>`
      : `<div class="long-explain"><h4>🔬 Explication approfondie ATPL</h4><p>${escATPL(e.p2)}</p><p>${escATPL(e.p3)}</p></div>`;
    return `<section class="concept deep-section"><h3><span class="section-index">${i+1}</span>${escATPL(sec[0])}</h3><div class="deep-body"><p class="deep-p"><span class="deep-dot">1</span>${escATPL(e.p1)}</p>${d?`<div class="art section-diagram"><div class="diagram-title">📐 Illustration — ${escATPL(sec[0])}</div>${d}</div>`:""}${extra}<div class="why-card why-deep"><b>❓ Pourquoi ?</b><p>${escATPL(isLaw?"Parce qu’en Air Law une réponse correcte dépend autant de la source et du champ d’application que de la règle elle-même.":`Parce que ${modFocusATPL(m.c).charAt(0).toLowerCase()+modFocusATPL(m.c).slice(1)}`)}</p></div></div></section>`;
  }).join("");
  const termsHTML=terms.map(x=>`<div class="term"><b>${escATPL(x[0])}</b><span>${escATPL(x[1])}</span></div>`).join("");
  const rowsHTML=rows.slice(1).map(r=>`<tr>${r.map(x=>`<td>${escATPL(x)}</td>`).join("")}</tr>`).join("");
  const headHTML=`<tr>${rows[0].map(x=>`<th>${escATPL(x)}</th>`).join("")}</tr>`;
  const fHTML=(c.f||[]).map(x=>`<li><b>${escATPL(x[0])}</b> : <code>${escATPL(x[1])}</code></li>`).join("");
  const ptsHTML=(c.pts||[]).map(x=>`<li>${escATPL(x)}</li>`).join("");
  const pieges=(c.pieges||[]).map(x=>`<li>${escATPL(x)}</li>`).join("");
  const obj=c.cours.slice(0,Math.min(5,c.cours.length)).map(x=>`<li><b>${escATPL(x[0])}</b> : ${isLaw?"identifier la règle, son champ et son application opérationnelle.":"être capable de l'expliquer, de l'appliquer et d'identifier son effet en vol."}</li>`).join("");
  const prev=idx>0?`<button onclick="nav('${m.c}',${idx-1})">‹ Chapitre précédent</button>`:`<button disabled>‹ Chapitre précédent</button>`;
  const next=idx<m.d.length-1?`<button onclick="nav('${m.c}',${idx+1})">Chapitre suivant ›</button>`:`<button disabled>Chapitre suivant ›</button>`;
  const understand=isLaw
    ? `Ne mémorise pas une règle isolée. Reconstruis le raisonnement : <b>qui édicte ?</b> → <b>où et à qui cela s’applique ?</b> → <b>quelles conditions ?</b> → <b>qui est responsable ?</b> → <b>quelle action ?</b>. Sépare toujours ICAO, droit UE/EASA, AMC/GM et information AIP/NOTAM.`
    : `Si tu oublies momentanément la formule ou la définition, reconstruis-la à partir des grandeurs physiques ou opérationnelles. Demande-toi : « quelle est la référence ? », « qu'est-ce qui augmente ou diminue ? », « quelle conservation ou limite s'applique ? », puis vérifie avec les unités et l'ordre de grandeur.`;
  const relationsTitle=isLaw?"📚 Repères réglementaires et définitions":"📐 Relations, formules et unités";
  const relationsFallback=isLaw?"Le chapitre repose surtout sur des définitions, responsabilités, conditions et procédures : apprends leurs relations plutôt qu’une formule numérique.":"Aucune formule spécifique n'est fournie dans ce chapitre ; concentre-toi sur les définitions et relations qualitatives.";
  const links=isLaw
    ? `<div class="linkbox"><div><b>Source</b>ICAO / UE / EASA / publication opérationnelle.</div><div><b>Champ</b>Vol, espace, personne, service ou phase concernée.</div><div><b>Action</b>Responsabilité, autorisation, interdiction, information ou procédure qui en découle.</div></div>`

n</h3><p>${isLaw?"Explique la règle principale sans regarder le cours, puis prends le cas d’application et identifie successivement la source, le champ, le responsable, les conditions et l’action correcte.":"Avant de passer au chapitre suivant, essaie d'expliquer la notion principale sans regarder le texte, puis refais l'exercice numérique en changeant une donnée et prédis le sens de variation du résultat."}</p></div><div class="course-nav">${prev}${next}</div></div>`;

function v54ValKey(m,i){return v4Key(m,i)}

function v54ValidationMetrics(m,i){

  base:'https://rotatepilot.com/api/v1/question',
  attribution:'Rotate Pilot',
  slugs:{'010':'air-law','021':'airframes-systems','022':'instruments','031':'mass-balance','032':'performance','033':'flight-planning','040':'human-performance','050':'meteorology','061':'general-navigation','062':'radio-navigation','070':'operational-procedures','081':'principles-of-flight','090':'communications'}

function v4StripHtml(x){const d=document.createElement('div');d.innerHTML=String(x||'');return d.textContent||d.innerText||''}
async function v4FetchPublicBatch(code,count=5){
  const slug=V4_PUBLIC_BANK.slugs[code];if(!slug)return [];
  const url=`${V4_PUBLIC_BANK.base}?subject=${encodeURIComponent(slug)}&count=${Math.max(1,Math.min(5,count))}`;
  const res=await fetch(url,{headers:{'Accept':'application/json'}});if(!res.ok)throw new Error(`HTTP ${res.status}`);
  const data=await res.json(),arr=Array.isArray(data.questions)?data.questions:[];
  const optionText=x=>v4StripHtml(x&&typeof x==='object'?(x.text??x.label??''):x);
  return arr.map((q,j)=>({q:v4StripHtml(q.question),o:(q.options||[]).map(optionText),a:Number(q.correctAnswer),e:v4StripHtml(q.explanation||''),m:code,mi:null,title:slug,id:`Public · ${q.id||j+1}`,key:`public:${code}:${q.id||Date.now()+j}`,source:'Rotate Pilot',difficulty:q.difficulty||null,authority:q.authority||null,public:true})).filter(q=>q.q&&q.o.length>=2&&Number.isInteger(q.a)&&q.a>=0&&q.a<q.o.length)
}
async function v4FetchPublicQuestions(modules,count){
  modules=(modules||[]).filter(x=>V4_PUBLIC_BANK.slugs[x]);if(!modules.length)return [];
  const perModule=Math.max(1,Math.ceil(count/modules.length)),requests=[];
  modules.forEach(code=>{let left=perModule;while(left>0){requests.push(v4FetchPublicBatch(code,Math.min(5,left)));left-=5}});
  const settled=await Promise.allSettled(requests),out=[];settled.forEach(r=>{if(r.status==='fulfilled')out.push(...r.value)});
  const unique=[];const seen=new Set();for(const q of out){const k=q.m+'|'+q.q;if(!seen.has(k)){seen.add(k);unique.push(q)}}
  return v4Shuffle(unique).slice(0,count)
}

function v4NormText(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9+\- ]+/g,' ').replace(/\s+/g,' ').trim()}
function v4ExpandText(s){let x=v4NormText(s);for(const [fr,en] of V4_SYNONYM_PAIRS){if(x.includes(fr))x+=' '+en}return x}
function v4Tokens(s){return v4ExpandText(s).split(/\s+/).filter(w=>w.length>2&&!V4_STOP_WORDS.has(w))}
function v4ChapterWeights(c,code,i){const weights=new Map(),add=(txt,w)=>v4Tokens(txt).forEach(tok=>weights.set(tok,Math.max(w,weights.get(tok)||0)));add(v4ShortTitle(code,i,c.t),7);add(c.t,6);(c.cours||[]).forEach(s=>add(s[0],5));(c.pts||[]).forEach(x=>add(x,3));(c.f||[]).forEach(x=>add(x.join(' '),2));return weights}
function v4PublicRelevance(q,c,code,i){const weights=v4ChapterWeights(c,code,i),qt=new Set(v4Tokens([q.q,q.e,...(q.o||[])].join(' ')));let score=0,hits=0;for(const [tok,w] of weights){if(qt.has(tok)){score+=w;hits++}}const phrase=v4NormText(v4ShortTitle(code,i,c.t));if(phrase&&v4NormText(q.q+' '+q.e).includes(phrase))score+=16;return {score,hits}}
async function v4GetPublicPool(code){
  if(V4_PUBLIC_POOL_MEM[code]&&V4_PUBLIC_POOL_MEM[code].length)return V4_PUBLIC_POOL_MEM[code];
  const key=`atpl-v4-public-pool:${code}`;try{const cached=JSON.parse(localStorage.getItem(key)||'null');if(cached&&Date.now()-cached.at<21600000&&Array.isArray(cached.items)&&cached.items.length>=8){V4_PUBLIC_POOL_MEM[code]=cached.items;return cached.items}}catch(e){}
  const requests=Array.from({length:8},()=>v4FetchPublicBatch(code,5)),settled=await Promise.allSettled(requests),all=[];settled.forEach(r=>{if(r.status==='fulfilled')all.push(...r.value)});
  const seen=new Set(),items=[];for(const q of all){const k=v4NormText(q.q);if(k&&!seen.has(k)){seen.add(k);items.push(q)}}
  if(items.length){V4_PUBLIC_POOL_MEM[code]=items;try{localStorage.setItem(key,JSON.stringify({at:Date.now(),items}))}catch(e){}}
  return items
}

function v4CalcWind(){

        <text x="${((pAir.x+ground.x)/2+6).toFixed(1)}" y="${((pAir.y+ground.y)/2).toFixed(1)}" font-size="11" fill="#10b981">Vent ${ws.toFixed(0)}</text>
        <text x="${((118+ground.x)/2-4).toFixed(1)}" y="${((138+ground.y)/2+14).toFixed(1)}" font-size="11" fill="#ef4444">GS ${gs.toFixed(1)}</text>

      </svg>
