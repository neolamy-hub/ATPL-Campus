et analyse. Il n’est pas conçu comme outil temps réel de pilotage. La protection crash/fire et beacon sous-marin facilitent récupération."],["CVR","Cockpit Voice Recorder enregistre environnement sonore et communications du cockpit pendant durée réglementaire applicable. Son traitement obéit à protections spécifiques ; il sert à l’enquête de sécurité."],["Monitoring","Trend monitoring moteur/systèmes peut détecter dégradation avant dépassement limite. Un paramètre normal isolé n’exclut pas une tendance anormale."],["CVR, FDR et BITE","Les enregistreurs CVR/FDR servent à l’enquête et au suivi sécurité ; ils ne sont pas des calculateurs de pilotage. Le BITE (Built-In Test Equipment) aide au diagnostic par messages de défaut, historiques et tests intégrés. Il faut distinguer surveillance opérationnelle et maintenance."]],"pts":["BITE aide au diagnostic ; il ne remplace pas la procédure pilote.","FDR = paramètres ; CVR = audio cockpit.","Trend monitoring recherche évolution, pas seulement dépassement de limite.","BITE = aide au diagnostic ; CVR/FDR = enregistrement, pas pilotage."],"f":[],"pieges":["Ne pas confondre enregistreur de vol et système d’alerte.","Un fault code maintenance n’est pas forcément une panne active en vol."],"ex":"Une EGT qui augmente lentement à poussée comparable peut révéler une dégradation moteur avant toute alarme de dépassement.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"022 15","t":"Circuits numériques et calculateurs","syllabus":"022 15 00 00","cours":[["Binaire et logique","Les calculateurs représentent les données en binaire. AND, OR, NOT et combinaisons forment les fonctions logiques. Un bit est une unité binaire ; un byte/octet contient 8 bits."],["Conversion analogique/numérique","ADC échantillonne et quantifie un signal analogique ; DAC réalise l’opération inverse. Fréquence d’échantillonnage insuffisante peut perdre l’information dynamique ; résolution dépend du nombre de bits."],["Bus de données","ARINC et autres bus transportent des mots numériques entre LRUs. Architecture peut être point-à-point, broadcast ou réseau selon génération. Redondance des bus réduit perte de communication."],["Calculateurs","CPU exécute instructions, mémoire stocke programme/données, interfaces gèrent entrées/sorties. Watchdog et monitoring détectent blocages ; plusieurs calculateurs peuvent comparer/voter leurs résultats."],["Pannes communes","Une alimentation, un bus ou une donnée source commune peut affecter plusieurs calculateurs apparemment indépendants. La redondance doit donc inclure ségrégation physique/énergétique et parfois logiciels dissemblables."],["Bus de données et redondance","Les calculateurs communiquent via des bus et protocoles normalisés. La redondance, la ségrégation et le vote logique permettent de tolérer certaines pannes sans perte complète de fonction. Une architecture triplex ou duplex n’a pas le même niveau de tolérance ni la même logique de décision."]],"pts":["8 bits = 1 octet.","ADC : analogique→numérique ; DAC : inverse.","Bus commun peut être point de panne commun.","Voting compare plusieurs chaînes.","Architecture redondante ne signifie pas architecture invulnérable."],"f":[],"pieges":["Plus de bits améliore résolution, pas nécessairement exactitude du capteur.","Deux calculateurs redondants alimentés par le même bus ne sont pas totalement indépendants."],"ex":"À 100 Hz pendant 12 s, un ADC produit 1 200 échantillons par canal.","mod":"022 Instrumentation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 022","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true}];

function renderFlash022(){const x=F022[flash022.i];document.getElementById('study022').innerHTML=`<div class="panel"><h3>🧠 Flashcards 022</h3><div class="flash" onclick="flash022.back=!flash022.back;renderFlash022()">${flash022.back?x[1]:x[0]}</div><div class="pager"><button onclick="flash022.i=(flash022.i-1+F022.length)%F022.length;flash022.back=false;renderFlash022()">‹</button><button onclick="flash022.i=(flash022.i+1)%F022.length;flash022.back=false;renderFlash022()">›</button></div><p style="text-align:center;color:var(--muted)">${flash022.i+1}/${F022.length} · touche la carte pour retourner</p></div>`}
function showQuiz022(){quiz022={i:0,score:0,answered:false,order:[...Array(Q022.length).keys()].sort(()=>Math.random()-.5)};renderQuiz022()}
function renderQuiz022(){const k=quiz022.order[quiz022.i],q=Q022[k];document.getElementById('study022').innerHTML=`<div class="panel"><h3>📝 QCM 022 · ${quiz022.i+1}/${Q022.length}</h3><p><b>${q[0]}</b></p>${q[1].map((o,i)=>`<button class="qopt" onclick="answer022(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div id="ans022"></div></div>`}
function answer022(i){if(quiz022.answered)return;quiz022.answered=true;const k=quiz022.order[quiz022.i],q=Q022[k],ok=i===q[2];if(ok)quiz022.score++;document.querySelectorAll('.qopt').forEach((b,j)=>{if(j===q[2])b.classList.add('ok');if(j===i&&j!==q[2])b.classList.add('bad')});document.getElementById('ans022').innerHTML=`<div class="answer"><b>${ok?'✅ Correct':'❌ Incorrect'}</b><br>${q[3]}</div><button style="margin-top:10px" onclick="nextQuiz022()">${quiz022.i===Q022.length-1?'Voir le score':'Question suivante →'}</button>`}
function nextQuiz022(){if(quiz022.i===Q022.length-1){const pct=Math.round(quiz022.score/Q022.length*100);document.getElementById('study022').innerHTML=`<div class="panel"><h3>Résultat QCM 022</h3><div class="statgrid"><div class="stat"><b>${quiz022.score}/${Q022.length}</b>score</div><div class="stat"><b>${pct}%</b>réussite</div><div class="stat"><b>022</b>module</div></div><button onclick="showQuiz022()">Recommencer</button></div>`;return}quiz022.i++;quiz022.answered=false;renderQuiz022()}
function showCalc022(){document.getElementById('study022').innerHTML=`<div class="panel"><h3>🧮 Calculateurs instrumentation</h3><p><b>Pression dynamique simplifiée</b></p><div class="calcgrid"><input id="rho022" type="number" placeholder="ρ (kg/m³)" value="1.225"><input id="tas022" type="number" placeholder="TAS (m/s)"><button onclick="calcQ022()">Calculer q</button></div><div id="rq022" class="answer"></div><p><b>Mach</b></p><div class="calcgrid"><input id="tasMach022" type="number" placeholder="TAS (m/s)"><input id="aMach022" type="number" placeholder="Vitesse du son (m/s)" value="340"><button onclick="calcMach022()">Calculer M</button></div><div id="rmach022" class="answer"></div></div>`}
function calcQ022(){const r=+document.getElementById('rho022').value,v=+document.getElementById('tas022').value;document.getElementById('rq022').textContent=Number.isFinite(r)&&Number.isFinite(v)?`q = ½ρV² ≈ ${(0.5*r*v*v).toFixed(1)} Pa.`:'Vérifie les valeurs.'}
function calcMach022(){const v=+document.getElementById('tasMach022').value,a=+document.getElementById('aMach022').value;document.getElementById('rmach022').textContent=Number.isFinite(v)&&Number.isFinite(a)&&a>0?`Mach ≈ ${(v/a).toFixed(3)}.`:'Vérifie TAS et vitesse du son.'}

const FP033=[{"id":"033 01","t":"Planification VFR","syllabus":"033 01 00 00","cours":[["Préparer la route","Définir départ, destination, points tournants et dégagements ; identifier espaces, altitudes minimales, zones réglementées et aérodromes utilisables. La route vraie est convertie en cap en intégrant vent puis variation/déviation selon les données utilisées."],["Vent et navigation","À chaque branche : TAS + vent → WCA et GS ; distance/GS → temps ; temps×fuel flow → consommation. Les valeurs doivent être cohérentes avec altitude, masse et régime moteur."],["Météo et terrain","Visibilité, plafond, vent, convection et relief influencent route et altitude. Une route géométriquement courte peut être mauvaise si elle réduit options d’atterrissage ou traverse zones météo/terrain défavorables."],["Carburant","La planification inclut taxi, trip, réserves et éventuels besoins supplémentaires selon type d’opération/réglementation. Une simple quantité “pour la distance” est insuffisante."],["Navigation log","Le log rassemble route, cap, distances, temps, carburant, fréquences et points de décision. En vol, actual times et fuel checks servent à recalculer ETA et marge."],["Navigation log et déroutement","La préparation VFR s’appuie sur une log de navigation claire : caps, routes, temps, fréquences, altitudes minimales et points de décision. Un bon log facilite le déroutement en vol en cas de météo, trafic ou fermeture terrain. La préparation VFR est donc autant graphique que décisionnelle."]],"pts":["Triangle des vitesses fournit WCA et GS.","Temps = distance/GS.","Plan VFR intègre espaces, météo, terrain et options.","Carburant planifié inclut plus que trip fuel.","Un bon log de nav simplifie fortement le déroutement en vol."],"f":[["Temps","t = D / GS"],["Carburant branche","Fuel = débit × t"]],"pieges":["Utiliser TAS au lieu de GS pour le temps donne erreur avec vent.","Une route plus courte n’est pas toujours plus sûre ou faisable."],"ex":"180 NM à 120 kt GS donnent 1 h 30 ; à 36 unités/h, trip fuel simplifié = 54 unités avant réserves.","mod":"033 Flight Planning","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 033","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — fuel/flight planning","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"033 02","t":"Planification IFR","syllabus":"033 02 00 00","cours":[["Structure route","Analyser SID, ATS routes, direct segments, STAR/approach, niveaux disponibles, contraintes et alternates. Les procédures publiées et clairances réelles priment sur la route FMS prévue."],["Altitudes minimales","MEA/MORA/MSA et autres minima n’ont pas la même fonction. Une altitude de route doit assurer terrain/obstacle et parfois réception navigation/ATS selon définition de la donnée utilisée."],["Niveaux et croisière","Choix niveau dépend vent, température, masse, performance, RVSM, direction et restrictions ATC. Step climbs peuvent réduire fuel burn à mesure que masse diminue."],["GNSS/FMS","Le FMS accélère calcul de distances, temps et carburant mais dépend de données correctes : niveau, vent, température, masse et route. La disponibilité GNSS/PBN doit être vérifiée si la procédure l’exige."],["Alternates et contingences","Destination alternate, take-off alternate et en-route alternate répondent à des scénarios différents. Météo, minima, équipements et performance doivent être compatibles avec heure prévue d’utilisation."],["Routes, SID/STAR et alternates","En IFR, la route publiée, les minima, les espaces aériens et le choix des alternates font partie de la préparation. Une route acceptable au dépôt peut devenir non exploitable si NOTAM, météo ou performances ne permettent plus de respecter les exigences du vol."]],"pts":["Plan IFR = route + niveaux + procédures + alternates + performance/fuel.","Les différentes altitudes minimales n’ont pas la même définition.","FMS prédit ; il ne valide pas juridiquement la route.","Disponibilité navigation doit être vérifiée pour procédures dépendantes.","Un alternate n’est pas choisi “par habitude” mais selon des critères météo, opérationnels et de performance."],"f":[],"pieges":["Ne pas confondre MSA et altitude de route.","Une base navigation valide n’assure pas disponibilité GNSS."],"ex":"Un vent plus fort que prévu peut rendre le niveau optimal différent et dégrader fuel-at-destination ; le plan doit être surveillé en vol.","mod":"033 Flight Planning","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 033","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — fuel/flight planning","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"033 03","t":"Planification carburant","syllabus":"033 03 00 00","cours":[["Structure du carburant","Le cadre Air OPS distingue des blocs comme taxi, trip, contingency, alternate, final reserve et additional/discretionary selon opération et politique. Les définitions et méthodes de calcul doivent suivre le règlement et le manuel d’exploitation applicables."],["Trip fuel","Inclut carburant du décollage à l’atterrissage destination en tenant compte montée, croisière, descente, procédures et prévisions de vent/température. La masse évolue : performance et consommation doivent être cohérentes avec chaque phase."],["Contingency","Couvre écarts imprévus dans les hypothèses planifiées selon méthode approuvée. Il ne doit pas être utilisé comme marge “libre” avant départ sans considérer les exigences restantes."],["Alternate / final reserve","Alternate fuel permet approche interrompue puis vol vers alternate selon hypothèses applicables. Final reserve protège contre épuisement et a une définition opérationnelle spécifique ; atteindre cette réserve déclenche une logique décisionnelle/communication particulière."],["Surveillance","Comparer fuel remaining réel à fuel required au prochain point/destination. Si marge se dégrade, options : vitesse/altitude, route, alternate, diversion ou autres actions selon procédures. La décision doit intervenir avant qu’une réserve protégée ne soit compromise."],["Décomposition du carburant","Trip fuel, contingency fuel, alternate fuel, final reserve, additional fuel et extra fuel ne répondent pas au même objectif. Il faut savoir pourquoi chaque bloc existe et dans quelles circonstances du carburant additionnel devient nécessaire : météo dégradée, dégagement éloigné, attente probable ou stratégie de replanification."]],"pts":["Fuel planning est une architecture de blocs définis, pas un pourcentage unique universel.","Final reserve est protégée par logique opérationnelle spécifique.","Trip fuel dépend du profil réel et des vents/températures.","Surveillance compare fuel remaining à fuel required.","Le carburant total embarqué est la somme de blocs ayant chacun une justification spécifique."],"f":[["Endurance","t = fuel / flow"]],"pieges":["Ne pas appliquer un “5 %” universel sans contexte : méthodes ont évolué et dépendent du cadre.","Contingency et final reserve n’ont pas le même rôle."],"ex":"Une dérive négative de 300 kg à mi-route doit être projetée jusqu’à destination : si la marge restante devient insuffisante, agir tôt plutôt qu’attendre l’approche.","mod":"033 Flight Planning","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 033","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — fuel/flight planning","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"033 04","t":"Préparation prévol","syllabus":"033 04 00 00","cours":[["Données opérationnelles","Réunir météo, NOTAM/AIS, état aérodromes, restrictions, route, performance, masses et navigation. Les données doivent couvrir départ, route, destination et alternates sur la période d’utilisation."],["Météo","Analyser METAR/TAF, SIGMET, cartes vent/température, significant weather et tendances. La météo n’est pas une case “go/no-go” isolée : elle modifie route, niveau, fuel, alternates et performance."],["NOTAM et disponibilité","NOTAM peut fermer piste/navaid, modifier procédures ou imposer restrictions. Une aide indisponible peut invalider une procédure même si la météo est parfaite. Trier pertinence temporelle/géographique évite de manquer information critique."],["Performance et masse","Vérifier décollage, obstacle, montée, en-route et landing avec masse/conditions prévues. Un changement piste, vent ou température tardif peut imposer nouveau calcul."],["Briefing","Le résultat est une représentation partagée du plan : route, menaces, décisions, alternates, fuel, MEL/CDL et points de vigilance. Un briefing utile explique le “si… alors…”, pas seulement une récitation."],["Documents et données prévol","La préparation prévol complète réunit météo, NOTAM, performances, masse/centrage, carburant, état avion et contraintes opérationnelles. Un vol peut être techniquement possible mais non libérable si un document, une limitation MEL ou une donnée de masse manque ou est incohérente."]],"pts":["Prévol fusionne météo, AIS/NOTAM, performance, masse, route et disponibilité navigation.","Un changement tardif peut invalider un calcul précédent.","Briefing doit anticiper menaces et décisions.","Préparer un vol, c’est vérifier la cohérence globale des données, pas remplir des cases séparées."],"f":[],"pieges":["Ne pas considérer NOTAM uniquement comme information piste.","Une procédure peut être indisponible par panne navaid/data même si elle apparaît dans FMS."],"ex":"Une piste prévue devient contaminée : recalcul performance et éventuel changement masse/piste/alternate doivent précéder départ.","mod":"033 Flight Planning","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 033","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — fuel/flight planning","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"033 05","t":"Plan de vol ATS","syllabus":"033 05 00 00","cours":[["But et champs","Le FPL transmet aux ATS identité, règles/type de vol, nombre/type avion, équipement/capacités, départ, vitesse, niveau, route, destination, EET, alternates et informations complémentaires selon format ICAO."],["Item 10 / capacités","Les codes équipement/surveillance décrivent capacités réellement disponibles et approuvées. Déclarer une capacité non disponible peut conduire ATC à assigner route/procédure inexécutable."],["Route","Les conventions DCT, airways, points, changements de vitesse/niveau et indications PBN suivent format défini. Les erreurs syntaxiques peuvent conduire au rejet ou à interprétation incorrecte."],["Temps","EOBT concerne mouvement associé au départ ; EET et ETA ont définitions précises. Les modifications significatives de délai peuvent nécessiter DLA/CHG ou nouveau plan selon réseau/procédures."],["Messages ATS","FPL, CHG, DLA, CNL, ARR et DEP font partie des messages utilisés. Le pilote/exploitant doit s’assurer que le plan correspond au vol réellement prévu."],["Dépôt, activation et clôture du FPL","Tous les vols n’exigent pas les mêmes formalités ATS. Il faut distinguer dépôt, modifications, délai, activation et clôture, en particulier en environnement mixte VFR/IFR. Oublier de clôturer un plan de vol peut déclencher inutilement une alerte de recherche."]],"pts":["FPL déclare capacités réelles de l’aéronef/opérateur.","EOBT ≠ take-off time.","Route et équipements utilisent syntaxe ICAO normalisée.","Un délai important peut nécessiter mise à jour du plan.","Déposer un FPL ne suffit pas toujours : il faut parfois l’activer, puis le clôturer."],"f":[],"pieges":["Ne pas recopier aveuglément Item 10 d’un autre avion.","Un FPL accepté n’est pas une clairance ATC."],"ex":"Une route déposée avec capacité PBN inexistante peut générer une clairance incompatible : le codage FPL est une déclaration opérationnelle, pas administrative seulement.","mod":"033 Flight Planning","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 033","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — fuel/flight planning","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"033 06","t":"Suivi en vol et replanification","syllabus":"033 06 00 00","cours":[["Actual versus planned","À chaque point significatif, comparer temps, GS, fuel et météo réels aux prévisions. Une erreur isolée peut venir du vent ; une tendance persistante indique que le plan doit être recalculé."],["Recalcul ETA et fuel","Nouvelle GS → nouveau temps restant ; consommation réelle et nouveau profil → fuel at destination. Les systèmes FMS automatisent mais le pilote doit vérifier cohérence et conserver méthode indépendante approximative."],["Décisions","Une dégradation peut conduire à changement niveau, raccourci, holding réduit, alternate différent ou diversion. Chaque option modifie carburant requis et météo/minima de l’aérodrome visé."],["Point de décision / PNR","Concepts point of no return et equal time point servent à certaines opérations long-range. Ils dépendent GS outbound/home ou vers alternates, pas seulement distance géographique."],["Communications","Replanification doit être coordonnée avec ATC/opérations lorsque nécessaire. Une clairance est requise avant modification de trajectoire contrôlée sauf urgence."],["PNR, ETP et replanification","Le point of no return et l’equal time point sont des outils décisionnels essentiels, notamment en environnement éloigné ou contraint. Ils combinent vitesse, vent, carburant et options de dégagement. La replanification en vol consiste à recalculer avant d’être en difficulté, pas après."]],"pts":["Surveiller tendances temps/fuel, pas seulement valeur finale.","Replanification modifie à la fois route, météo, performance et fuel.","ETP/PNR utilisent temps/vitesses sol.","FMS doit être contrôlé par ordre de grandeur indépendant.","PNR et ETP sont des outils d’anticipation, pas des curiosités de calcul."],"f":[["ETA","temps restant = distance restante / GS"],["PNR simplifié","temps outbound = endurance disponible × GS retour /(GS aller + GS retour)"]],"pieges":["Ne pas utiliser TAS pour ETP/PNR avec vent.","Un raccourci ATC n’est utile que si accepté/clairé."],"ex":"Après 2 h de vol, consommation réelle supérieure de 5 % : projeter l’écart jusqu’à destination et vérifier réserves avant de décider de continuer.","mod":"033 Flight Planning","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 033","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — fuel/flight planning","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true}];

const HP040=[{"id":"040 01","t":"Facteurs humains et sécurité","syllabus":"040 01 00 00","cours":[["Pourquoi les facteurs humains","La sécurité dépend de l’interaction homme–machine–environnement–organisation. Les erreurs humaines ne sont pas traitées comme simple “faute personnelle” : conception, procédures, charge de travail, communication et culture peuvent rendre une erreur plus ou moins probable et plus ou moins récupérable."],["TEM","Threat and Error Management : menace = événement/condition externe ou interne augmentant complexité ; erreur = action/inaction conduisant à écart ; undesired aircraft state = situation de l’avion réduisant marge de sécurité. Le but est détecter tôt, piéger l’erreur et récupérer avant conséquence."],["CRM","Crew Resource Management utilise communication, leadership/followership, workload management, situation awareness, decision making et monitoring. Une bonne coopération ne signifie pas absence de désaccord : challenge-and-response et assertivité graduée protègent contre biais d’autorité."],["Automatisation","L’automatisation réduit certaines charges mais introduit mode confusion, complacency, skill fade et surprises d’automation. Le pilote doit connaître mode actif, trajectoire attendue et possibilité de revenir à un niveau d’automatisation inférieur."],["Culture de sécurité","Reporting non punitif dans le cadre approprié, analyse des événements et management du risque permettent apprentissage organisationnel. Une culture juste distingue erreur honnête, comportement à risque et violation délibérée sans supprimer responsabilité."],["SHELL, TEM et CRM","Les modèles SHELL et TEM aident à comprendre l’interaction entre l’humain, la machine, l’environnement et les procédures. Le CRM ne se limite pas à la communication : il couvre leadership, coopération, conscience de la situation et gestion de la charge de travail. En ATPL, la sécurité est pensée comme un système."]],"pts":["TEM : threats → errors → undesired aircraft states → outcome.","CRM optimise toutes les ressources disponibles.","Automation monitoring exige mode awareness.","Culture de sécurité favorise reporting et apprentissage.","TEM et CRM relient performance humaine et sécurité opérationnelle."],"f":[],"pieges":["Une erreur n’est pas forcément la cause racine.","Bonne CRM ne signifie pas consensus permanent.","Plus d’automatisation ne signifie pas automatiquement moins de risque."],"ex":"Une clairance ambiguë + forte charge de travail = threat ; mauvaise altitude sélectionnée = error ; descente sous altitude autorisée = undesired aircraft state.","mod":"040 Human Performance","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 040","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — équipages et limitations","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"040 02","t":"Physiologie aéronautique et santé","syllabus":"040 02 00 00","cours":[["Hypoxie","La pression partielle O₂ diminue avec altitude. Hypoxic hypoxia est la forme typique d’altitude ; symptômes incluent euphorie, jugement altéré, vision dégradée puis perte de conscience. Le danger est que l’auto-évaluation devient moins fiable. Oxygène et descente sont les réponses fondamentales."],["Hyperventilation","Respiration excessive élimine trop de CO₂ : paresthésies, vertiges, anxiété peuvent ressembler à hypoxie. Si cause incertaine en altitude, traiter d’abord possibilité d’hypoxie avec oxygène tout en contrôlant respiration."],["Pression et gaz","Boyle : volume gaz augmente quand pression diminue → oreilles, sinus, intestins. Henry : gaz dissous peut former bulles lors décompression → decompression sickness. Une plongée récente augmente risque en altitude."],["Vision","Vision photopique (cônes) : couleur/détail ; scotopique (bâtonnets) : faible lumière, pas couleur, meilleure hors fovéa. Adaptation nuit prend du temps ; lumière intense la détruit partiellement. Hypoxie affecte vision nocturne tôt."],["Équilibre et désorientation","Canaux semi-circulaires détectent accélérations angulaires, otolithes accélérations linéaires/gravité. En IMC, illusions comme leans, Coriolis, somatogravic montrent pourquoi les instruments doivent primer sur sensations."],["Audition, bruit et vibrations","Bruit prolongé fatigue et endommage audition ; protections réduisent exposition. Vibrations peuvent altérer lecture, confort et performance. Communications exigent rapport signal/bruit suffisant."],["Sommeil, fatigue, rythmes","Rythme circadien, dette de sommeil, durée d’éveil, travail de nuit et décalage horaire affectent vigilance. Microsleeps et baisse de performance peuvent survenir sans sensation subjective fiable. Caféine masque partiellement fatigue mais ne remplace pas sommeil."],["Santé, substances et médicaments","Alcool, drogues, certains antihistaminiques/sédatifs et maladie affectent performance. Automédication doit respecter règles médicales applicables ; stress, déshydratation et nutrition modulent également capacité."],["Vision, illusions et fatigue","La nuit, les illusions visuelles, l’autocinèse ou l’absence d’horizon fiable peuvent perturber fortement le pilote. Le système vestibulaire peut aussi induire des sensations trompeuses en virage ou en accélération. La fatigue et le rythme circadien diminuent la vigilance et la qualité de décision, parfois sans perception claire par l’équipage."]],"pts":["Hypoxie altère le jugement avant que le pilote ne la reconnaisse.","Boyle concerne volume des gaz ; Henry dissolution/décompression sickness.","En IMC, instruments priment sur sensations vestibulaires.","Vision nocturne dépend surtout des bâtonnets.","Fatigue combine rythme circadien + temps éveillé + dette sommeil.","Les illusions sensorielles sont crédibles pour le cerveau : d’où la nécessité de faire confiance aux instruments."],"f":[],"pieges":["Hyperventilation et hypoxie peuvent se ressembler.","Ne pas “faire confiance à l’oreille interne” en IMC.","Caféine ne rembourse pas une dette de sommeil."],"ex":"Après plongée puis vol en altitude cabine élevée, baisse de pression accroît risque de DCS : respecter délais recommandés et exigences médicales.","mod":"040 Human Performance","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 040","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — équipages et limitations","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"040 03","t":"Psychologie, perception et décision","syllabus":"040 03 00 00","cours":[["Perception et attention","Perception sélectionne/interprète stimuli, elle n’est pas une caméra fidèle. Attention est limitée : focalisation peut créer inattentional blindness ; tâches simultanées se concurrencent. Scan et priorisation protègent contre tunneling."],["Mémoire","Mémoire sensorielle, de travail et long terme ont capacités différentes. Working memory est limitée ; checklists et SOP réduisent charge. Stress peut réduire mémoire de travail et favoriser actions habituelles."],["Situation awareness","SA : percevoir éléments, comprendre leur signification, projeter leur évolution. Elle se perd par distraction, biais de confirmation, mauvaise communication ou automation surprise. Cross-check et verbalisation restaurent un modèle mental partagé."],["Décision","Processus : reconnaître problème, générer options, évaluer risques, décider, agir, réévaluer. Sous temps court, modèles naturalistic/recognition-primed dominent ; sous temps disponible, analyse structurée réduit biais."],["Biais","Confirmation cherche données confirmant hypothèse ; plan continuation bias pousse à poursuivre ; anchoring fixe sur première valeur ; availability surestime événements mémorables. La meilleure défense est chercher activement une information qui pourrait invalider le plan."],["Stress et charge de travail","Un niveau modéré d’activation peut améliorer performance ; trop faible ou trop élevé la dégrade. Workload doit être anticipé : aviate–navigate–communicate, délégation, automatisation appropriée et report d’une tâche non essentielle."],["Communication","Message doit être clair, reçu, compris et confirmé. Barrières : gradient d’autorité, langue, attentes, bruit, implicite. Closed-loop communication et readback/hearback réduisent ambiguïté."],["Biais, charge de travail et conscience de la situation","Le biais de confirmation, la fixation attentionnelle ou l’excès de confiance peuvent dégrader l’analyse. Une charge de travail trop forte ou trop faible favorise l’erreur. Maintenir la conscience de la situation consiste à percevoir, comprendre et anticiper l’évolution de la situation de vol."]],"pts":["Attention et mémoire de travail sont limitées.","Situation awareness inclut perception, compréhension, projection.","Biais de confirmation et continuation bias sont fréquents.","Décision doit être suivie d’une réévaluation.","Closed-loop communication réduit erreurs.","La conscience de la situation comporte perception, compréhension et projection."],"f":[],"pieges":["Être expérimenté n’élimine pas les biais.","Une checklist ne remplace pas compréhension de la situation.","Charge de travail élevée peut faire oublier tâches routinières."],"ex":"Approche instable avec météo dégradée : continuation bias peut pousser à “essayer encore”. Un critère stabilisé objectif favorise décision de remise de gaz.","mod":"040 Human Performance","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 040","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — équipages et limitations","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true}];

const GEN061=[{"id":"061 01","t":"Bases de navigation","syllabus":"061 01 00 00","cours":[["Terre et coordonnées","Latitude est angle nord/sud depuis équateur ; longitude angle est/ouest depuis Greenwich. 1 minute de latitude = 1 NM par définition nautique pratique ; longueur d’une minute de longitude diminue avec cos(latitude)."],["Great circle et rhumb line","Great circle est plus courte route sur sphère et coupe les méridiens sous angle variable sauf équateur/méridien. Rhumb line (loxodromie) coupe tous les méridiens sous angle constant, plus simple à suivre mais généralement plus longue."],["Convergence","Méridiens convergent vers pôles. Convergency entre deux méridiens ≈ différence longitude × sin latitude moyenne ; conversion angle est environ moitié de convergency pour une route courte sur Lambert."],["Directions","True, magnetic, compass doivent être distingués. Variation relie true↔magnetic ; deviation magnetic↔compass. Track est trajectoire sol ; heading orientation du nez ; drift = angle entre heading et track."],["Distance/vitesse/temps","GS est vitesse sur sol, TAS dans masse d’air. Temps = distance/GS. NM, kt et heures/minutes doivent rester cohérents : 1 kt = 1 NM/h."],["Temps et longitude","Terre tourne 360° en 24 h → 15°/h → 1°=4 min. Local mean time varie avec longitude ; UTC est référence aviation. Traverser International Date Line modifie date civile."],["Crépuscule","Sunrise/sunset et twilight dépendent latitude, date et altitude. Civil twilight correspond soleil jusqu’à 6° sous horizon ; navigation/examen utilise définitions données dans source applicable."],["Grand cercle, loxodromie et temps","La route grand cercle est la plus courte entre deux points sur la sphère, tandis qu’une loxodromie coupe les méridiens sous angle constant. Les fuseaux horaires et la relation longitude-temps restent des bases de navigation. Comprendre la géométrie terrestre évite des erreurs de raisonnement plus tard dans les calculs."]],"pts":["1 min latitude = 1 NM.","Great circle = plus court ; rhumb line = track constant.","Track ≠ heading ; TAS ≠ GS.","15° longitude = 1 h ; 1° = 4 min.","Convergency augmente avec latitude.","Grand cercle = distance minimale ; loxodromie = cap constant sur projection adaptée."],"f":[["Distance longitude","Departure = DLo(min) × cos latitude"],["Convergency","Conv ≈ DLo × sin latitude moyenne"],["Temps","t = D / GS"]],"pieges":["Ne pas utiliser DLo comme distance NM sauf équateur.","E/W variation/deviation : appliquer convention avec signe cohérent."],"ex":"À 60°N, 60 min de longitude correspondent environ 60×cos60° = 30 NM de departure.","mod":"061 General Navigation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 061","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"061 02","t":"Magnétisme et compas de navigation","syllabus":"061 02 00 00","cours":[["Champ terrestre","Déclinaison/variation = angle vrai–magnétique ; isogonales relient variation égale, agonic line variation nulle. Dip augmente vers pôles ; composante horizontale diminue, rendant compas moins fiable aux hautes latitudes."],["Déviation","Champ électrique/magnétique de l’avion dévie le compas. Compensation réduit sans supprimer ; deviation card donne correction résiduelle par cap. La déviation peut changer après maintenance/configuration."],["Conversions","Méthode sûre : représenter toutes directions avec signes algébriques ou appliquer une convention stable. Le but est passer True → Magnetic → Compass ou inverse sans mémotechnique ambiguë."],["Erreurs dynamiques","Dip cause turning/acceleration errors du compas direct. Leur signe dépend hémisphère et cap. Navigation pratique utilise systèmes de cap asservis ou inertiels pour stabilité, avec compas direct comme secours/référence."],["Grid navigation","Aux hautes latitudes, méridiens convergent trop vite pour usage normal true/magnetic heading. Grid north fixe une référence cartographique ; grivation relie grid et magnetic."],["Variation, déviation et changement annuel","La variation magnétique dépend du lieu et évolue dans le temps. La déviation est propre à l’aéronef et à sa configuration. Pour naviguer proprement, il faut savoir dans quel ordre appliquer variation, déviation et éventuellement les conversions Vrai/Magnétique/Compas."]],"pts":["Variation : Terre ; déviation : avion.","Dip rend compas direct moins fiable hautes latitudes.","Conversions directionnelles doivent utiliser une convention de signe cohérente.","Grid navigation devient utile près des pôles.","Variation = environnement terrestre ; déviation = erreur propre au compas de l’avion."],"f":[],"pieges":["Ne pas confondre deviation avec drift.","Une variation Est/Ouest n’est pas “positive/négative” universelle sans convention."],"ex":"Track vrai 090°, variation 8°W : avec convention T + variation signée (W négative) = magnetic 082° ; toujours contrôler la convention du support.","mod":"061 General Navigation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 061","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"061 03","t":"Cartes et projections","syllabus":"061 03 00 00","cours":[["Propriétés","Une carte ne peut conserver simultanément forme, aire, distance et direction sur toute la Terre. Conformal conserve angles localement — essentiel navigation ; équidistante conserve certaines distances ; equal-area conserve surfaces."],["Mercator","Cylindrique conforme ; méridiens parallèles verticaux, parallèles horizontaux ; rhumb lines droites. L’échelle augmente avec latitude, donc distorsion énorme près pôles. Great circle est courbe vers pôle sauf équateur/méridien."],["Lambert conformal conic","Parallèles arcs concentriques, méridiens droites convergeant vers pôle fictif. Great circles sont presque droites sur étendues aviation moyennes ; échelle exacte aux standard parallels et varie entre/au-delà. Utilisée fréquemment cartes en-route."],["Polar stereographic","Conforme, adaptée hautes latitudes. Méridiens rayonnent du pôle, parallèles cercles concentriques. Great circles sont approximativement droites selon domaine. Grid navigation peut être superposée."],["Échelle","1:500 000 signifie 1 unité carte = 500 000 mêmes unités réelles ; 1 cm = 5 km ≈2,70 NM. L’échelle peut varier avec position sur certaines projections."],["Plotting","Position par lat/long doit utiliser graduations correctes ; track mesuré par rapport au méridien/local grid selon projection. Une erreur de quelques degrés sur longue route produit gros cross-track."],["Convergence et mesure sur carte","Toutes les projections ne conservent pas les mêmes propriétés. En navigation, il faut savoir ce que la carte respecte : angles, surfaces, directions locales ou distances. La lecture d’une route, d’un cap ou d’une distance doit toujours être replacée dans le type de projection utilisé."]],"pts":["Mercator : rhumb line droite, échelle augmente avec latitude.","Lambert : conforme, great circle presque droite.","Polar stereographic : adaptée hautes latitudes.","1:500 000 → 1 cm = 5 km.","Une carte n’est jamais le territoire : sa projection impose des conventions de lecture."],"f":[["Échelle","distance réelle = distance carte × dénominateur"]],"pieges":["Ne pas mesurer track sur Lambert par rapport à un bord de carte arbitraire.","Échelle Mercator n’est pas constante avec latitude."],"ex":"8,4 cm sur 1:500 000 = 42 km ≈22,7 NM.","mod":"061 General Navigation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 061","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"061 04","t":"Dead reckoning et triangle des vitesses","syllabus":"061 04 00 00","cours":[["Vecteurs","Velocity air (TAS+heading) + wind vector (direction TO) = ground vector (GS+track). Vent est donné FROM en météo, donc il faut inverser 180° pour le vecteur mathématique."],["WCA","Crosswind déplace trajectoire ; pilote pointe dans vent. WCA dépend composante travers, TAS et angle vent. Head/tail component modifie GS. Pour petits angles, approximation sin WCA ≈ crosswind/TAS."],["Navigation computer","CRP/E6B résout triangle, conversions, densité/TAS, temps/fuel. Une réponse doit rester contrôlée par estimation : fort headwind doit réduire GS, vent de droite doit imposer correction vers droite."],["1-in-60","Après 60 NM, 1 NM d’écart ≈1°. Track error ≈ off-track distance×60/distance flown. Closing angle ≈ off-track×60/distance remaining. Correction cap approximative = track error + closing angle."],["Pétrole et temps","Une erreur GS affecte ETA et fuel. Recalcul en vol : nouvelle GS depuis distance/time observés, puis temps restant et carburant."],["Great-circle corrections","Sur longues routes, track initial/final peut changer ; convergency et conversion angle relient great-circle à représentation Lambert. DR doit savoir quelle référence de track est demandée."],["Règle du 1 dans 60 et corrections","La règle du 1 dans 60 permet d’estimer rapidement dérive, erreur de cap ou correction de route. Elle n’est pas qu’un outil d’examen : elle reste un excellent moyen de contrôle mental en vol. L’idée clé est de raisonner en écarts angulaires faibles."]],"pts":["Air vector + wind vector = ground vector.","Vent météo est FROM ; vecteur agit TO.","1-in-60 donne angle d’erreur et closing angle.","Headwind ↓GS ; tailwind ↑GS.","La règle du 1 dans 60 sert à estimer une correction, pas à remplacer un calcul complet quand il est disponible."],"f":[["1-in-60","angle ≈ off-track × 60 / distance"],["WCA petit angle","WCA(rad) ≈ crosswind / TAS"]],"pieges":["Ne pas additionner vent FROM comme vecteur TO.","Track error seul ne ramène pas sur route : il faut closing angle."],"ex":"Après 60 NM, 2 NM à droite : track error ≈2°. S’il reste 120 NM, closing angle ≈1°. Correction totale ≈3° vers gauche, hors correction vent initiale.","mod":"061 General Navigation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 061","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"061 05","t":"Navigation en vol","syllabus":"061 05 00 00","cours":[["Position fixing","Visual fixes, radials/bearings, DME arcs, GNSS et intersections donnent position avec qualités différentes. Deux lignes qui se coupent sous angle proche de 90° donnent meilleure géométrie que lignes presque parallèles."],["Track monitoring","Comparer track/heading/GS prévus et observés. Une dérive peut provenir vent différent, erreur compas ou navigation. Ne pas appliquer correction avant identifier référence et sens."],["Recalcul","Actual time over point donne GS moyenne ; mise à jour ETA et fuel. Si position incertaine, élargir scan, conserver altitude sûre et utiliser toutes aides disponibles."],["Lost procedures","En VFR, principes généraux : aviate, maintain safe altitude, navigate using last known position/time/heading, communicate as appropriate. Les procédures exactes dépendent espace/État/opérateur."],["Diversion","Une diversion nécessite route, distance, altitude, vent, fuel et aérodrome. Une estimation rapide correctement contrôlée vaut mieux qu’un calcul précis fondé sur position erronée."],["Fixes, relèvements et déroutement","La navigation en vol repose sur la comparaison continue entre position estimée et position observée. Les points fixes peuvent provenir de repères visuels, d’aides radio, de GNSS ou de recoupements. En cas d’écart, le déroutement doit être anticipé avant dégradation carburant ou météo."]],"pts":["Fix geometry influence précision.","Actual GS permet recalcul ETA/fuel.","Position uncertainty doit être gérée avant qu’elle augmente.","Diversion = nouvelle mini-planification.","Cross-check et anticipation sont les deux piliers d’une navigation sûre."],"f":[],"pieges":["Deux bearings presque parallèles donnent mauvais fix.","Ne pas corriger un écart GPS comme s’il venait forcément du vent."],"ex":"Une branche prévue 100 kt prend 36 min pour 60 NM mais réalité 40 min → GS moyenne 90 kt ; recalculer reste du vol à partir de cette observation.","mod":"061 General Navigation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 061","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true}];

const RN062=[{"id":"062 01","t":"Propagation radio","syllabus":"062 01 00 00","cours":[["Spectre et longueur d’onde","f×λ=c. LF/MF/HF/VHF/UHF/SHF ont comportements différents. Plus fréquence augmente, longueur d’onde diminue. Antennes et propagation dépendent de cette relation."],["Ground, sky et space waves","LF/MF peuvent suivre sol ; HF peut être réfractée/réfléchie par ionosphère permettant longues distances ; VHF/UHF/SHF sont surtout line-of-sight, avec portée dépend hauteur antennes et relief."],["Réfraction et interférences","Atmosphère peut réfracter les ondes ; multipath crée erreurs par trajets réfléchis ; diffraction contourne partiellement obstacles aux basses fréquences. Night effect sur NDB résulte changements ionosphériques favorisant sky wave."],["Portée VHF","Radio horizon augmente avec racine des hauteurs émetteur/récepteur. Monter l’avion augmente portée mais n’élimine pas shadowing terrain ni limitations puissance/fréquence."],["Modulation","AM code information par amplitude et est utilisée en VHF aviation voix ; FM varie fréquence. SSB réduit bande/puissance en HF. Pulse modulation est utilisée radar/DME."],["Polarisation, skip et night effect","Selon la fréquence et le mode de propagation, une onde peut suivre le sol, être réfractée par l’ionosphère ou subir des réflexions parasites. Le night effect des NDB et les variations de portée HF s’expliquent par ces mécanismes. Le pilote doit relier le comportement de l’aide radio à la physique de propagation."]],"pts":["fλ=c.","HF peut utiliser sky wave ; VHF est principalement line-of-sight.","Night effect concerne particulièrement NDB/MF.","Multipath = plusieurs trajets du même signal.","La fiabilité d’une aide radio dépend aussi du type de propagation qu’elle utilise."],"f":[["Longueur d’onde","λ = c / f"]],"pieges":["Higher frequency ne signifie pas automatiquement plus grande portée.","VHF peut être bloquée par terrain malgré altitude raisonnable."],"ex":"À 125 MHz, λ ≈ 300/125 = 2,4 m.","mod":"062 Radio Navigation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 062","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"062 02","t":"Aides radio : NDB, VOR, DME, ILS","syllabus":"062 02 00 00","cours":[["NDB/ADF","NDB émet omnidirectionnel LF/MF ; ADF indique relative bearing vers station, combiné au heading pour magnetic bearing selon référence. Erreurs : night effect, coastal refraction, terrain/mountain, quadrantal et orage. Station passage donne indication instable/inversion."],["VOR","VOR compare phase signal référence/variable pour fournir radial magnétique FROM station. OBS/CDI indique écart par rapport course sélectionné et TO/FROM. Radial n’est pas heading. Cone of confusion près verticale station."],["DME","Mesure slant range par temps aller-retour d’impulsions interrogateur/transpondeur. À grande distance vs hauteur, slant≈horizontal ; près station en altitude, indication approche différence verticale. Ground speed/time-to-station DME n’est valable que si route sensiblement vers/de station."],["ILS localizer","LOC donne guidage latéral sur VHF, course line étroite ; back course existe sur certaines installations mais sens indications dépend équipement. Sensibilité angulaire signifie déviation linéaire diminue en approchant piste."],["ILS glide path","GP UHF donne trajectoire verticale nominale proche 3°. Faux glide slopes existent au-dessus ; interception par dessous est méthode normale. DDM alimente needle; marker beacons ont largement disparu mais restent notion historique selon syllabus."],["Erreurs/identification","Toujours identifier aide avant usage si requis. VOR scalloping/site error, NDB effects, DME channel pairing et ILS interference/critical areas peuvent dégrader guidance. Flag ou ident absent signifie ne pas utiliser comme source valide."],["Interprétation HSI/RMI et éléments ILS","Le HSI fusionne information de cap et déviation latérale, ce qui réduit certaines ambiguïtés du CDI classique. Le RMI combine aiguilles radio et référence cap. En ILS, localizer, glide path, marker beacons historiques et zones critiques au sol doivent être compris comme un système cohérent d’approche."]],"pts":["VOR radial = direction FROM station.","ADF donne relative bearing ; magnetic bearing nécessite heading.","DME = slant range.","ILS LOC latéral, GP vertical.","Intercepter GP par dessous évite faux lobes supérieurs.","Un instrument plus intégré ne change pas la logique fondamentale de la navigation : il la rend plus lisible."],"f":[["DME horizontal","d_h = √(d_slant² − h²)"]],"pieges":["TO/FROM n’indique pas sens de virage.","DME GS n’est pas GS avion si trajectoire n’est pas vers station.","ADF pointer n’est pas automatiquement QDM sans calcul."],"ex":"DME 5 NM avec 8 000 ft (~1,32 NM) au-dessus station → horizontal ≈√(25−1,74)=4,82 NM.","mod":"062 Radio Navigation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 062","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"062 03","t":"Radar, transpondeur et météo radar","syllabus":"062 03 00 00","cours":[["Radar primaire","Émet impulsion puis mesure temps retour pour distance et azimut antenne pour bearing. Distance = c×Δt/2 car trajet aller-retour. Réflectivité dépend taille/matériau cible, distance et fréquence."],["SSR / Mode S","Secondary radar interroge transpondeur qui répond identité/altitude ou données Mode S. Mode A code, Mode C altitude pression, Mode S adresse unique et échanges sélectifs. ADS-B est diffusion coopérative de position/données, distincte du radar primaire."],["Airborne weather radar","Radar météo détecte principalement précipitation par réflectivité. Tilt gère élévation faisceau ; gain peut être automatique/manuelle. Couleurs traduisent niveaux de retour, pas directement turbulence. Attenuation derrière forte pluie peut masquer cellule dangereuse."],["Ground mapping / doppler","À certains réglages/frequences, radar peut afficher relief/côtes ; Doppler exploite décalage fréquence pour vitesse relative. Modernes radars utilisent traitement doppler et turbulence detection dans limites."],["Limites","Beam width augmente zone couverte avec distance, réduisant résolution. Ground clutter, shadowing et anomalous propagation compliquent interprétation. Une zone noire derrière rouge intense peut être attenuation shadow, pas trou sûr."]],"pts":["Radar range = cΔt/2.","Mode A identité, C altitude, S data/adresse sélective.","Weather radar détecte précipitation, pas nuage sec.","Atténuation peut masquer danger."],"f":[["Distance radar","R = c Δt / 2"]],"pieges":["Ne pas confondre SSR avec radar primaire.","ADS-B dépend données avion et coopération.","Écho faible derrière forte cellule peut être un shadow."],"ex":"Retour après 100 µs : distance = 3×10⁸×100×10⁻⁶/2 = 15 km.","mod":"062 Radio Navigation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 062","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"062 06","t":"GNSS","syllabus":"062 06 00 00","cours":[["Mesure pseudorange","Récepteur compare code reçu à code généré pour estimer temps de propagation → pseudorange. Quatre satellites permettent résoudre position 3D et biais horloge récepteur ; géométrie influence précision via DOP."],["Constellations","GPS, Galileo et autres GNSS ont segments spatial, contrôle et utilisateur. Utilisation multi-constellation améliore disponibilité/géométrie mais intégrité/certification de l’équipement restent déterminantes."],["Erreurs","Horloges/orbites, ionosphère, troposphère, multipath et bruit affectent pseudorange. Dual-frequency ou modèles corrigent ionosphère ; satellite elevation faible est souvent plus sensible aux erreurs/multipath."],["Intégrité et RAIM","RAIM utilise redondance des mesures pour détecter incohérence. Basic fault detection nécessite au moins 5 satellites utiles ; exclusion d’un satellite défaillant généralement 6, selon géométrie et algorithme. SBAS fournit corrections/intégrité depuis réseau sol et satellites géostationnaires."],["Augmentation","ABAS = à bord (RAIM/FDE etc.), SBAS = satellite-based, GBAS = ground-based local. Ils améliorent accuracy/integrity/availability selon fonction, mais ne sont pas interchangeables pour chaque procédure."],["Opérations","Disponibilité prédite, NOTAM GNSS, interference/jamming/spoofing et équipement approuvé doivent être considérés. Une position plausible peut être fausse en spoofing ; cross-check inertiel/radio/raw data reste important."],["Intégrité, brouillage et spoofing","Le GNSS peut perdre son utilité non seulement par panne mais aussi par brouillage ou spoofing. Une position affichée “propre” n’est pas toujours une position vraie. D’où l’importance des alertes d’intégrité, des cross-checks et des moyens alternatifs lorsque disponibles."]],"pts":["4 satellites pour solution 3D + clock bias.","RAIM FD typiquement 5 satellites ; FDE 6 dans principe de base.","DOP décrit géométrie, pas erreur brute seule.","SBAS/GBAS/ABAS sont des augmentations différentes.","Jamming supprime signal ; spoofing peut créer position fausse plausible.","Jamming dégrade le signal ; spoofing peut fournir un signal plausible mais faux."],"f":[],"pieges":["Bonne accuracy instantanée ne garantit pas integrity.","Plus de satellites ne garantit pas bonne géométrie si tous dans même zone ciel."],"ex":"Une alerte RAIM signifie que l’intégrité requise n’est plus garantie même si position affichée semble stable.","mod":"062 Radio Navigation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 062","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true},{"id":"062 07","t":"PBN : RNAV et RNP","syllabus":"062 07 00 00","cours":[["Concept PBN","Performance-Based Navigation spécifie performance requise plutôt que capteur imposé. Une navigation specification est RNAV ou RNP ; RNP inclut on-board performance monitoring and alerting, contrairement à RNAV."],["Accuracy, integrity, continuity, availability","Accuracy décrit erreur admissible typique ; integrity confiance/alerte ; continuity capacité sans interruption pendant opération ; availability probabilité service disponible. Une valeur RNAV 1/RNP 1 n’est pas simplement “largeur route 1 NM”."],["Total System Error","TSE combine Path Definition Error, Flight Technical Error et Navigation System Error. Autopilot/FD réduit souvent FTE ; database coding peut affecter PDE ; capteurs affectent NSE."],["Functional requirements","Certaines specs imposent RF legs, radius, vertical navigation, alerting ou capteurs spécifiques. L’équipement et l’approbation opérationnelle doivent correspondre à la procédure publiée."],["RNP APCH / AR","RNP APCH couvre approches PBN courantes ; RNP AR APCH exige autorisation spécifique, équipements/procédures/formation renforcés et peut utiliser valeurs RNP plus faibles/RF legs."],["Surveillance","Le FMS compare estimated position uncertainty/ANP à RNP selon architecture. Une alerte inability RNP signifie que la performance requise n’est plus assurée et doit déclencher procédure."],["Spécifications navigation et surveillance embarquée","Dans l’approche PBN, il faut distinguer le niveau de performance exigé, les capteurs admissibles et la capacité d’alerte du système. L’ANP ou indicateur comparable permet de comparer la performance actuelle à la RNP requise. Une navigation “précise” sans surveillance adéquate n’est pas équivalente à une vraie capacité RNP."]],"pts":["RNP = RNAV + monitoring/alerting embarqué.","TSE = PDE + FTE + NSE (concept vectoriel/erreur totale).","RNAV/RNP value décrit exigence de performance, pas simple largeur airway.","RNP AR exige autorisation spécifique.","RNP = performance requise + monitoring/alerting, pas seulement précision instantanée."],"f":[["Erreur totale","TSE résulte de PDE, FTE et NSE"]],"pieges":["Ne pas confondre RNP 1 avec “±1 NM garanti 100 % du temps”.","GNSS disponible ne signifie pas que toute spécification PBN est autorisée."],"ex":"Si ANP estimée dépasse RNP requise et système alerte, l’équipage doit appliquer la procédure plutôt que continuer parce que la carte paraît correcte.","mod":"062 Radio Navigation","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 062","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"}],"v5":true}];

const OP070=[{"id":"071 01","t":"Exigences opérationnelles générales","syllabus":"071 01 00 00","cours":[["Responsabilités","Exploitant établit procédures, formation, équipements et conformité ; commandant conserve responsabilité opérationnelle du vol et peut prendre mesures nécessaires à sécurité. Les rôles exacts viennent Air OPS/OM et ne se réduisent pas à “PIC décide tout”."],["MEL/CDL","MEL permet exploitation avec certains équipements inopérants sous conditions, dérivée de MMEL et approuvée. CDL traite éléments externes manquants et pénalités. Un item “deferred” exige procédures (M)/(O), placards, intervalles et limitations."],["Documents et données","Manuals, charts, navigation databases, performance data et checklists doivent être appropriés et à jour. Les bases aéronautiques doivent être gérées avec contrôle d’intégrité/validité."],["Équipements de sécurité","Emergency exits, slides/rafts, ELT, life jackets, fire extinguishers, first aid, megaphones, oxygen etc. dépendent configuration/opération. L’équipage doit connaître localisation, vérification prévol et limitations."],["Cabine et passagers","Briefing, seat belts, baggage stowage, exits, dangerous goods notifications et sterile cockpit contribuent à sécurité. Turbulence ou évacuation nécessitent coordination cockpit–cabine."],["All-weather operations","LVO/CAT II/III exigent avion, aérodrome, équipage et procédures approuvés. Minima ne sont pas une propriété du seul ILS. RVR, DH/DA et visual references doivent être compris avec Air OPS et procédure publiée."],["ACAS/TAWS","Les systèmes préviennent mid-air collision et CFIT ; leurs alertes ont procédures prioritaires. Équipage doit éviter de “moyenner” une RA TCAS avec instruction ATC contradictoire."],["MEL, CDL et documentation","Les exigences opérationnelles incluent les documents à bord, l’état réglementaire de l’aéronef et l’usage correct de la MEL/CDL le cas échéant. Une panne tolérable n’est acceptable que si elle respecte les conditions, limitations et délais prévus. L’approche opérationnelle est donc plus fine qu’un simple “ça marche / ça ne marche pas”."],["Briefing, discipline cockpit et passagers","Les briefings équipage et passagers, la discipline de cockpit et le respect des procédures stériles participent directement à la sécurité. Les phases critiques exigent une réduction volontaire des distractions et une standardisation forte des actions."]],"pts":["MEL autorise sous conditions ; elle n’est pas liste de pannes ignorables.","Minima AWO dépendent avion+aérodrome+équipage+approbation.","Commandant reste responsable de sécurité, dans cadre procédures/règles.","ACAS/TAWS demandent réactions standardisées.","MEL/CDL = tolérance encadrée, jamais liberté d’improviser."],"f":[],"pieges":["MMEL n’est pas directement MEL de l’avion exploité.","Équipement inopérant accepté peut entraîner pénalité performance/procédure."],"ex":"Un pack inopérant peut être dispatchable MEL mais limiter altitude ou ETOPS/EDTO : “MEL OK” ne signifie pas vol inchangé.","mod":"070 Operational Procedures","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 070","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — procédures opérationnelles","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"071 02","t":"Procédures spéciales et dangers","syllabus":"071 02 00 00","cours":[["Givrage au sol","Clean aircraft concept : surfaces critiques doivent être exemptes de contamination au décollage. De-icing enlève contamination, anti-icing protège temporairement ; holdover time est une estimation conditionnelle, pas garantie. Precipitation type/intensity et température modifient efficacité."],["Givrage en vol","Accrétion sur ailes, empennage, moteurs et sondes peut dégrader contrôle/performance. Severe icing/SLD peut excéder systèmes. Utiliser anti-ice/de-ice selon AFM/OM et sortir de la zone si nécessaire."],["Turbulence / wake","Wake vortex est plus fort derrière avion lourd, propre et lent ; descend puis se déplace avec vent. Spacing ATC réduit risque mais pilote doit considérer vent travers et trajectoire surtout au décollage/atterrissage. Turbulence penetration speed réduit charges selon avion."],["Windshear/microburst","Alertes prédictives/réactives doivent être suivies. Pendant escape manoeuvre, priorité énergie/attitude/poussée selon procédure type ; changement configuration prématuré peut aggraver. Évitement est préférable."],["Volcanic ash","Éviter : abrasion, obscurcissement, pitot, contamination cabine, surtout extinction/érosion moteurs turbines. Weather radar conventionnel n’est pas fiable pour ash. VAAC/SIGMET et NOTAM guident planification."],["Birds/FOD","Risque maximal près sol/aérodromes mais collisions existent en altitude. Ingestion peut endommager moteur ; FOD piste menace pneus/moteurs. Reporting et inspections sont barrières."],["Aquaplaning et piste contaminée","Dynamic hydroplaning dépend vitesse/pneu/pression ; viscous/reverted rubber ont mécanismes différents. Contamination réduit friction et accélération/décélération ; runway condition code/braking action servent aux calculs actuels."],["Dangerous goods","Classification, emballage, labels, chargement et information au commandant réduisent risque. Certains articles passagers ont exceptions encadrées ; occurrence/leak exige procédure spécifique."],["Contamination piste, vent de travers et cisaillement","Les procédures spéciales couvrent notamment piste contaminée, action de freinage réduite, vent de travers élevé et windshear. Le bon réflexe n’est pas seulement d’identifier le danger mais d’appliquer la procédure dédiée, y compris remise de gaz ou rejet de décollage quand nécessaire."],["Wake turbulence, icing et marchandises dangereuses","Le sillage turbulent, les opérations de dégivrage/antigivrage et les marchandises dangereuses relèvent aussi des connaissances opérationnelles clés. Une séparation visuelle apparente ne supprime pas le risque de wake turbulence ; de même, le respect des règles DG protège équipage, avion et passagers."]],"pts":["Clean aircraft : aucune contamination critique au décollage.","Holdover time n’est pas garantie absolue.","Wake vortex : lourd, propre, lent = fort.","Volcanic ash doit être évitée.","Contamination piste affecte accélération, contrôle et freinage.","Une procédure spéciale existe précisément parce que les procédures normales deviennent insuffisantes."],"f":[],"pieges":["Radar météo ne détecte pas fiablement cendres.","Ne pas décoller juste parce que HOT n’est pas expiré si contamination réapparaît.","Braking action “good” ne supprime pas calcul réglementaire."],"ex":"Après de-icing, une neige plus forte que prévu invalide les hypothèses de holdover : une nouvelle inspection/traitement peut être nécessaire.","mod":"070 Operational Procedures","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 070","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — procédures opérationnelles","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true},{"id":"071 04","t":"Opérations spécialisées","syllabus":"071 04 00 00","cours":[["Cadre","Specialised operations couvrent activités où avion est utilisé pour tâche spécifique et risque diffère transport standard. Pour ATPL(A), l’objectif est comprendre que SOP, risk assessment, équipements et autorisations/déclarations peuvent être spécifiques."],["SOP","Une opération spécialisée définit responsabilités, profils, minima, crew coordination, zones de travail, énergie/obstacles et procédures anormales. Le SOP est dérivé d’une évaluation des risques et du type de mission."],["Équipements","Équipement mission ne doit pas compromettre navigabilité/évacuation/commandes. Arrimage, alimentation électrique, communications et limitations doivent être intégrés au cadre opérationnel."],["Gestion du risque","Faible altitude, charge externe, observation, photographie ou autres missions peuvent augmenter risque collision/obstacle et workload. Une barrière efficace est spécifique au danger identifié."],["RVSM, PBN, LVO et approbations spéciales","Certaines opérations exigent des approbations, équipements et entraînements spécifiques : RVSM, navigation PBN avancée, low visibility operations, ETOPS/EDTO selon programme, etc. L’idée centrale est qu’une capacité technique n’autorise pas à elle seule l’opération : il faut aussi l’approbation et le cadre procédural."]],"pts":["Opérations spécialisées utilisent SOP et risk assessment dédiés.","Équipement mission doit être compatible avec navigabilité et sécurité.","Le cadre n’est pas identique au transport commercial standard.","Capacité avion + approbation opérationnelle + formation = triptyque des opérations spécialisées."],"f":[],"pieges":["Ne pas apprendre des procédures hélicoptère HEC/HESLO comme applicables à l’ATPL(A).","Une autorisation de mission ne supprime pas limitations AFM."],"ex":"Une mission photo à basse altitude exige évaluation obstacles, trajectoire, workload et échappatoires au-delà de la simple capacité de l’avion.","mod":"070 Operational Procedures","verified":"2026-09-28","refs":[{"label":"EASA Part-FCL — Subject 070","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-aircrew-regulation-eu-no-11782011"},{"label":"EASA Air Operations — procédures opérationnelles","url":"https://www.easa.europa.eu/en/document-library/easy-access-rules/easy-access-rules-air-operations"}],"v5":true}];

["Une approche doit être poursuivie…",["Quel que soit le vent","Seulement si les conditions, minima et performances permettent de le faire en sécurité","Dès qu’un contrôleur l’autorise","Même avec une piste fermée"],1,"La décision d’approche/atterrissage dépend notamment des minima, conditions et performances."],
